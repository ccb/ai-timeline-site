st-regina-barzilay-wins-macarthur-genius-grant-1011"], "confidence": "high", "links": {"summary": [[510, 517, "e:halicin-antibiotic-2020"]]}}, {"id": "danielle-li", "name": "Danielle Li", "born": null, "died": null, "woman": true, "roles": ["economist", "labor and innovation economist"], "affiliations": ["MIT Sloan School of Management (David Sarnoff Professor of Management of Technology)", "National Bureau of Economic Research (Faculty Research Fellow)", "Harvard Business School and Kellogg School of Management (former faculty)"], "summary": "Danielle Li is an economist at MIT's Sloan School of Management who studies how organisations judge ideas, projects and people, and how new technology changes work. She has a PhD in economics from MIT and a Harvard degree in mathematics and the history of science. With Erik Brynjolfsson and Lindsey Raymond she wrote 'Generative AI at Work', one of the first large studies of an AI chatbot assistant in a real workplace. Following more than 5,000 customer-support agents as the tool rolled out, the team found that issues resolved per hour rose about 14 to 15 percent on average and by about a third for novice and less-skilled workers, while the most experienced gained little. Customers were also more polite. The paper appeared as a working paper in 2023 and in the Quarterly Journal of Economics in 2025.", "contributions": [{"event_id": "generative-ai-at-work-2023", "text": "Co-authored 'Generative AI at Work' (NBER 2023; QJE 2025), a field study finding the largest productivity gains from an AI assistant went to novice call-center agents."}], "lenses": ["work-and-labor"], "penn_connection": "", "portrait": null, "media": [], "sources": ["MIT Sloan faculty directory, Danielle Li, https://mitsloan.mit.edu/faculty/directory/danielle-li", "Brynjolfsson, Li and Raymond, 'Generative AI at Work', NBER Working Paper 31161 (2023), https://www.nber.org/papers/w31161; Quarterly Journal of Economics 140(2):889-942 (2025)", "E. Brynjolfsson, D. Li and L. Raymond, 'Generative AI at Work', Quarterly Journal of Economics 140(2):889-942 (2025), doi:10.1093/qje/qjae044, https://academic.oup.com/qje/article/140/2/889/7990658"], "confidence": "high", "links": {"summary": []}}, {"id": "andrei-markov", "name": "Andrei Markov", "born": "1856-06-14", "died": "1922-07-20", "woman": false, "roles": ["mathematician", "probability theorist"], "affiliations": ["St Petersburg University (professor from 1886)", "Imperial Academy of Sciences, St Petersburg (full member from 1896)"], "summary": "Andrei Markov was a Russian mathematician, born in Ryazan in 1856, who spent his career at St Petersburg University and the Academy of Sciences. In 1906 he introduced what are now called Markov chains: sequences in which the chance of what comes next depends only on what came just before. In 1913 he tried the idea on real text. He took the first 20,000 letters of Pushkin's verse novel Eugene Onegin, marked each as a vowel or consonant, and counted how often each kind followed the other. The pattern was clear: a vowel was much less likely after a vowel. It was the first statistical model of a piece of language, and today's language models, which predict the next word from what came before, are distant descendants. He died in Petrograd in 1922.", "contributions": [{"event_id": "markov-pushkin", "text": "Counted vowel and consonant pairs in 20,000 letters of Eugene Onegin (1913), the first statistical model of a text."}], "lenses": ["pre-computing", "core"], "penn_connection": "", "portrait": {"url": "https://commons.wikimedia.org/wiki/File:Andrei_Markov.jpg", "license": "Public domain", "credit": "Unknown author Unknown author. Public domain, via Wikimedia Commons.", "rights_status": "clear", "source_url": "https://commons.wikimedia.org/wiki/File:Andrei_Markov.jpg", "src": "photos/people-portraits/andrei-markov-commons.jpg"}, "media": [], "sources": ["https://en.wikipedia.org/wiki/Andrey_Markov", "MacTutor History of Mathematics, 'Andrei Andreyevich Markov', https://mathshistory.st-andrews.ac.uk/Biographies/Markov/", "B. Hayes, 'First Links in the Markov Chain', American Scientist 101 (2013), https://www.americanscientist.org/article/first-links-in-the-markov-chain"], "confidence": "high", "links": {"summary": []}}, {"id": "norbert-wiener", "name": "Norbert Wiener", "born": "1894-11-26", "died": "1964-03-18", "woman": false, "roles": ["mathematician", "founder of cybernetics", "early critic of automation"], "affiliations": ["Massachusetts Institute of Technology (mathematics faculty)", "Harvard University (PhD 1913)"], "summary": "Norbert Wiener was an American mathematician, born in Columbia, Missouri, in 1894. A child prodigy, he finished a Harvard PhD at 18 and spent his career at MIT. His 1948 book Cybernetics, a word he coined, described animals and machines alike as systems steered by feedback: sensing the result of an action and correcting course. Cybernetics was the leading science of minds and machines when the term 'artificial intelligence' was coined in 1955. Wiener also thought hard about consequences. In The Human Use of Human Beings (1950) and a 1960 article in Science, he warned that if we build machines we cannot easily stop, 'we had better be quite sure that the purpose put into the machine is the purpose which we really desire', an early statement of what is now called the alignment problem.", "contributions": [{"event_id": "wiener-cybernetics", "text": "Published Cybernetics (1948), founding the science of feedback and control in animals and machines."}, {"event_id": "wiener-moral-consequences-1960", "text": "Warned in Science (1960) that machines' purposes must be the ones we really want, an early statement of the alignment problem."}, {"event_id": "paris-cybernetics-1951", "text": "Attended the January 1951 Paris conference on calculating machines, sometimes called an earlier birthplace of AI."}], "lenses": ["core", "work-and-labor", "philosophy"], "penn_connection": "", "portrait": {"url": "https://commons.wikimedia.org/wiki/File:Norbert_Wiener.png", "license": "CC0 (http://creativecommons.org/publicdomain/zero/1.0/deed.en)", "credit": "Garry Olsh. CC0, via Wikimedia Commons.", "rights_status": "clear", "source_url": "https://commons.wikimedia.org/wiki/File:Norbert_Wiener.png", "src": "photos/people-portraits/norbert-wiener-commons.png"}, "media": [], "sources": ["https://en.wikipedia.org/wiki/Norbert_Wiener", "MacTutor History of Mathematics, 'Norbert Wiener', https://mathshistory.st-andrews.ac.uk/Biographies/Wiener_Norbert/", "N. Wiener, 'Some Moral and Technical Consequences of Automation', Science 131(3410):1355-1358 (1960), https://doi.org/10.1126/science.131.3410.1355"], "confidence": "high", "links": {"summary": [[175, 186, "e:wiener-cybernetics"]]}}, {"id": "herbert-simon", "name": "Herbert Simon", "born": "1916-06-15", "died": "2001-02-09", "woman": false, "roles": ["political scientist", "economist", "psychologist", "computer scientist", "AI pioneer"], "affiliations": ["Carnegie Institute of Technology / Carnegie Mellon University (faculty 1949-2001)", "University of Chicago (BA 1936, PhD 1943)", "RAND Corporation (consultant)"], "summary": "Herbert Simon, born in Milwaukee in 1916, taught at Carnegie Mellon in Pittsburgh from 1949 until his death in 2001, working across management, psychology and computer science. With Allen Newell and Cliff Shaw he built the Logic Theorist (1956), a program that found proofs of theorems in logic using rules of thumb, and then the General Problem Solver. In 1957 he predicted that within ten years a computer would be world chess champion and would discover an important new mathematical theorem. Chess took forty years, which makes his forecast the classic example of AI overpromising. Simon also won the 1978 Nobel Prize in economics for showing that people make 'good enough' decisions within limits of time and knowledge, an idea he called bounded rationality. He and Newell shared the 1975 Turing Award.", "contributions": [{"event_id": "logic-theorist-1956", "text": "Co-built the Logic Theorist with Newell and Shaw, which proved 38 of the first 52 theorems in chapter 2 of Principia Mathematica."}, {"event_id": "simon-newell-theorem-prediction", "text": "Predicted in 1957, with Newell, that a computer would find an important new theorem within ten years."}, {"event_id": "simon-chess-ten-years", "text": "Predicted in 1957 that a computer would be world chess champion within ten years; it took forty."}, {"event_id": "general-problem-solver", "text": "Co-developed the General Problem Solver, which separated general reasoning from knowledge of any one puzzle."}], "lenses": ["core", "symbolic-and-math"], "penn_connection": "", "portrait": {"license": "Public domain (Commons tag PD-US-1978-89)", "credit": "Herbert A. Simon, 1981. Rochester Institute of Technology, News & Events (19 March 1981), via RIT Digital Archive / Wikimedia Commons. Public domain.", "rights_status": "clear", "source_url": "https://commons.wikimedia.org/wiki/File:Herbert_Simon,_RIT_NandE_Vol13Num11_1981_Mar19_Complete.jpg", "src": "photos/dartmouth-1956/04-herbert-simon-1981-rit.jpg"}, "media": [], "sources": ["https://en.wikipedia.org/wiki/Herbert_A._Simon", "INFORMS, 'Herbert A. Simon' biographical profile, https://www.informs.org/Explore/History-of-O.R.-Excellence/Biographical-Profiles/Simon-Herbert-A", "Carnegie Mellon Tepper School, faculty profile 'Herb Simon', https://www.cmu.edu/tepper/anniversary/profiles/faculty/herb-simon.html", "N. J. Nilsson, The Quest for Artificial Intelligence (2009/2010), https://web.archive.org/web/20231217215646/http://ai.stanford.edu/~nilsson/QAI/qai.pdf"], "confidence": "high", "links": {"summary": [[182, 194, "p:Allen Newell"], [223, 237, "e:logic-theorist-1956"], [330, 352, "e:general-problem-solver"], [743, 762, "e:simon-behavioral-model-1955"], [794, 806, "e:turing-award-2019"]]}}, {"id": "allen-newell", "name": "Allen Newell", "born": "1927-03-19", "died": "1992-07-19", "woman": false, "roles": ["computer scientist", "cognitive psychologist", "AI pioneer"], "affiliations": ["RAND Corporation (from 1950)", "Carnegie Mellon University (PhD under Herbert Simon; faculty)"], "summary": "Allen Newell, born in San Francisco in 1927, joined the RAND Corporation in 1950, where he studied how Air Force crews handled information. There he met Herbert Simon, who became his PhD adviser and lifelong partner at Carnegie Mellon. With Simon and the RAND programmer Cliff Shaw he built the Logic Theorist (1956), the one working AI program shown at the Dartmouth workshop, and the General Problem Solver, which tried to separate general reasoning from knowledge of any one puzzle. To write them, the three invented list processing, a way of storing linked pieces of information that AI programming relied on for decades. Newell spent his later career on a single theory of how human thinking works, built into a program called Soar. He shared the 1975 Turing Award with Simon and died in Pittsburgh in 1992.", "contributions": [{"event_id": "logic-theorist-1956", "text": "Co-created the Logic Theorist with Simon and Shaw, the first program built to find mathematical proofs."}, {"event_id": "general-problem-solver", "text": "Co-developed the General Problem Solver and its 'means-ends analysis' strategy."}, {"event_id": "dartmouth-workshop", "text": "Attended the 1956 Dartmouth workshop with Simon, bringing the Logic Theorist."}], "lenses": ["core", "symbolic-and-math"], "penn_connection": "", "portrait": {"license": "In Copyright - Non-Commercial Use Permitted (rightsstatements.org InC-NC/1.0); copyright Carnegie Mellon University", "credit": "Herbert Simon (seated, left) and Allen Newell at a chessboard, Carnegie Institute of Technology, c. 1958. Carnegie Mellon University Archives, General Photograph Collection, GPC_SimonH_002_013.", "rights_status": "verify", "source_url": "http://web.archive.org/web/20260125072605/https://digitalcollections.library.cmu.edu/node/393431", "src": "photos/dartmouth-1956/03-newell-simon-chess-cmu.jpg"}, "media": [], "sources": ["https://en.wikipedia.org/wiki/Allen_Newell", "H. A. Simon, 'Allen Newell, 1927-1992', National Academy of Sciences Biographical Memoirs vol. 71 (1997), https://www.nationalacademies.org/read/5737/chapter/11", "IEEE Computer Society, 'Allen Newell' pioneer page, https://history.computer.org/pioneers/newell.html"], "confidence": "high", "links": {"summary": [[153, 166, "p:Herbert Simon"], [295, 309, "e:logic-theorist-1956"], [358, 367, "e:dartmouth-workshop"], [386, 408, "e:general-problem-solver"], [757, 769, "e:turing-award-2019"]]}}, {"id": "james-lighthill", "name": "James Lighthill", "born": "1924-01-23", "died": "1998-07-17", "woman": false, "roles": ["applied mathematician", "fluid dynamicist", "author of the 1973 Lighthill Report"], "affiliations": ["University of Cambridge (Lucasian Professor of Mathematics, 1969-1979)", "University College London (Provost, 1979-1989)", "Imperial College London (Royal Society Research Professor, from 1964)"], "summary": "Sir James Lighthill was a British applied mathematician, born in Paris in 1924, who founded the study of how jet engines make noise. He held Cambridge's Lucasian chair, once Newton's, from 1969 and later led University College London. Britain's Science Research Council asked him, as an outsider, to judge academic AI research. His 1973 report said the field had failed to deliver on its promises and that general-purpose robots and reasoning programs were far from working. In a televised BBC debate, John McCarthy, Donald Michie and Richard Gregory argued back, but the council sided with Lighthill, and British funding for AI was cut back to a few centres. Together with US cuts, this began the first 'AI winter'. He died in 1998 while swimming around the Channel island of Sark.", "contributions": [{"event_id": "lighthill-report-1973", "text": "Wrote 'Artificial Intelligence: A General Survey' (1973) for the Science Research Council, which led to deep cuts in UK AI funding."}, {"event_id": "bbc-lighthill-debate", "text": "Defended his report in a 1973 BBC televised debate at the Royal Institution against McCarthy, Michie and Gregory."}], "lenses": ["core", "companies-and-money"], "penn_connection": "", "portrait": null, "media": [{"title": "BBC TV 'Controversy' debate on the Lighthill Report, Royal Institution, 1973 (81-minute recording, University of Edinburgh AIAI)", "url": "https://www.aiai.ed.ac.uk/events/lighthill1973/", "kind": "debate recording"}], "sources": ["https://en.wikipedia.org/wiki/James_Lighthill", "MacTutor History of Mathematics, 'Sir James Lighthill', https://mathshistory.st-andrews.ac.uk/Biographies/Lighthill/", "J. Lighthill, 'Artificial Intelligence: A General Survey', SRC 1973, http://www.chilton-computing.org.uk/inf/literature/reports/lighthill_report/p001.htm", "University of Edinburgh AIAI, 'BBC TV - June 1973 - Lighthill Controversy Debate at the Royal Institution', https://www.aiai.ed.ac.uk/events/lighthill1973/"], "confidence": "high", "links": {"summary": [[502, 515, "p:John McCarthy"], [517, 530, "p:Donald Michie"]]}}, {"id": "feng-hsiung-hsu", "name": "Feng-hsiung Hsu", "born": "1959-01-01", "died": null, "woman": false, "roles": ["computer engineer", "chess-chip designer", "principal designer of Deep Blue"], "affiliations": ["National Taiwan University (BS electrical engineering)", "Carnegie Mellon University (PhD computer science)", "IBM Research (from 1989)", "Microsoft Research Asia (from 2003)"], "summary": "Feng-hsiung Hsu, born in Keelung, Taiwan, in 1959, studied electrical engineering at National Taiwan University and started graduate work on computer chess at Carnegie Mellon in 1985. There he designed ChipTest, a chess machine built around a custom chip, and then Deep Thought, which won a prize in 1988 for playing at grandmaster level. In 1989 he and Murray Campbell moved to IBM, where Hsu became the principal designer of Deep Blue. In May 1997 Deep Blue beat world champion Garry Kasparov in a six-game match, using hundreds of special chess chips to search about 200 million positions a second. Hsu told the story in Behind Deep Blue (2002). In 2007 he predicted that a world-champion Go machine could be built within ten years. AlphaGo beat Lee Sedol in 2016.", "contributions": [{"event_id": "chiptest-1985", "text": "Began ChipTest at Carnegie Mellon, the custom-chip chess machine that led to Deep Thought and Deep Blue."}, {"event_id": "deep-blue-beats-kasparov", "text": "Principal designer of Deep Blue, which beat Garry Kasparov 3.5-2.5 in May 1997."}, {"event_id": "hsu-go-prediction-2007", "text": "Wrote in IEEE Spectrum (2007) that 'a world-champion-level Go machine can be built within 10 years'."}], "lenses": ["core"], "penn_connection": "", "portrait": {"license": "unknown - verify (Computer History Museum; underlying copyright IBM)", "credit": "Courtesy of IBM Archives; via Computer History Museum, accession L02645333. Joe Hoane, Feng-hsiung Hsu (seated) and Murray Campbell.", "rights_status": "verify", "source_url": "https://www.computerhistory.org/chess/stl-431614f67157b/", "src": "photos/deep-blue-1997/05-core-team-hoane-hsu-campbell-1997.jpg"}, "media": [{"title": "Oral History of Feng-Hsiung Hsu (Computer History Museum, 2005-02-14)", "url": "https://www.computerhistory.org/chess/orl-43343cd40c2a1/", "kind": "oral history"}], "sources": ["https://en.wikipedia.org/wiki/Feng-hsiung_Hsu", "F.-H. Hsu, 'Cracking GO', IEEE Spectrum, 2007-10-01 (author bio and prediction), https://spectrum.ieee.org/cracking-go", "IBM, 'Deep Blue', IBM Heritage, https://www.ibm.com/history/deep-blue", "Computer History Museum, Oral History of Feng-Hsiung Hsu, 2005, https://www.computerhistory.org/chess/orl-43343cd40c2a1/"], "confidence": "high", "links": {"summary": [[202, 210, "e:chiptest-1985"], [427, 436, "e:deep-blue-beats-kasparov"], [480, 494, "p:Garry Kasparov"], [736, 743, "e:alphago-lee-sedol"]]}}, {"id": "yoshua-bengio", "name": "Yoshua Bengio", "born": "1964-03-05", "died": null, "woman": false, "roles": ["computer scientist", "deep-learning pioneer", "AI safety advocate"], "affiliations": ["Université de Montréal (full professor, Computer Science and Operations Research)", "Mila - Quebec AI Institute (founder; scientific director until 2025, now Founder and Scientific Advisor)", "LawZero (co-president and scientific director, from 2025)", "International AI Safety Report (chair)"], "summary": "Yoshua Bengio, born in Paris in 1964, is a computer scientist at the Université de Montréal and founder of Mila, the Quebec AI institute. Through the 1990s and 2000s, when neural networks were out of fashion, he kept working on them. In 2014 his lab, with Dzmitry Bahdanau and Kyunghyun Cho, introduced 'attention', which let a translation network look back at the input words that matter for each word it writes. The transformer of 2017, the design behind ChatGPT, is built on attention. He shared the 2018 Turing Award with Geoffrey Hinton and Yann LeCun. Since 2023 he has become one of the leading scientific voices warning about risks from advanced AI. He chairs the International AI Safety Report and in 2025 launched LawZero, a nonprofit working on safer AI.", "contributions": [{"event_id": "attention-bahdanau-2014", "text": "Senior author of the 2014 paper that introduced neural attention for machine translation."}, {"event_id": "turing-award-2019", "text": "Shared the 2018 Turing Award (announced March 2019) with Hinton and LeCun for deep learning."}, {"event_id": "cais-extinction-statement-2023", "text": "Signed the 2023 statement that reducing extinction risk from AI should be a global priority."}, {"event_id": "consciousness-indicators-2023", "text": "Co-authored the 2023 report checking AI systems against scientific theories of consciousness."}], "lenses": ["core", "philosophy"], "penn_connection": "", "portrait": {"license": "CC BY-SA 2.0", "credit": "Photo: Jeremy Barande / Ecole polytechnique, CC BY-SA 2.0, via Flickr / Wikimedia Commons", "rights_status": "clear", "source_url": "https://commons.wikimedia.org/wiki/File:Yoshua_Bengio_(36468299790).jpg", "src": "photos/neural-network-revival/NN-bengio-polytechnique-2017.jpg"}, "media": [{"title": "'The catastrophic risks of AI - and a safer path' (TED2025, April 2025)", "url": "https://www.ted.com/talks/yoshua_bengio_the_catastrophic_risks_of_ai_and_a_safer_path", "kind": "talk"}], "sources": ["https://en.wikipedia.org/wiki/Yoshua_Bengio", "Mila, 'Transition in Mila's scientific direction' (2025), https://mila.quebec/en/news/transition-in-milas-scientific-direction", "Bahdanau, Cho and Bengio, arXiv 1409.0473 (2014), https://arxiv.org/abs/1409.0473"], "confidence": "high", "links": {"summary": [[418, 429, "e:attention-is-all-you-need"], [457, 464, "e:chatgpt-launch-2022"], [508, 520, "e:turing-award-2019"], [526, 541, "p:Geoffrey Hinton"], [546, 556, "p:Yann LeCun"]]}}, {"id": "ilya-sutskever", "name": "Ilya Sutskever", "born": "1986", "died": null, "woman": false, "roles": ["computer scientist", "deep-learning researcher", "OpenAI co-founder and former chief scientist", "CEO of Safe Superintelligence"], "affiliations": ["University of Toronto (BSc, MSc, PhD 2013 under Geoffrey Hinton)", "DNNresearch (co-founder, 2012)", "Google Brain (2013-2015)", "OpenAI (co-founder, chief scientist, 2015-2024)", "Safe Superintelligence Inc. (co-founder 2024; CEO from July 2025)"], "summary": "Ilya Sutskever was born in 1986 in Gorky (now Nizhny Novgorod) in the Soviet Union, grew up in Israel and moved to Canada at 16. As a PhD student of Geoffrey Hinton at the University of Toronto, he co-wrote AlexNet with Alex Krizhevsky and Hinton, the 2012 image-recognition network that convinced the field to switch to deep learning. Google bought the trio's small company in 2013, and at Google Brain he co-developed sequence-to-sequence learning, an early neural approach to translation. In late 2015 he co-founded OpenAI and became its chief scientist, and in 2020 he co-wrote GPT-f, an early language model that wrote formal proofs. In November 2023 he was one of the board members who voted to remove Sam Altman, Altman returned within a week and Sutskever left the board. He left OpenAI in May 2024 and co-founded Safe Superintelligence.", "contributions": [{"event_id": "alexnet-2012", "text": "Co-author, with Krizhevsky and Hinton, of AlexNet, which won ImageNet 2012 by a wide margin."}, {"event_id": "dnnresearch-2013", "text": "Co-founder of DNNresearch, bought by Google in 2013 at the start of big tech's bidding war for deep-learning talent."}, {"event_id": "gpt-f-2020", "text": "Co-authored GPT-f with Stanislas Polu, whose proofs were accepted into the Metamath library."}], "lenses": ["core", "companies-and-money"], "penn_connection": "", "portrait": {"license": "CC BY 2.0", "credit": "Photo: Steve Jurvetson (CC BY 2.0)", "rights_status": "clear", "source_url": "https://www.flickr.com/photos/jurvetson/15105407149/", "src": "photos/imagenet-alexnet-2012/05-ilya-sutskever-stanford-panel-2014.jpg"}, "media": [{"title": "'Ilya Sutskever - We're moving from the age of scaling to the age of research' (Dwarkesh Podcast, 2025-11-25)", "url": "https://www.dwarkesh.com/p/ilya-sutskever-2", "kind": "interview"}], "sources": ["https://en.wikipedia.org/wiki/Ilya_Sutskever", "University of Toronto News, 'Google acquires U of T neural networks company' (2013-03-12), https://www.utoronto.ca/news/google-acquires-u-t-neural-networks-company", "Krizhevsky, Sutskever and Hinton, NeurIPS 2012, https://proceedings.neurips.cc/paper_files/paper/2012/file/c399862d3b9d6b76c8436e924a68c45b-Paper.pdf"], "confidence": "high", "links": {"summary": [[149, 164, "p:Geoffrey Hinton"], [207, 214, "e:alexnet-2012"], [220, 235, "p:Alex Krizhevsky"], [519, 525, "e:openai-founded-2015"], [582, 587, "e:gpt-f-2020"], [708, 718, "p:Sam Altman"], [827, 844, "e:bostrom-superintelligence-2014"]]}}, {"id": "dario-amodei", "name": "Dario Amodei", "born": "1983", "died": null, "woman": false, "roles": ["AI researcher", "Anthropic co-founder and CEO"], "affiliations": ["Anthropic (co-founder, CEO, 2021-)", "OpenAI (vice president of research, 2016-2020)", "Google Brain", "Baidu (2014-2015)", "Princeton University (PhD, biophysics)", "Stanford University School of Medicine (postdoctoral scholar)"], "summary": "Dario Amodei was born in San Francisco in 1983, earned a physics degree at Stanford and a PhD in biophysics at Princeton, then turned to AI, working at Baidu and Google Brain. He joined OpenAI in 2016, rose to vice president of research and helped develop GPT-2 and GPT-3. In 2018 he and Danny Hernandez reported that the computing power used for the largest AI training runs had been doubling about every three and a half months, a key piece of the 'bigger is better' scaling story. In 2021 he, his sister Daniela Amodei and other former OpenAI staff founded Anthropic, a public-benefit company focused on AI safety, which makes the Claude models. He is its chief executive. In October 2026 Anthropic filed publicly to list its shares on Nasdaq.", "contributions": [{"event_id": "compute-doubling-2018", "text": "Co-authored OpenAI's 2018 analysis showing training compute for the largest models doubling every 3.4 months since 2012."}, {"event_id": "anthropic-founded-2021", "text": "Co-founded Anthropic in 2021 with Daniela Amodei and other former OpenAI staff, and became its CEO."}, {"event_id": "anthropic-public-s1-2026", "text": "Leads Anthropic as CEO at the time of its public filing to list on Nasdaq (2026-10-26)."}], "lenses": ["companies-and-money", "core"], "penn_connection": "", "portrait": {"license": "CC BY 2.0 (Wikimedia Commons)", "credit": "Simon Walker / No 10 Downing Street, CC BY 2.0 (Flickr), via Wikimedia Commons", "rights_status": "clear", "source_url": "https://commons.wikimedia.org/wiki/File:The_Prime_Minister_meets_with_AI_developers.jpg", "src": "photos/alphago-alphafold-llms/12-sunak-hassabis-amodei-altman-2023.jpg"}, "media": [{"title": "Lex Fridman Podcast #452, 'Dario Amodei: Anthropic CEO on Claude, AGI & the Future of AI & Humanity' (2024-11-11)", "url": "https://lexfridman.com/dario-amodei/", "kind": "interview"}], "sources": ["https://en.wikipedia.org/wiki/Dario_Amodei", "Lex Fridman Podcast #452 episode page (identifies him as Anthropic CEO), https://lexfridman.com/dario-amodei/", "Wikimedia Commons, 'The Prime Minister meets with AI developers' (No 10 caption: Dario Amodei, CEO, Anthropic, 2023-05-24), https://commons.wikimedia.org/wiki/File:The_Prime_Minister_meets_with_AI_developers.jpg", "Anthropic, S-1 announcement (2026-10-26), https://www.anthropic.com/news/s1-sec"], "confidence": "high", "links": {"summary": [[186, 192, "e:openai-founded-2015"], [256, 261, "e:gpt2-2019"], [266, 271, "e:gpt3-2020"], [507, 521, "p:Daniela Amodei"], [560, 569, "e:anthropic-founded-2021"]]}}, {"id": "terence-tao", "name": "Terence Tao", "born": "1975-07-17", "died": null, "woman": false, "roles": ["mathematician", "Fields medalist", "advocate and tester of AI-assisted mathematics"], "affiliations": ["University of California, Los Angeles (faculty since 1996; full professor 1999)", "Princeton University (PhD 1996)"], "summary": "Terence Tao, born in Adelaide, Australia, in 1975, was a famous child prodigy who competed in the International Mathematical Olympiad at ten and earned a Princeton PhD at 21. He became a full professor at UCLA at 24 and won the Fields Medal, mathematics' top prize, in 2006. Since late 2023 he has become a leading tester of AI tools in research mathematics. He learned the Lean proof checker and organised volunteers to check a new proof by machine in about three weeks, then ran a much larger project that settled 22 million small questions in algebra with help from automated provers. In 2026 he vetted AI-assisted solutions to problems posed by Paul Erdos, while warning that AI can produce polished arguments with hidden flaws and that the failures go unreported.", "contributions": [{"event_id": "pfr-formalised-2023", "text": "Organised the crowd that checked the Polynomial Freiman-Ruzsa proof in Lean in about three weeks (2023)."}, {"event_id": "equational-theories-2025", "text": "Led the Equational Theories Project, which settled about 22 million implications between algebraic laws, all checked in Lean (2025)."}, {"event_id": "erdos-728-2026", "text": "Confirmed that the AI-found solution to Erdos Problem #728 had no earlier human solution (January 2026)."}, {"event_id": "erdos-1196-2026", "text": "Co-wrote up the solution to Erdos Problem #1196, whose key method came from AI output, and called it a genuine contribution (2026)."}], "lenses": ["symbolic-and-math"], "penn_connection": "", "portrait": {"url": "https://commons.wikimedia.org/wiki/File:Terence_Tao_at_IPAM's_Fireside_Chat_2026_(50m16s)_(cropped).jpg", "license": "CC BY 4.0 (https://creativecommons.org/licenses/by/4.0)", "credit": "Institute for Pure & Applied Mathematics. CC BY 4.0, via Wikimedia Commons.", "rights_status": "clear", "source_url": "https://commons.wikimedia.org/wiki/File:Terence_Tao_at_IPAM's_Fireside_Chat_2026_(50m16s)_(cropped).jpg", "src": "photos/people-portraits/terence-tao-commons.jpg"}, "media": [{"title": "Lex Fridman Podcast #472, 'Terence Tao: Hardest Problems in Mathematics, Physics & the Future of AI' (2025-06-14)", "url": "https://lexfridman.com/terence-tao/", "kind": "interview"}, {"title": "IPAM Fireside Chat with Terence Tao (2026-03-04, YouTube)", "url": "https://www.youtube.com/watch?v=ddTvK9nlquM", "kind": "talk"}], "sources": ["https://en.wikipedia.org/wiki/Terence_Tao", "International Mathematical Union, Fields Medal 2006 citation, https://www.kurims.kyoto-u.ac.jp/EMIS/mirror/IMU/medals/2006/FM2006.pdf", "PFR project, https://github.com/teorth/pfr", "Quanta Magazine, 2026-08-03, https://www.quantamagazine.org/why-the-legendary-erdos-problems-are-falling-to-ai-20260803/"], "confidence": "high", "links": {"summary": [[374, 378, "e:lean-begun-2013"]]}}, {"id": "warren-mcculloch", "name": "Warren McCulloch", "born": "1898-11-16", "died": "1969-09-24", "woman": false, "roles": ["neurophysiologist", "psychiatrist", "cybernetician"], "affiliations": ["Yale University (Laboratory of Neurophysiology, 1934-41)", "University of Illinois College of Medicine, Chicago (Illinois Neuropsychiatric Institute, 1941-51)", "Massachusetts Institute of Technology (Research Laboratory of Electronics, from 1952)"], "summary": "Warren McCulloch was an American doctor and brain scientist, born in Orange, New Jersey, in 1898. He studied philosophy, psychology and medicine, and he wanted to know how a brain made of cells could think. In Chicago he took in Walter Pitts, a brilliant teenager with no degree, and the two wrote a famous paper in 1943. It treated each nerve cell as a simple switch that is either on or off. It showed that networks of these switches could carry out logic. This is the starting point of artificial neural networks, although their networks could not learn. McCulloch later chaired the Macy conferences on cybernetics, the study of control and feedback in animals and machines. In 1951 he attended a Paris meeting on calculating machines. He moved to MIT in 1952. He also wrote sonnets, and he died at his Connecticut farm in 1969.", "contributions": [{"event_id": "mcculloch-pitts-neuron", "text": "Co-wrote the 1943 paper with Walter Pitts that modelled neurons as on-off switches and showed networks of them could compute logic."}, {"event_id": "paris-cybernetics-1951", "text": "Attended the January 1951 Paris conference on calculating machines, sometimes called the first major AI meeting."}, {"event_id": "edvac-report-1945", "text": "His neuron model with Pitts was borrowed by John von Neumann to describe the parts of a computer in the 1945 EDVAC report."}], "lenses": ["core"], "penn_connection": "", "portrait": null, "media": [{"title": "Amanda Gefter, 'The Man Who Tried to Redeem the World with Logic' (Nautilus, 2015), on Pitts and McCulloch", "url": "https://nautil.us/the-man-who-tried-to-redeem-the-world-with-logic-235253/", "kind": "article"}], "sources": ["Tara H. Abraham, Rebel Genius: Warren S. McCulloch's Transdisciplinary Life in Science (MIT Press, 2016), https://mitpress.mit.edu/9780262035095/rebel-genius/", "American Philosophical Society, Warren S. McCulloch Papers, Mss.B.M139 (authority heading 'McCulloch, Warren S. (Warren Sturgis), 1898-1969'), https://search.amphilsoc.org/collections/view?docId=ead/Mss.B.M139-ead.xml", "Amanda Gefter, 'The Man Who Tried to Redeem the World with Logic', Nautilus, 2015-02-05, https://nautil.us/the-man-who-tried-to-redeem-the-world-with-logic-235253/", "David C. Brock, 'Cybernetics, Computer Design, and a Meeting of the Minds', IEEE Spectrum, 2021-02-09, https://spectrum.ieee.org/cybernetics-computer-design-and-a-meeting-of-the-minds", "https://en.wikipedia.org/wiki/Warren_Sturgis_McCulloch", "MIT News Office, notice to faculty of the death of Warren S. McCulloch, 1969-09-24, MIT Institute Archives AC0069, https://cdn.libraries.mit.edu/dissemination/diponline/AC0069_NewReleases/NewsRelease_1960/AC0069_1969/AC0069_196909_018.pdf", "M. D. Godfrey (ed.), introduction to J. von Neumann, 'First Draft of a Report on the EDVAC', IEEE Annals of the History of Computing 15(4), 1993, https://cs.carleton.edu/faculty/jondich/courses/cs207_f03/assignments/edvac.pdf"], "confidence": "high", "batch": "founders", "links": {"summary": [[229, 241, "p:Walter Pitts"]]}}, {"id": "walter-pitts", "name": "Walter Pitts", "born": "1923-04-23", "died": "1969-05-14", "woman": false, "roles": ["logician", "mathematical neuroscientist"], "affiliations": ["University of Chicago (informal student, early 1940s)", "Massachusetts Institute of Technology (Research Laboratory of Electronics)"], "summary": "Walter Pitts was an American logician, born in Detroit in 1923, who never earned a degree. He taught himself logic and mathematics, much of it in a public library. His friend Jerome Lettvin later told a famous story: at about 12, Pitts found mistakes in Bertrand Russell's Principia Mathematica and wrote to Russell about them. As a teenager he turned up at the University of Chicago, and Warren McCulloch took him into his family home. Their 1943 paper described nerve cells as on-off switches and showed that networks of them could compute logic. It is the root of today's neural networks. Pitts then joined Norbert Wiener at MIT. When Wiener broke with him around 1952, Pitts burned his unfinished thesis. His 1959 study with Lettvin showed that a frog's eye starts processing images before the brain does. He died in 1969.", "contributions": [{"event_id": "mcculloch-pitts-neuron", "text": "Co-wrote the 1943 paper with Warren McCulloch, supplying much of the logic that showed networks of on-off neurons could compute."}, {"event_id": "edvac-report-1945", "text": "The McCulloch-Pitts neuron model was used by John von Neumann to describe a computer's parts in the 1945 EDVAC report."}], "lenses": ["core"], "penn_connection": "", "portrait": {"url": "https://commons.wikimedia.org/wiki/File:Lettvin_Pitts.jpg", "license": "CC BY-SA 3.0 (http://creativecommons.org/licenses/by-sa/3.0/)", "credit": "Iapx86. CC BY-SA 3.0, via Wikimedia Commons.", "rights_status": "verify", "source_url": "https://commons.wikimedia.org/wiki/File:Lettvin_Pitts.jpg", "src": "photos/turing-and-early-computing/14-walter-pitts-and-jerome-lettvin-with-frog.jpg"}, "media": [{"title": "Amanda Gefter, 'The Man Who Tried to Redeem the World with Logic' (Nautilus, 2015)", "url": "https://nautil.us/the-man-who-tried-to-redeem-the-world-with-logic-235253/", "kind": "article"}], "sources": ["IEEE Computer Society, Computer Pioneers, 'Walter Pitts', https://history.computer.org/pioneers/pitts.html", "Amanda Gefter, 'The Man Who Tried to Redeem the World with Logic', Nautilus, 2015-02-05, https://nautil.us/the-man-who-tried-to-redeem-the-world-with-logic-235253/", "W. S. McCulloch and W. Pitts, 'A Logical Calculus of the Ideas Immanent in Nervous Activity', Bulletin of Mathematical Biophysics 5 (1943): 115-133", "https://en.wikipedia.org/wiki/Walter_Pitts", "M. D. Godfrey (ed.), introduction to J. von Neumann, 'First Draft of a Report on the EDVAC', IEEE Annals of the History of Computing 15(4), 1993, https://cs.carleton.edu/faculty/jondich/courses/cs207_f03/assignments/edvac.pdf"], "confidence": "high", "batch": "founders", "links": {"summary": [[263, 272, "p:Stuart Russell"], [273, 294, "e:principia-mathematica"], [389, 405, "p:Warren McCulloch"], [610, 624, "p:Norbert Wiener"]]}}, {"id": "john-von-neumann", "name": "John von Neumann", "born": "1903-12-28", "died": "1957-02-08", "woman": false, "roles": ["mathematician", "physicist", "computer pioneer"], "affiliations": ["Institute for Advanced Study, Princeton (from 1933)", "Los Alamos Laboratory (Manhattan Project consultant)", "Moore School of Electrical Engineering, University of Pennsylvania (consultant to the ENIAC/EDVAC team, 1944-45)", "US Atomic Energy Commission (commissioner, 1955-57)"], "summary": "John von Neumann was a Hungarian-American mathematician, born in Budapest in 1903, who worked at the Institute for Advanced Study in Princeton. He did major work in pure mathematics, quantum physics and game theory, and he advised the atomic bomb project at Los Alamos. In 1944 he joined the ENIAC team at Penn's Moore School in planning their next machine, the EDVAC. His 1945 'First Draft of a Report on the EDVAC' described a computer that keeps its program in memory alongside its data. Most computers since have followed this plan. The ideas came partly from the Moore School team, but only his name was on the report, which led to a lasting dispute with Eckert and Mauchly. He described the machine's parts using McCulloch and Pitts's model of neurons. Friends remembered his long, lively parties. He died of cancer in 1957.", "contributions": [{"event_id": "edvac-report-1945", "text": "Wrote the 1945 'First Draft of a Report on the EDVAC', which set out the stored-program design that most computers still follow, drawing on the Moore School team's work."}], "lenses": ["pre-computing", "core"], "penn_connection": "Consultant to the ENIAC/EDVAC team at Penn's Moore School (1944-45); his EDVAC report was written from their work.", "portrait": {"url": "https://commons.wikimedia.org/wiki/File:John_von_Neumann_Los_Alamos_identity_badge_photo.jpg", "license": "Attribution", "credit": "Los Alamos Laboratory. Attribution, via Wikimedia Commons.", "rights_status": "verify", "source_url": "https://commons.wikimedia.org/wiki/File:John_von_Neumann_Los_Alamos_identity_badge_photo.jpg", "src": "photos/people-portraits/john-von-neumann-los-alamos-badge-c1944.jpg"}, "media": [{"title": "Computer History Museum, 'First draft of a report on the EDVAC' (Revolution exhibit)", "url": "https://www.computerhistory.org/revolution/birth-of-the-computer/4/88/359", "kind": "exhibit"}, {"title": "von Neumann, 'First Draft of a Report on the EDVAC' (1945), full text", "url": "https://web.mit.edu/sts.035/www/PDFs/edvac.pdf", "kind": "primary source"}], "sources": ["MacTutor History of Mathematics, 'John von Neumann', https://mathshistory.st-andrews.ac.uk/Biographies/Von_Neumann/", "Computer History Museum, 'First draft of a report on the EDVAC', https://www.computerhistory.org/revolution/birth-of-the-computer/4/88/359", "Institute for Advanced Study, 'Herman Heine Goldstine', https://ias.edu/node/7471", "von Neumann, 'First Draft of a Report on the EDVAC' (1945), https://web.mit.edu/sts.035/www/PDFs/edvac.pdf"], "confidence": "high", "batch": "founders", "links": {"summary": [[292, 297, "e:eniac-unveiled"], [362, 367, "e:edvac-report-1945"], [660, 666, "p:J. Presper Eckert"], [671, 678, "p:John Mauchly"], [719, 738, "e:mcculloch-pitts-neuron"]]}}, {"id": "nathaniel-rochester", "name": "Nathaniel Rochester", "born": "1919-01-14", "died": "2001-06-08", "woman": false, "roles": ["electrical engineer", "computer designer"], "affiliations": ["MIT Radiation Laboratory (1941-43)", "Sylvania Electric Products (1943-48)", "IBM (1948-1992; IBM Fellow from 1967)"], "summary": "Nathaniel Rochester was an American electrical engineer, born in Buffalo, New York, in 1919. After radar work at MIT during the Second World War, he joined IBM in 1948. He was chief architect of the IBM 701, the company's first scientific computer. He also wrote an early symbolic assembler, a program that let people write short, readable commands instead of raw numbers. In 1955 he signed the Dartmouth proposal with John McCarthy, Marvin Minsky and Claude Shannon, the document that named artificial intelligence. Around then his IBM group ran one of the first computer simulations of a brain-like network, to test Donald Hebb's ideas about learning, and published it in 1956. He attended the Dartmouth workshop that summer and took the best-known photograph of its members. IBM made him an IBM Fellow in 1967. He died in 2001.", "contributions": [{"event_id": "ai-named-1955", "text": "Co-signed the August 1955 Dartmouth proposal that introduced the name 'artificial intelligence', lending IBM's backing."}, {"event_id": "dartmouth-workshop", "text": "Attended the 1956 Dartmouth workshop and took the group photograph of its participants."}, {"event_id": "hebb-rule", "text": "Led the IBM team whose 1956 simulation on an IBM 704 tested Hebb's cell-assembly theory of learning."}], "lenses": ["core", "companies-and-money"], "penn_connection": "", "portrait": {"url": "https://raysolomonoff.com/dartmouth/misc/misc.html", "license": "unknown - verify (no licence stated; Solomonoff estate site)", "credit": "Nathaniel Rochester, IBM, c. 1965. Courtesy the Solomonoff estate / Rochester family (via raysolomonoff.com).", "rights_status": "verify", "source_url": "https://raysolomonoff.com/dartmouth/misc/misc.html", "src": "photos/dartmouth-1956/10-nathaniel-rochester-ibm-c1965.png"}, "media": [{"title": "Oral-History: Nathaniel Rochester, interviewed by Andrew Goldstein, IEEE History Center, 6 June 1991", "url": "https://ethw.org/Oral-History:Nathaniel_Rochester", "kind": "oral history"}], "sources": ["IEEE Computer Society, Computer Pioneers, 'Nathaniel Rochester', https://history.computer.org/pioneers/rochester.html", "D. Modha, 'Nathaniel Rochester III (1919-2001)', https://modha.org/2006/09/nathaniel-rochester-iii-1919-2001/", "N. Rochester, J. H. Holland, L. H. Haibt and W. L. Duda, 'Tests on a Cell Assembly Theory of the Action of the Brain, Using a Large Digital Computer', IRE Transactions on Information Theory IT-2 (1956): 80-93, https://research.ibm.com/publications/tests-on-a-cell-assembly-theory-of-the-action-of-the-brain-using-a-large-digital-computer", "J. McCarthy, M. Minsky, N. Rochester, C. Shannon, 'A Proposal for the Dartmouth Summer Research Project on Artificial Intelligence' (1955)", "Grace Solomonoff, 'The Photo and the Letter', https://raysolomonoff.com/dartmouth/misc/misc.html", "https://en.wikipedia.org/wiki/Nathaniel_Rochester_(computer_scientist)"], "confidence": "high", "batch": "founders", "links": {"summary": [[395, 404, "e:dartmouth-workshop"], [419, 432, "p:John McCarthy"], [434, 447, "p:Marvin Minsky"], [452, 466, "p:Claude Shannon"], [618, 629, "p:Donald Hebb"]]}}, {"id": "ray-solomonoff", "name": "Ray Solomonoff", "born": "1926-07-25", "died": "2009-12-07", "woman": false, "roles": ["mathematician", "AI researcher"], "affiliations": ["University of Chicago (Ph.B. and M.S. in physics)", "Zator Company / Rockford Research, Cambridge, Mass. (c. 1958-68)", "Oxbridge Research, Cambridge, Mass. (his own company, from 1970)", "IDSIA, Lugano (visiting)", "Royal Holloway, University of London (visiting professor)"], "summary": "Ray Solomonoff was an American mathematician, born in Cleveland, Ohio, in 1926. He studied physics at the University of Chicago, where the philosopher Rudolf Carnap's work on probability shaped his interests. He was invited to the 1956 Dartmouth workshop and was one of the few who stayed all summer. There he circulated a paper called 'An Inductive Inference Machine', an early design for a machine that learns from examples. In 1960 and 1964 he published a theory of prediction that favours the simplest explanation of the data, measured by the length of the shortest computer program that produces it. The Russian mathematician Andrei Kolmogorov reached a similar idea on his own and later acknowledged that Solomonoff was first. Solomonoff never held a regular academic post. From 1970 he ran a one-man research company in Cambridge, Massachusetts. He died in 2009.", "contributions": [{"event_id": "dartmouth-workshop", "text": "Stayed for the whole 1956 Dartmouth summer and circulated 'An Inductive Inference Machine', an early paper on machines that learn from examples."}], "lenses": ["core", "symbolic-and-math"], "penn_connection": "", "portrait": {"url": "https://raysolomonoff.com/", "license": "unknown - verify (no licence stated)", "credit": "Ray Solomonoff at IDSIA, Lugano. Photo: Juergen Schmidhuber, via raysolomonoff.com.", "rights_status": "verify", "source_url": "https://raysolomonoff.com/", "src": "photos/people-portraits/ray-solomonoff-idsia.jpg"}, "media": [{"title": "raysolomonoff.com: papers, Dartmouth 1956 notes and photos (Solomonoff estate)", "url": "https://raysolomonoff.com/", "kind": "archive"}, {"title": "Grace Solomonoff, 'The Photo and the Letter' (Dartmouth 1956)", "url": "https://raysolomonoff.com/dartmouth/misc/misc.html", "kind": "article"}], "sources": ["Peter Gács and Paul M. B. Vitányi, 'Raymond J. Solomonoff 1926-2009' (2011), https://www.cs.bu.edu/faculty/gacs/papers/Solomonoff_obituary.pdf", "Paul Vitányi, obituary of Ray Solomonoff, https://homepages.cwi.nl/~paulv/obituary.html", "https://en.wikipedia.org/wiki/Ray_Solomonoff"], "confidence": "high", "batch": "founders", "links": {"summary": [[236, 245, "e:dartmouth-workshop"]]}}, {"id": "oliver-selfridge", "name": "Oliver Selfridge", "born": "1926-05-10", "died": "2008-12-03", "woman": false, "roles": ["computer scientist", "AI pioneer"], "affiliations": ["Massachusetts Institute of Technology (S.B. mathematics; graduate work under Norbert Wiener)", "MIT Lincoln Laboratory", "Bolt Beranek and Newman (BBN)", "GTE Laboratories (chief scientist from 1983)"], "summary": "Oliver Selfridge was a British-born American computer scientist, born in London in 1926. His grandfather founded Selfridges, the London department store, and the family moved to the United States around the start of the Second World War. He earned a mathematics degree from MIT at 19 and did graduate work with Norbert Wiener, but left before finishing a doctorate. He took part in the 1956 Dartmouth workshop. In a 1958 paper called 'Pandemonium', he pictured pattern recognition as a crowd of small 'demons'. Each demon looks for one simple feature, such as a line or a curve, and shouts louder the more of it it sees. Higher demons listen and decide what the whole shape is. This layered design foreshadowed later neural networks. He worked at MIT's Lincoln Laboratory, at BBN and at GTE. He also wrote children's books. He died in 2008.", "contributions": [{"event_id": "dartmouth-workshop", "text": "Took part in the 1956 Dartmouth workshop, bringing his early work on machine pattern recognition."}], "lenses": ["core"], "penn_connection": "", "portrait": {"url": "https://commons.wikimedia.org/wiki/File:Oliver_Selfridge_at_BBN.jpg", "license": "CC0 1.0", "credit": "Oliver Selfridge at BBN Technologies, Cambridge, Mass., 27 March 2008. Photo: Daderot, CC0, via Wikimedia Commons.", "rights_status": "clear", "source_url": "https://commons.wikimedia.org/wiki/File:Oliver_Selfridge_at_BBN.jpg", "src": "photos/people-portraits/oliver-selfridge-bbn-2008.jpg"}, "media": [{"title": "Phil Husbands, 'An Interview with Oliver Selfridge', in The Mechanical Mind in History (MIT Press, 2008)", "url": "http://web.archive.org/web/20250802223928/https://users.sussex.ac.uk/~philh/pubs/SelfridgeInterview.pdf", "kind": "interview"}], "sources": ["MIT CSAIL News, 'Founding Father of AI Oliver Selfridge Dies at 82' (Dec 2008), https://www.csail.mit.edu/news/founding-father-ai-oliver-selfridge-dies-82", "The Tech (MIT), obituary of Oliver Selfridge, 2008-12-05, http://web.archive.org/web/20260517030249/https://www.thetech.com/2008/12/05/selfridge-v128-n60 (archived copy of https://thetech.com/2008/12/05/selfridge-v128-n60)", "Vineyard Gazette, 'Oliver Selfridge, Computer Pioneer, Loved Chappy', 2009-01-29, https://vineyardgazette.com/obituaries/2009/01/29/oliver-selfridge-computer-pioneer-loved-chappy", "O. G. Selfridge, 'Pandemonium: A Paradigm for Learning', Mechanisation of Thought Processes (HMSO, 1959), symposium held November 1958", "https://en.wikipedia.org/wiki/Oliver_Selfridge"], "confidence": "high", "batch": "founders", "links": {"summary": [[311, 325, "p:Norbert Wiener"], [391, 400, "e:dartmouth-workshop"]]}}, {"id": "j-c-r-licklider", "name": "J. C. R. Licklider", "born": "1915-03-11", "died": "1990-06-26", "woman": false, "roles": ["psychologist", "computer scientist", "research funder"], "affiliations": ["Harvard Psycho-Acoustic Laboratory (1941-46)", "Massachusetts Institute of Technology (from 1949; director of Project MAC 1968-70)", "Bolt Beranek and Newman (vice president, 1957-62)", "ARPA, US Department of Defense (first director of the Information Processing Techniques Office, 1962-64 and 1974-75)", "IBM (1964-67)"], "summary": "J. C. R. Licklider, known to friends as 'Lick', was an American psychologist, born in St Louis, Missouri, in 1915. He began as an expert on hearing, studying how people perceive pitch, at Harvard and then MIT. Working with early interactive computers changed his course. In his 1960 paper 'Man-Computer Symbiosis', he imagined people and computers working closely together, each doing what it does best. In October 1962 he became the first head of a new computing office at ARPA, the US Defense Department's research agency. His office gave MIT money for Project MAC, which housed Marvin Minsky's AI group, and funded Stanford and Carnegie Tech (now Carnegie Mellon) on similar terms. It backed talented people rather than narrow projects. A 1963 memo of his, addressed to an 'Intergalactic Computer Network', helped inspire the ARPANET, a forerunner of the internet. He died in 1990.", "contributions": [{"event_id": "licklider-symbiosis", "text": "Published 'Man-Computer Symbiosis' (1960), a vision of people and computers thinking together rather than machines replacing people."}, {"event_id": "arpa-project-mac-1963", "text": "As ARPA's first computing director, funded MIT's Project MAC (about $2.2 million) and AI work at Stanford and Carnegie Tech."}], "lenses": ["core", "companies-and-money"], "penn_connection": "", "portrait": {"url": "https://commons.wikimedia.org/wiki/File:Portrait_of_J._C._R._Licklider.jpg", "license": "Public domain", "credit": "Unknown author Unknown author. Public domain, via Wikimedia Commons.", "rights_status": "verify", "source_url": "https://commons.wikimedia.org/wiki/File:Portrait_of_J._C._R._Licklider.jpg", "src": "photos/people-portraits/j-c-r-licklider-darpa-c1963.jpg"}, "media": [{"title": "Oral history interview with J. C. R. Licklider (OH 150), by William Aspray and Arthur Norberg, Charles Babbage Institute, 28 October 1988", "url": "https://hdl.handle.net/11299/107436", "kind": "oral history"}, {"title": "J. C. R. Licklider, 'Man-Computer Symbiosis' (1960), full text", "url": "https://groups.csail.mit.edu/medg/people/psz/Licklider.html", "kind": "primary source"}], "sources": ["IEEE Computer Society, Computer Pioneers, 'Joseph C. R. Licklider', https://history.computer.org/pioneers/licklider.html", "Robert M. Fano, 'Joseph Carl Robnett Licklider, 1915-1990', Biographical Memoirs of the National Academy of Sciences 75 (1998), https://www.nationalacademies.org/read/9649/chapter/12", "Oscar Schwartz, 'The DARPA Dreamer Who Aimed for Cyborg Intelligence', IEEE Spectrum, 2019", "Computer History Museum, 'Internet History of 1960s', https://www.computerhistory.org/internethistory/1960s", "https://en.wikipedia.org/wiki/J._C._R._Licklider"], "confidence": "high", "batch": "founders", "links": {"summary": [[290, 312, "e:licklider-symbiosis"], [555, 566, "e:arpa-project-mac-1963"], [581, 594, "p:Marvin Minsky"]]}}, {"id": "donald-hebb", "name": "Donald Hebb", "born": "1904-07-22", "died": "1985-08-20", "woman": false, "roles": ["psychologist", "neuropsychologist"], "affiliations": ["Montreal Neurological Institute (with Wilder Penfield, 1937-39)", "Queen's University, Kingston (1939-42)", "Yerkes Laboratories of Primate Biology, Florida (1942-47)", "McGill University (professor from 1947; chancellor 1970-74)", "Dalhousie University (professor emeritus from 1978)"], "summary": "Donald Hebb was a Canadian psychologist, born in Chester, Nova Scotia, in 1904. He first meant to be a novelist and spent several years as a schoolteacher and school principal before turning to psychology. He earned his PhD in 1936 under Karl Lashley. He then tested brain-surgery patients with Wilder Penfield in Montreal and studied chimpanzees at the Yerkes laboratory in Florida. In 1949, as a professor at McGill University, he published 'The Organization of Behavior'. In it he proposed that when one brain cell repeatedly helps to fire another, the link between them grows stronger. Groups of cells linked this way could hold a memory or an idea. Others later summed this up as 'cells that fire together wire together'. The rule became a model for learning in artificial neural networks. He died in Nova Scotia in 1985.", "contributions": [{"event_id": "hebb-rule", "text": "Proposed in 'The Organization of Behavior' (1949) that a connection strengthens when one neuron repeatedly helps fire another, a template for learning in neural networks."}], "lenses": ["core"], "penn_connection": "", "portrait": null, "media": [{"title": "Canadian Medical Hall of Fame, 2003 laureate: Donald O. Hebb", "url": "https://cdnmedhall.ca/laureates/donaldhebb", "kind": "article"}], "sources": ["Peter M. Milner and Brenda Milner, 'Donald Olding Hebb, 22 July 1904 - 20 August 1985', Biographical Memoirs of Fellows of the Royal Society 42 (1996): 192-204, doi:10.1098/rsbm.1996.0012", "Richard E. Brown, 'The Life and Work of Donald Olding Hebb, Canada's Greatest Psychologist', Proceedings of the Nova Scotian Institute of Science 44 (2007), https://ojs.library.dal.ca/nsis/article/view/nsis44-1brown", "The Canadian Encyclopedia, 'Donald Olding Hebb', https://thecanadianencyclopedia.ca/en/article/donald-olding-hebb", "https://en.wikipedia.org/wiki/Donald_O._Hebb"], "confidence": "high", "batch": "founders", "links": {"summary": []}}, {"id": "mitchell-marcus", "name": "Mitchell Marcus", "born": null, "died": null, "woman": false, "roles": ["computer scientist", "natural language processing researcher", "professor"], "affiliations": ["Massachusetts Institute of Technology (PhD 1978, AI Laboratory)", "AT&T Bell Laboratories (Member of Technical Staff)", "University of Pennsylvania (Computer and Information Science, from 1987; RCA Professor of Artificial Intelligence, now emeritus)"], "summary": "Mitchell Marcus is a computer scientist who spent most of his career at the University of Pennsylvania. He earned his PhD at MIT's AI Laboratory in 1978 with a theory of how a program could read a sentence word by word and work out its grammar in a single pass, without backtracking. After a spell at AT&T Bell Laboratories he joined Penn in 1987. Two years later he started the Penn Treebank project. Trained human annotators labelled millions of words of English, including Wall Street Journal articles, with each word's part of speech and each sentence's structure. A computer made a first guess and people corrected it. The result, published in 1993 with Beatrice Santorini and Mary Ann Marcinkiewicz, became the shared training data and scoreboard for statistical language programs. He later chaired Penn's computer science department and its Faculty Senate.", "contributions": [{"event_id": "penn-treebank-1993", "text": "Created and led the Penn Treebank project (from 1989), the hand-labelled English corpus that became the standard training set and test for statistical parsers."}], "lenses": ["core", "work-and-labor"], "penn_connection": "Faculty, Penn Computer and Information Science from 1987 (RCA Professor of Artificial Intelligence, now emeritus); led the Penn Treebank project (source: https://www.cis.upenn.edu/~mitch/)", "portrait": {"url": "https://www.cis.upenn.edu/~mitch/", "license": "unknown (Penn faculty home-page photo; no licence stated)", "credit": "Mitchell Marcus, c. 2007. Photo from his University of Pennsylvania faculty home page; photographer not stated.", "rights_status": "verify", "source_url": "https://www.cis.upenn.edu/~mitch/", "src": "photos/people-portraits/mitchell-marcus-penn-faculty.jpg"}, "media": [], "sources": ["Mitch Marcus, faculty home page, University of Pennsylvania, https://www.cis.upenn.edu/~mitch/", "M. P. Marcus, B. Santorini, M. A. Marcinkiewicz, 'Building a Large Annotated Corpus of English: The Penn Treebank', Computational Linguistics 19(2):313-330, 1993, https://aclanthology.org/J93-2004/", "ACL Fellows (2011 citation: 'For significant contributions to deterministic parsing and The Penn Treebank'), https://www.aclweb.org/aclwiki/ACL_Fellows", "ACL, Past ACL Presidents (Mitch Marcus, 1997), https://acl.org/leadership/past-presidents/", "LDC, Treebank-3 (LDC99T42), Marcus, Santorini, Marcinkiewicz, Taylor, 1999, https://catalog.ldc.upenn.edu/LDC99T42"], "confidence": "high", "batch": "language", "links": {"summary": [[379, 392, "e:penn-treebank-1993"], [659, 677, "p:Beatrice Santorini"], [682, 704, "p:Mary Ann Marcinkiewicz"]]}}, {"id": "beatrice-santorini", "name": "Beatrice Santorini", "born": null, "died": null, "woman": true, "roles": ["linguist", "corpus builder", "annotation-guidelines author"], "affiliations": ["University of Pennsylvania (PhD Linguistics 1989; Senior Fellow, Department of Linguistics, now retired)", "Northwestern University (Department of Linguistics, c. 1993)"], "summary": "Beatrice Santorini is a linguist who earned her PhD at the University of Pennsylvania in 1989 with a study of how word order changed over the history of Yiddish. She then helped turn Penn's Treebank from an idea into a usable resource. In 1990 she wrote the Treebank's part-of-speech tagging guidelines, the rulebook that told human annotators which of 36 word-class labels to give each word and how to handle hard cases. Labels from that set, such as NN for a noun and VB for a verb, are still used by language software today. She co-wrote the 1993 Treebank paper with Mitchell Marcus and Mary Ann Marcinkiewicz, and her earlier bracketing manual shaped the later rules for marking sentence structure. She went on to build parsed collections of historical English, French and Yiddish, and became a Senior Fellow in Penn Linguistics.", "contributions": [{"event_id": "penn-treebank-1993", "text": "Wrote the Treebank's part-of-speech tagging guidelines (1990) and co-authored the 1993 paper describing how the corpus was built."}], "lenses": ["core", "work-and-labor"], "penn_connection": "PhD in Linguistics, Penn, 1989; Senior Fellow (retired), Penn Department of Linguistics; co-creator of the Penn Treebank (source: https://www.ling.upenn.edu/people/santorini)", "portrait": null, "media": [], "sources": ["Penn Linguistics, people page 'Beatrice Santorini' (Senior Fellow, retired; PhD Penn 1989; dissertation on verb-second in the history of Yiddish), https://www.ling.upenn.edu/people/santorini", "B. Santorini, 'Part-of-Speech Tagging Guidelines for the Penn Treebank Project', 3rd revision, University of Pennsylvania, June 1990, https://repository.upenn.edu/entities/person/4341f208-44e9-4fc9-8606-402776e63b89", "M. P. Marcus, B. Santorini, M. A. Marcinkiewicz, 'Building a Large Annotated Corpus of English: The Penn Treebank', Computational Linguistics 19(2):313-330, 1993, https://aclanthology.org/J93-2004/", "A. Bies, M. Ferguson, K. Katz, R. MacIntyre et al., 'Bracketing Guidelines for Treebank II Style', Penn Treebank Project, January 1995 (acknowledges that 'Beatrice Santorini wrote the previous manual'), https://catalog.ldc.upenn.edu/docs/LDC99T42/prsguid1.pdf", "Beatrice Santorini, home page (parsed corpora of historical English, French and Yiddish), https://www.ling.upenn.edu/~beatrice/"], "confidence": "high", "batch": "language", "links": {"summary": [[570, 585, "p:Mitchell Marcus"], [590, 612, "p:Mary Ann Marcinkiewicz"]]}}, {"id": "mary-ann-marcinkiewicz", "name": "Mary Ann Marcinkiewicz", "born": null, "died": null, "woman": true, "roles": ["Penn Treebank co-creator", "annotation guidelines author"], "affiliations": ["University of Pennsylvania (Department of Computer and Information Science, Penn Treebank Project, early 1990s)"], "summary": "Mary Ann Marcinkiewicz worked on the Penn Treebank at the University of Pennsylvania's computer science department in the early 1990s. She is the third author, with Mitchell Marcus and Beatrice Santorini, of the 1993 paper that described how the Treebank was built. The team first let a computer guess the labels for each word and sentence, then had trained people correct them. Their tests showed that correcting was about twice as fast as labelling from scratch, and more consistent. She co-wrote the 1991 bracketing guidelines with Santorini. These were the rules for marking how the words of a sentence group into phrases. She also worked on the second phase, which from 1994 added marks for who did what to whom in each sentence. Little else about her career is on public record, a common fate for the people who build datasets.", "contributions": [{"event_id": "penn-treebank-1993", "text": "Co-authored the 1993 Penn Treebank paper and the 1991 bracketing guidelines, the rules annotators followed to mark sentence structure."}], "lenses": ["work-and-labor", "core"], "penn_connection": "Penn Treebank Project, Department of Computer and Information Science, University of Pennsylvania (affiliation on the 1993 Computational Linguistics paper, https://aclanthology.org/J93-2004/)", "portrait": null, "media": [], "sources": ["M. P. Marcus, B. Santorini, M. A. Marcinkiewicz, 'Building a Large Annotated Corpus of English: The Penn Treebank', Computational Linguistics 19(2):313-330, 1993, https://aclanthology.org/J93-2004/", "M. Marcus, G. Kim, M. A. Marcinkiewicz, R. MacIntyre, A. Bies, M. Ferguson, K. Katz, B. Schasberger, 'The Penn Treebank: Annotating Predicate Argument Structure', ARPA Human Language Technology Workshop, 1994, https://aclanthology.org/H94-1020/", "A. Bies, M. Ferguson, K. Katz, R. MacIntyre, 'Bracketing Guidelines for Treebank II Style', Penn Treebank Project, January 1995 (lists Marcinkiewicz among 'major contributors'), https://catalog.ldc.upenn.edu/docs/LDC99T42/prsguid1.pdf", "LDC, Treebank-3 (LDC99T42), authors Marcus, Santorini, Marcinkiewicz, Taylor, 1999, https://catalog.ldc.upenn.edu/LDC99T42"], "confidence": "high", "batch": "language", "links": {"summary": [[37, 50, "e:penn-treebank-1993"], [165, 180, "p:Mitchell Marcus"], [185, 203, "p:Beatrice Santorini"]]}}, {"id": "candace-sidner", "name": "Candace Sidner", "born": null, "died": null, "woman": true, "roles": ["computer scientist", "natural language and dialogue researcher", "human-robot interaction researcher"], "affiliations": ["Kalamazoo College (BA Mathematics, 1971)", "University of Pittsburgh (MS Computer Science, 1975)", "Massachusetts Institute of Technology (PhD Computer Science, 1979)", "Bolt Beranek and Newman (1979-1989)", "Digital Equipment Corporation, Cambridge Research Lab (1989-1993)", "Lotus Development Corporation (1993-2000)", "Mitsubishi Electric Research Laboratories (2000-2007)", "BAE Systems AIT (2007-2010)", "Worcester Polytechnic Institute (Research Professor, 2009-2022, now retired)"], "summary": "Candace (Candy) Sidner is an American computer scientist who studied how conversation works so that computers could take part in it. Her 1979 MIT PhD asked how a reader knows what words like 'it' and 'that' point back to. In 1986, working at the research firm Bolt Beranek and Newman, she and Barbara Grosz proposed that a conversation has three layers: the words, the purposes behind them, and what the speakers are focused on at each moment. This became one of the most cited theories of dialogue in AI. She was president of the Association for Computational Linguistics in 1989. Most of her career was in industry labs. At Mitsubishi Electric Research Laboratories she built Mel, a robot penguin that turned its head and looked at people to show it was paying attention. Later, at Worcester Polytechnic Institute, she worked on companion agents for isolated older adults.", "contributions": [{"event_id": "grosz-sidner-discourse-1986", "text": "Co-authored with Barbara Grosz the 1986 theory that splits a conversation into what is said, what the speakers intend, and what they are attending to."}], "lenses": ["chatbots", "core"], "penn_connection": "", "portrait": {"url": "https://web.archive.org/web/20160419073927/http://web.cs.wpi.edu/~sidner/candy.jpg", "license": "unknown (WPI faculty web page photo; no licence stated)", "credit": "Candace Sidner. Photo from her former Worcester Polytechnic Institute faculty page (archived 2016); photographer not stated.", "rights_status": "verify", "source_url": "https://web.archive.org/web/20160419073927/http://web.cs.wpi.edu/~sidner/candy.jpg", "src": "photos/people-portraits/candace-sidner-wpi.jpg"}, "media": [{"title": "Sidner, Rich and Lee, 'Two Generations of Robots for Human-Robot Interaction Research', AAAI 2008 video (VideoLectures.NET)", "url": "https://videolectures.net/aaai08_sidner_tgr", "kind": "lecture"}], "sources": ["Candace Sidner, professional home page and CV (positions, degrees, AAAI Fellow 1991, ACL Fellow 2013), https://candysidner.com/", "B. J. Grosz and C. L. Sidner, 'Attention, Intentions, and the Structure of Discourse', Computational Linguistics 12(3):175-204, 1986, https://aclanthology.org/J86-3001/", "ACL Fellows (2013 citation: 'For seminal contributions to discourse focus and collaborative dialog'), https://www.aclweb.org/aclwiki/ACL_Fellows", "ACL, Past ACL Presidents (Candy Sidner, 1989), https://acl.org/leadership/past-presidents/", "C. L. Sidner, C. Lee, C. D. Kidd, N. Lesh, C. Rich, 'Explorations in Engagement for Humans and Robots', Artificial Intelligence 166(1-2), 2005; MERL TR2005-016, https://www.merl.com/publications/TR2005-016", "WPI, 'Always-On Relational Agents for Social Support of Older Adults' project pages, https://web.cs.wpi.edu/~rich/always/pub/index.html"], "confidence": "high", "batch": "language", "links": {"summary": [[293, 306, "p:Barbara Grosz"]]}}, {"id": "michele-banko", "name": "Michele Banko", "born": null, "died": null, "woman": true, "roles": ["computer scientist", "natural language processing researcher", "entrepreneur"], "affiliations": ["Microsoft Research (c. 2000-2002)", "University of Washington (PhD Computer Science and Engineering, 2009)", "Sentropy Technologies (2018-2021; acquired by Discord, 2021)", "Discord"], "summary": "Michele Banko is a computer scientist who has worked in research labs and start-ups. At Microsoft Research in 2001, she and Eric Brill ran a simple but influential experiment. They took a narrow task, choosing the right word from easily confused pairs such as 'then' and 'than', and trained four standard learning methods on more and more text, up to one billion words. Every method kept improving. The authors urged the field to spend more effort collecting data and less on comparing methods trained on small datasets. The finding became a classic piece of evidence that data, not just clever algorithms, drives progress. At the University of Washington she then built TextRunner, a 2007 system that pulled millions of facts out of web pages without being told in advance what kinds of facts to look for. Later she worked at Sentropy, a start-up that used AI to detect online abuse.", "contributions": [{"event_id": "banko-brill-2001", "text": "First author, with Eric Brill, of the 2001 study showing that ordinary learning methods kept improving with up to a billion words of training text."}], "lenses": ["core", "companies-and-money"], "penn_connection": "", "portrait": null, "media": [], "sources": ["M. Banko and E. Brill, 'Scaling to Very Very Large Corpora for Natural Language Disambiguation', ACL 2001, https://aclanthology.org/P01-1005/", "M. Banko, M. J. Cafarella, S. Soderland, M. Broadhead, O. Etzioni, 'Open Information Extraction from the Web', IJCAI 2007, https://www.ijcai.org/Abstract/07/429", "Turing Center, University of Washington, publications list (M. Banko, 'Open Information Extraction for the Web', PhD dissertation, 2009), https://turing.cs.washington.edu/publications.htm", "M. Banko, B. MacKeen, L. Ray, 'A Unified Taxonomy of Harmful Content', Workshop on Online Abuse and Harms 2020 (affiliation Sentropy Technologies), https://aclanthology.org/2020.alw-1.16/", "TechCrunch, 'Discord buys Sentropy, which makes AI software that fights online harassment', 2021-07-13, https://techcrunch.com/2021/07/13/discord-buys-sentropy/"], "confidence": "high", "batch": "language", "links": {"summary": []}}, {"id": "bo-pang", "name": "Bo Pang", "born": null, "died": null, "woman": true, "roles": ["computer scientist", "natural language processing researcher"], "affiliations": ["Tsinghua University (BS Computer Science, 2000)", "Cornell University (PhD Computer Science, 2006)", "Yahoo! Research (Senior Research Scientist, from 2006)", "Google Research (Staff Research Scientist)"], "summary": "Bo Pang is a computer scientist who helped found sentiment analysis, the use of computers to tell whether a piece of writing expresses a positive or negative opinion. She studied computer science at Tsinghua University in Beijing and then did her PhD at Cornell with Lillian Lee. In 2002, as a graduate student, she was first author of 'Thumbs up?', written with Lee and Shivakumar Vaithyanathan. The team collected movie reviews from the web and trained programs to sort them by learning from examples. Learning beat lists of hand-picked positive and negative words, though opinions proved harder to classify than topics. The paper later won a Test of Time award. Pang and Lee also released their movie-review collection for others to use and in 2008 wrote a widely read survey of the field. She went on to research jobs at Yahoo and then Google.", "contributions": [{"event_id": "pang-lee-sentiment-2002", "text": "First author of 'Thumbs up?' (EMNLP 2002), which showed that programs could learn to sort movie reviews as positive or negative from labelled examples."}], "lenses": ["core"], "penn_connection": "", "portrait": null, "media": [], "sources": ["B. Pang, L. Lee and S. Vaithyanathan, 'Thumbs up? Sentiment Classification using Machine Learning Techniques', EMNLP 2002, https://aclanthology.org/W02-1011/", "L. Lee, 'Thumbs up?' paper homepage (Test of Time award for *ACL 2002-2012, presented at NAACL 2018), https://www.cs.cornell.edu/home/llee/papers/sentiment.home.html", "Mathematics Genealogy Project, Bo Pang (PhD Cornell University 2006, advisor Lillian Lee)", "Bo Pang, CV (Tsinghua BS 2000; Cornell PhD 2000-2006, thesis 'Automatic analysis of document sentiment'; Yahoo! Research from 2006), https://sites.google.com/site/bopang42/cv", "B. Pang and L. Lee, 'Opinion Mining and Sentiment Analysis', Foundations and Trends in Information Retrieval 2(1-2):1-135, 2008, https://www.cs.cornell.edu/home/llee/opinion-mining-sentiment-analysis-survey.html", "NAACL 2018 Business Meeting minutes (Test of Time awards), https://naacl.org/minutes/2018/NAACL_2018_Business_Meeting_FINAL_VERSION.pdf", "Google Research blog, 'Google at NAACL' (2018), https://research.google/blog/google-at-naacl/"], "confidence": "high", "batch": "language", "links": {"summary": [[267, 278, "p:Lillian Lee"]]}}, {"id": "daphne-ippolito", "name": "Daphne Ippolito", "born": null, "died": null, "woman": true, "roles": ["computer scientist", "natural language processing researcher", "professor"], "affiliations": ["University of Toronto (BSc Computer Science, 2015)", "University of Pennsylvania (PhD Computer and Information Science, 2015-2022)", "Google Brain / Google DeepMind (student researcher 2018-2021; research scientist from 2021)", "Carnegie Mellon University (Assistant Professor, Language Technologies Institute, from 2023)"], "summary": "Daphne Ippolito is a computer scientist who studies what text-generating AI can and cannot do. She did her PhD at the University of Pennsylvania from 2015 to 2022, advised by Chris Callison-Burch at Penn and Douglas Eck at Google. In 2020 she and fellow Penn researchers built Real or Fake Text, a game in which players read a passage sentence by sentence and guess where a human's writing turns into a machine's. In a related 2020 paper she showed a twist: the tricks that make generated text fool people can make it easier for detection software to spot. At Google she helped build large language models and studied how they can memorise and repeat their training data word for word. In 2023 she became an assistant professor at Carnegie Mellon University, where she works on the security and privacy of language models and on AI writing tools for creative writers.", "contributions": [{"event_id": "roft-2020", "text": "Co-created Real or Fake Text (RoFT, 2020), a game that measured how well people can tell where human writing turns into machine-generated text."}], "lenses": ["chatbots", "core"], "penn_connection": "PhD, Penn Computer and Information Science, 2015-2022, co-advised by Chris Callison-Burch (Penn) and Douglas Eck (Google); co-created the RoFT game and co-taught CIS 700 'Interactive Fiction and Text Generation' with Callison-Burch in spring 2020 (source: her CV, https://www.cs.cmu.edu/~dippolit/ippolito_cv_june2025.pdf)", "portrait": {"url": "https://www.lti.cs.cmu.edu/people/faculty/ippolito-daphne.html", "license": "unknown (Carnegie Mellon LTI faculty directory photo; no licence stated)", "credit": "Daphne Ippolito. Carnegie Mellon University, Language Technologies Institute faculty photo; photographer not stated.", "rights_status": "verify", "source_url": "https://www.lti.cs.cmu.edu/people/faculty/ippolito-daphne.html", "src": "photos/people-portraits/daphne-ippolito-cmu-lti.jpg"}, "media": [{"title": "Real or Fake Text? (RoFT) game", "url": "https://roft.io/", "kind": "interactive"}], "sources": ["Daphne Ippolito, curriculum vitae (updated July 2025), https://www.cs.cmu.edu/~dippolit/ippolito_cv_june2025.pdf", "Carnegie Mellon University School of Computer Science, new faculty 2023, https://www.dean.scs.cmu.edu/new-faculty/2023.html", "Schmidt Sciences grantee profile, 'Daphne Ippolito' (PhD Penn 2022; worked on Google's PaLM and Gemma models), https://www.schmidtsciences.org/grantee/daphne-ippolito/", "L. Dugan, D. Ippolito, A. Kirubarajan, C. Callison-Burch, 'RoFT: A Tool for Evaluating Human Detection of Machine-Generated Text', EMNLP 2020 demos, https://aclanthology.org/2020.emnlp-demos.25/", "D. Ippolito, D. Duckworth, C. Callison-Burch, D. Eck, 'Automatic Detection of Generated Text is Easiest when Humans are Fooled', ACL 2020, https://aclanthology.org/2020.acl-main.164/"], "confidence": "high", "batch": "language", "links": {"summary": [[277, 294, "e:roft-2020"]]}}, {"id": "peter-f-brown", "name": "Peter F. Brown", "born": "1955", "died": null, "woman": false, "roles": ["computer scientist", "speech and translation researcher", "hedge fund executive"], "affiliations": ["Harvard College (BA Mathematics)", "Carnegie Mellon University (PhD Computer Science)", "IBM Thomas J. Watson Research Center (Research Staff Member, c. 1984-1993)", "Renaissance Technologies (from 1993; co-CEO from 2010, sole CEO from 2018)"], "summary": "Peter F. Brown is an American computer scientist who helped show that computers could learn language from data rather than from rules. He studied mathematics at Harvard and earned a PhD in computer science at Carnegie Mellon. At IBM's research centre in New York he joined Frederick Jelinek's speech recognition group, which treated language as a game of chance: which word is most likely to come next? Brown was lead author of the group's 1990 paper on statistical machine translation. The team learned French-to-English translation from millions of sentence pairs in Canadian parliamentary records, with no dictionary or grammar rules. Statistical methods like these went on to dominate machine translation for about two decades. In 1993 Brown and his colleague Robert Mercer left IBM for the hedge fund Renaissance Technologies, applying similar statistical methods to markets. He later became its chief executive.", "contributions": [{"event_id": "ibm-smt-1990", "text": "Lead author of IBM's 1990 'A Statistical Approach to Machine Translation', which learned translation from three million sentence pairs of Canadian parliamentary records."}], "lenses": ["core", "companies-and-money"], "penn_connection": "", "portrait": null, "media": [{"title": "Peter Brown and Robert Mercer, invited talk 'Oh, yes, everything's right on schedule, Fred', Twenty Years of Bitext workshop, EMNLP 2013 (transcript)", "url": "https://gwern.net/doc/psychology/linguistics/bilingual/2013-10-brown-20yearsofbitext.html", "kind": "lecture"}, {"title": "Goldman Sachs Exchanges podcast, interview with Peter Brown (2023-09-11), transcript", "url": "http://web.archive.org/web/20240207164748/https://www.goldmansachs.com/intelligence/podcasts/episodes/09-11-2023-peter-brown-f/transcript.pdf", "kind": "interview"}], "sources": ["P. F. Brown, J. Cocke, S. A. Della Pietra, V. J. Della Pietra, F. Jelinek, J. D. Lafferty, R. L. Mercer, P. S. Roossin, 'A Statistical Approach to Machine Translation', Computational Linguistics 16(2):79-85, 1990, https://aclanthology.org/J90-2002/", "Carnegie Mellon University Computer Science Department, CSD50 profile 'Peter Brown' (BA Harvard, PhD CMU; nine years at IBM Watson applying machine learning to speech recognition and translation; co-CEO of Renaissance), https://www.cs.cmu.edu/csd50/peter-brown", "Bloomberg, 'RenTech's Robert Mercer to Exit as Co-CEO, Sell Breitbart Stake', 2017-11-02, https://www.bloomberg.com/news/articles/2017-11-02/rentech-s-robert-mercer-to-resign-as-co-ceo-of-hedge-fund-firm-j9ilcxxe", "NPR / Texas Public Radio, 'Billionaire Investor Robert Mercer To Step Down From Firm, Selling Stake In Breitbart', 2017-11-02, https://www.tpr.org/2017-11-02/billionaire-investor-robert-mercer-to-step-down-from-firm-selling-stake-in-breitbart", "https://en.wikipedia.org/wiki/Peter_Fitzhugh_Brown"], "confidence": "high", "batch": "language", "links": {"summary": [[273, 290, "p:Frederick Jelinek"]]}}, {"id": "george-boole", "name": "George Boole", "born": "1815", "died": "1864", "woman": false, "roles": ["mathematician", "logician"], "affiliations": ["Schoolmaster in Lincoln and Waddington (1834-1849)", "Queen's College, Cork (1849-1864)"], "summary": "George Boole was an English mathematician, the son of a Lincoln shoemaker. He taught himself Latin, Greek and advanced mathematics and never took a university degree. He ran schools from his late teens, and in 1849 he became the first professor of mathematics at Queen's College, Cork, in Ireland. In 1847, and more fully in An Investigation of the Laws of Thought (1854), he showed that reasoning could be written as algebra. Letters stand for groups of things, and each symbol can take only two values, 0 and 1.
