  b.setAttribute("aria-pressed", state.lenses.has(id));
  b.onclick = ()=>{
    if(state.lenses.has(id) && state.lenses.size===1){ b.title="At least one lens stays on: turn on another lens first"; b.animate([{transform:"translateX(-3px)"},{transform:"translateX(3px)"},{transform:"none"}],{duration:200}); return; }
    state.lenses.has(id)?state.lenses.delete(id):state.lenses.add(id);
    b.setAttribute("aria-pressed", state.lenses.has(id)); refresh(); };
  lensBox.appendChild(b);
}

// ---- timeline data ----
const ERA_RE = /^(Rules|Data|Scale|First AI winter|Second AI winter|Before the name|Prologue)/;
const groups = new vis.DataSet([{id:"eras",content:"Periods",order:-1,className:"eras-group"}, ...LENSES.map(([id,name],i)=>({id, content:name, order:i, visible:state.lenses.has(id), style:`--c:var(--${id})`}))]);
const items = new vis.DataSet();
const bgItems = [];
for(const e of ev){
  if(e.kind==="period" && e.lenses.length<=2 && ERA_RE.test(e.title)){
    const winter = /winter/i.test(e.title);
    bgItems.push({id:"era::"+e.id, group:"eras", type:"range", start:toDate(e.date), end:toDate(e.end,true),
      content:esc(e.title), title:esc(dateLabel(e)+" · "+e.title), className: winter?"era-item winter":"era-item", eid:e.id});
    if(winter) bgItems.push({id:"bg::"+e.id, type:"background", start:toDate(e.date), end:toDate(e.end,true), content:"", className:"winter"});
  }
}
const markers = ev.filter(e=>e.kind==="marker");
const bgIds = new Set(bgItems.map(b=>b.eid));

function matches(e){
  if(!state.unconf && e.status!=="verified") return false;
  if(!state.q) return true;
  const hay = (e.title+" "+e.description+" "+e.people.join(" ")).toLowerCase();
  return state.q.split(/\s+/).every(w=>hay.includes(w));
}
function buildItems(){
  const out = [...bgItems];
  for(const e of ev){
    if(e.kind==="marker" || bgIds.has(e.id) || !matches(e)) continue;
    for(const l of e.lenses){
      if(!showIn(e,l)) continue;
      const it = {id:e.id+"::"+l, group:l, eid:e.id, start:toDate(e.date),
        content: state.compact && !(e.end && e.kind==="period") ? "" : esc(e.title), title:esc(dateLabel(e)+" · "+e.title),
        style:`--c:var(--${l})`, className: e.status!=="verified"?"unconfirmed":""};
      if(e.end && e.kind==="period"){ it.end=toDate(e.end,true); it.type="range"; } else it.type="point";
      out.push(it);
    }
  }
  return out;
}

// ---- broken axis: hide any stretch of more than GAP_MIN years with no events ----
const GAP_MIN = 50, GAP_PAD = 10;
const yr = s => +String(s).match(/^-?\d+/)[0];
// gaps are computed from the events currently on screen, so every stretch between two breaks holds something
function computeGaps(list){
  const iv = list.map(e=>[yr(e.date), e.end? yr(e.end) : yr(e.date)]).sort((a,b)=>a[0]-b[0]);
  const out=[]; if(!iv.length) return out; let hi=iv[0][1];
  for(const [a,b] of iv.slice(1)){ if(a-hi>GAP_MIN) out.push([hi,a]); hi=Math.max(hi,b); }
  return out;
}
const shownEvents = () => [...new Set(items.get().map(i=>i.eid).filter(id=>id && !bgIds.has(id)))].map(id=>byId[id]);
const firstShown = () => Math.min(...shownEvents().map(e=>yr(e.date)));

const yearLabel = (date)=>{ const y=date.year(); return y<0? (-y)+" BCE" : String(y); };
const timeline = new vis.Timeline(document.getElementById("tl"), items, groups, {
  stack:true, zoomKey:"", orientation:{axis:"both"}, margin:{item:{horizontal:4,vertical:4}},
  start:toDate("1930"), end:toDate("2027"), max:toDate("2030"),
  zoomMin:1000*60*60*24*45, zoomMax:1000*60*60*24*365*2600,
  minHeight:"320px", verticalScroll:false, horizontalScroll:false,
  showCurrentTime:false, selectable:true, multiselect:true, tooltip:{followMouse:true,overflowMethod:"cap"},
  format:{
    minorLabels:(date,scale)=> scale==="year"? yearLabel(date) : (scale==="month"? date.format("MMM") : date.format("D")),
    majorLabels:(date,scale)=> (scale==="month"||scale==="day"||scale==="weekday")? yearLabel(date) : ""
  }
});
for(const m of markers){
  timeline.addCustomTime(toDate(m.date), "m::"+m.id);
  timeline.setCustomTimeTitle(m.title+" ("+fmtDate(m.date)+")", "m::"+m.id);
}

let breakIds = [];
function updateGaps(){
  const gaps = computeGaps(shownEvents());
  for(const id of breakIds) timeline.removeCustomTime(id);
  breakIds = [];
  timeline.setOptions({ hiddenDates: gaps.map(([a,b])=>({start:toDate(String(a+GAP_PAD)), end:toDate(String(b-GAP_PAD))})),
                        min: toDate(String(firstShown()-20)) });
  gaps.forEach(([a,b],i)=>{ const id="brk-"+i; timeline.addCustomTime(toDate(String(a+GAP_PAD)), id); breakIds.push(id); });
}

// switch between labelled and dots-only items as the visible span crosses COMPACT_YEARS
function spanYears(){ const w=timeline.getWindow(); return (w.end-w.start)/(365.25*864e5); }
timeline.on("rangechanged", ()=>{
  const c = spanYears() > COMPACT_YEARS;
  if(c!==state.compact){ state.compact=c; const sel=timeline.getSelection(); items.clear(); items.add(buildItems()); timeline.setSelection(sel); }
});
state.compact = spanYears() > COMPACT_YEARS;

// ---- presets ----
const PRESETS = [["Everything","FIRST","2028"],["Before computers","FIRST","1945"],
  ["Rules","1953","1999","Rules and reasoning, 1955–1980, and rules at work (expert systems and search), 1980–1997"],
  ["Data","1970","2013","Data: statistics and learning replace rules, 1972–2011"],
  ["Scale","2004","2024","Scale: deep learning, 2006–2016, and transformers and generative AI, 2017–2022"],
  ["Computer age","1936","2027","From Turing's 1936 paper to today"],["Since 2010","2010","2027"],["2025–2026","2025-01","2026-12"]];
const pBox = document.getElementById("presets");
for(const [n,a,b,tip] of PRESETS){ const btn=document.createElement("button"); btn.textContent=n; if(tip) btn.title=tip;
  btn.onclick=()=>timeline.setWindow(toDate(a==="FIRST"? String(firstShown()-15) : a),toDate(b),{animation:true}); pBox.appendChild(btn); }

// ---- cards ----
const card = document.getElementById("card");
const cardWrap = document.getElementById("card-wrap"), backdrop = document.getElementById("backdrop");
const MOBILE = matchMedia("(max-width: 820px)");
function openCard(){
  cardWrap.scrollTop = 0;
  if(!MOBILE.matches) return;
  cardWrap.classList.add("open"); backdrop.classList.add("open"); document.body.style.overflow = "hidden";
}
function closeCard(){
  cardWrap.classList.remove("open"); backdrop.classList.remove("open"); document.body.style.overflow = "";
  hashExtra = {}; setHash({});
}
document.getElementById("closeCard").onclick = closeCard;
backdrop.onclick = closeCard;
document.addEventListener("keydown", e=>{ if(e.key==="Escape" && cardWrap.classList.contains("open")) closeCard(); });
document.getElementById("aboutBtn").onclick = ()=>{ intro(); openCard(); };
function imgHtml(img){
  if(!img || (!img.src && !img.source_url)) return "";
  const src = img.src ? (/^https?:/.test(img.src) ? img.src : IMG_BASE+img.src) : "";
  const link = img.source_url ? ` <a href="${esc(img.source_url)}" target="_blank" rel="noopener">Source</a>` : "";
  const badge = !DATA.public && img.rights_status && img.rights_status!=="clear" ? ` <span class="badge">rights: ${esc(img.rights_status)}</span>` : "";
  if(src) return `<figure><img src="${esc(src)}" alt="" loading="lazy" referrerpolicy="no-referrer">
      <figcaption>${esc(img.credit||"")}${link}${badge}</figcaption></figure>`;
  return `<div class="placeholder">${esc(img.credit||"Photo")}${link}</div>`;
}
function linked(text, links){
  if(!text) return "";
  let out="", pos=0;
  for(const [a,b,t] of (links||[])){
    const [kind,key] = [t.slice(0,1), t.slice(2)];
    if(kind==="e" && !byId[key]) continue;
    out += esc(text.slice(pos,a)) + `<a href="#" class="xref" ${kind==="e"?`data-event="${esc(key)}"`:`data-person="${esc(key)}"`}>${esc(text.slice(a,b))}</a>`;
    pos = b;
  }
  return out + esc(text.slice(pos));
}
function predictionHtml(pr, links){
  if(typeof pr!=="object") return `<h3>The prediction</h3><p>${esc(pr)}</p>`;
  return `<h3>The prediction</h3><p>${pr.by?esc(pr.by)+", ":""}for ${esc(pr.for_year||"?")}: <em>${esc(pr.said||"")}</em></p>
    ${pr.outcome?`<p><strong>What happened.</strong> ${linked(pr.outcome, links)}</p>`:""}`;
}
function linkify(s){ return esc(s).replace(/(https?:\/\/[^\s,)]+)/g, u=>`<a href="${u}" target="_blank" rel="noopener">link</a>`); }
function showEvent(id){
  const e = byId[id]; if(!e) return;
  const L = e.links || {};
  const ppl = e.people.map(n=> personByName[n]
      ? `<button class="chip" data-person="${esc(n)}">${esc(n)}</button>` : `<span class="chip">${esc(n)}</span>`).join("");
  card.innerHTML = `
    <div class="date">${esc(dateLabel(e))}${e.status!=="verified"?'<span class="badge">to confirm</span>':""}${e.context?'<span class="badge" style="background:var(--chip);color:var(--muted)" title="Sets the scene; not AI itself">context</span>':""}</div>
    <h2>${esc(e.title)}</h2>
    ${imgHtml(e.image)}
    <p>${linked(e.description, L.description)}</p>
    ${e.judged? `<h3>How was it judged?</h3><div class="scored"><strong>${esc(e.judged.label)}.</strong> ${linked(e.judged.detail, L.judged)}</div>`:""}
    ${e.prediction? predictionHtml(e.prediction, L.outcome):""}
    ${ppl? `<h3>People</h3><div class="chips">${ppl}</div>`:""}
    <h3>Lenses</h3><div class="chips">${e.lenses.map(l=>`<span class="chip" style="box-shadow:inset 3px 0 var(--${l})">${esc(LENS_NAME[l]||l)}</span>`).join("")}</div>
    ${e.in_chapter? `<p class="date">In Chapter 1${e.chapter_section?", Section "+esc(e.chapter_section):""}</p>`:""}
    ${e.sources?.length? `<h3>Sources</h3><ol class="src">${e.sources.map(s=>`<li>${linkify(s)}</li>`).join("")}</ol>`:""}`;
  setHash({event:id});
  openCard();
}
function showPerson(name){
  const p = personByName[name]; if(!p) return;
  const theirs = ev.filter(e=>e.people.includes(name));
  const ids = []; for(const e of theirs) for(const l of e.lenses) if(state.lenses.has(l)) ids.push(e.id+"::"+l);
  timeline.setSelection(ids.filter(i=>items.get(i)));
  const missing = [...new Set(theirs.flatMap(e=>e.lenses))].filter(l=>!state.lenses.has(l));
  const por = p.portrait;
  card.innerHTML = `
    <div class="date">${esc(p.born||"?")} – ${esc(p.died||"")}</div>
    <h2>${esc(p.name)}</h2>
    <div class="chips">${(p.roles||[]).map(r=>`<span class="chip">${esc(r)}</span>`).join("")}</div>
    ${por? imgHtml(por) : ""}
    <p>${linked(p.summary, p.links?.summary)}</p>
    ${p.penn_connection? `<h3>Penn connection</h3><p>${esc(p.penn_connection)}</p>`:""}
    <h3>On the timeline</h3>
    <div class="chips">${theirs.map(e=>`<button class="chip" data-event="${esc(e.id)}">${esc(fmtDate(e.date))} · ${esc(e.title)}</button>`).join("")}</div>
    ${missing.length? `<p class="date">Some events are in lenses that are switched off: ${missing.map(l=>esc(LENS_NAME[l])).join(", ")}.</p>`:""}
    ${p.media?.length? `<h3>Watch and listen</h3><ul>${p.media.map(m=>`<li><a href="${esc(m.url)}" target="_blank" rel="noopener">${esc(m.title)}</a></li>`).join("")}</ul>`:""}
    ${p.sources?.length? `<h3>Sources</h3><ol class="src">${p.sources.map(s=>`<li>${linkify(s)}</li>`).join("")}</ol>`:""}`;
  setHash({person:name});
  openCard();
}
function intro(){
  card.innerHTML = `<h2>Start anywhere</h2>
   <p>Highlights is the chapter's story: only events Chapter 1 tells. "More milestones" adds AI events the chapter leaves out. Any lens can be switched off while another is on. Turn on other lenses to see the same seventy years, and the centuries before, as a different story.</p>
   <p class="empty">The Periods lane at the top names the chapter's three approaches, rules, data and scale, and the two AI winters, and the winters are shaded across every lane. The red line marks the 1955 naming of "artificial intelligence."</p>
   <h3>People</h3>
   <div class="chips">${people.map(p=>`<button class="chip" data-person="${esc(p.name)}">${esc(p.name)}</button>`).join("")}</div>`;
}
card.addEventListener("click", ev2=>{
  const t = ev2.target.closest("[data-person],[data-event]"); if(!t) return;
  ev2.preventDefault(); cardWrap.scrollTop = 0;
  if(t.dataset.person) showPerson(t.dataset.person);
  else { const e=byId[t.dataset.event]; focusEvent(e); showEvent(e.id); }
});
function focusEvent(e, anim=true){
  const ids = e.lenses.map(l=>e.id+"::"+l).filter(i=>items.get(i));
  if(ids.length){ timeline.setSelection(ids); timeline.moveTo(toDate(e.date),{animation:anim}); }
}
timeline.on("select", p=>{
  const id = p.items.find(i=>!String(i).startsWith("bg::"));
  if(id && items.get(id)?.eid) showEvent(items.get(id).eid);
});

// ---- list view ----
const list = document.getElementById("list");
function renderList(){
  const vis_ = ev.filter(e=>e.kind!=="marker" && matches(e) && e.lenses.some(l=>showIn(e,l)));
  list.innerHTML = `<ol class="empty" style="color:var(--ink)">${vis_.map(e=>
    `<li><strong>${esc(dateLabel(e))}</strong>: <a href="#" data-event="${esc(e.id)}">${esc(e.title)}</a>${e.status!=="verified"?' <span class="badge">to confirm</span>':""}</li>`).join("")}</ol>`;
}
list.addEventListener("click", x=>{ const a=x.target.closest("[data-event]"); if(a){ x.preventDefault(); showEvent(a.dataset.event);} });
function setView(v){
  state.view = v;
  document.getElementById("tl").style.display = v==="timeline"?"":"none";
  list.style.display = v==="list"?"block":"none";
  document.getElementById("viewBtn").textContent = v==="timeline"?"List view":"Timeline view";
  if(v==="list") renderList();
  else timeline.redraw();
}
document.getElementById("viewBtn").onclick = ()=> setView(state.view==="timeline"?"list":"timeline");

// ---- refresh / search / hash ----
function refresh(){
  groups.update(LENSES.map(([id])=>({id, visible:state.lenses.has(id)})));
  items.clear(); items.add(buildItems());
  updateGaps();
  if(state.view==="list") renderList();
  setHash({});
}
let qt; document.getElementById("q").addEventListener("input", x=>{ clearTimeout(qt); qt=setTimeout(()=>{ state.q=x.target.value.trim().toLowerCase(); refresh(); },200); });
document.getElementById("unconf").checked = state.unconf;
document.getElementById("unconf").onchange = x=>{ state.unconf=x.target.checked; refresh(); };
document.getElementById("ctx").onchange = x=>{ state.ctx=x.target.checked; refresh(); };
let hashExtra = {};
function setHash(extra){
  if(Object.keys(extra).length) hashExtra = extra;
  const h = new URLSearchParams({lenses:[...state.lenses].filter(l=>l!=="core").join(","), ...(state.lenses.has("core")?{}:{hl:"0"}), ...hashExtra});
  history.replaceState(null,"","#"+h.toString());
}

const h0 = new URLSearchParams(location.hash.slice(1));
refresh();
if(h0.get("event") && byId[h0.get("event")]){ const e0=byId[h0.get("event")]; showEvent(e0.id); timeline.once("changed", ()=>setTimeout(()=>focusEvent(e0,false),0)); }
else if(h0.get("person")) showPerson(h0.get("person"));
else intro();
if(MOBILE.matches) setView("list");  // phones start in the list; the timeline is one tap away
</script>
</body>
</html>
