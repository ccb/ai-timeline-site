"died": null, "woman": false, "roles": ["entrepreneur", "investor", "CEO of OpenAI"], "affiliations": ["Loopt (co-founder, 2005)", "Y Combinator (president, 2014-2019)", "OpenAI (co-founder 2015; CEO from 2019)"], "summary": "Sam Altman is an American entrepreneur who left Stanford to found the location-sharing app Loopt in 2005, one of the first companies backed by the start-up accelerator Y Combinator. He ran Y Combinator from 2014 to 2019. In 2015 he and others, including Elon Musk, launched OpenAI as a non-profit research lab. He became its chief executive in 2019. Under him OpenAI released ChatGPT on 30 November 2022, which reached a mass audience within weeks and set off the current AI boom. On 17 November 2023 OpenAI's board fired him, saying he had not been consistently candid with it. Within five days, after most staff threatened to leave, he was back with a new board. In May 2024 he promoted a talking voice model with the single word 'her'.", "contributions": [{"event_id": "openai-founded-2015", "text": "Co-founded OpenAI as a non-profit in December 2015."}, {"event_id": "chatgpt-launch-2022", "text": "Was OpenAI's CEO when ChatGPT launched on 30 November 2022."}, {"event_id": "openai-altman-fired-rehired-2023", "text": "Was fired by OpenAI's board on 17 November 2023 and reinstated within five days."}, {"event_id": "gpt4o-her-2024", "text": "Promoted the GPT-4o voice demo with a one-word post, 'her', prompting Scarlett Johansson's objection."}], "lenses": ["chatbots", "companies-and-money"], "penn_connection": "", "portrait": {"license": "CC BY 2.0", "credit": "Photo: Village Global (Flickr), CC BY 2.0", "rights_status": "clear", "source_url": "https://commons.wikimedia.org/wiki/File:Sam_Altman_November_2022.jpg", "src": "photos/alphago-alphafold-llms/16-sam-altman-nov-2022.jpg"}, "media": [], "sources": ["Encyclopaedia Britannica, 'Sam Altman', https://www.britannica.com/biography/Sam-Altman", "Wikipedia, 'Sam Altman', https://en.wikipedia.org/wiki/Sam_Altman", "OpenAI blog posts of 2023-11-17 ('OpenAI announces leadership transition') and 2023-11-29 (Altman returns as CEO), https://openai.com/blog (exact URLs still needed)"], "confidence": "high", "links": {"summary": [[274, 280, "e:openai-founded-2015"], [376, 383, "e:chatgpt-launch-2022"]]}}, {"id": "mary-shelley", "name": "Mary Shelley", "born": 1797, "died": 1851, "woman": true, "roles": ["novelist", "editor"], "affiliations": [], "summary": "Mary Wollstonecraft Shelley was an English novelist, born in London in 1797. The idea for Frankenstein came to her in the summer of 1816, near Lake Geneva, during a ghost-story contest with Percy Shelley and Lord Byron. The novel appeared anonymously on January 1, 1818, and she revised it in 1831. It tells of Victor Frankenstein, who builds an artificial being, abandons it, and is destroyed by what he made. That plot became the template for stories in which a creation turns on its maker, and newspaper writers still reach for the name Frankenstein when they write about AI. Shelley also wrote other novels and edited her late husband's poems. She died in London in 1851.", "contributions": [{"event_id": "frankenstein-1818", "text": "Published Frankenstein (1818), the founding story of a made being that turns on its maker, still the go-to metaphor in AI headlines."}], "lenses": ["sci-fi", "philosophy"], "penn_connection": "", "portrait": {"url": "https://commons.wikimedia.org/wiki/File:Mary_Wollstonecraft_Shelley_Rothwell.tif", "license": "Public domain", "credit": "Richard Rothwell. Public domain, via Wikimedia Commons.", "rights_status": "clear", "source_url": "https://commons.wikimedia.org/wiki/File:Mary_Wollstonecraft_Shelley_Rothwell.tif", "src": "photos/people-portraits/mary-shelley-commons.jpg"}, "media": [], "sources": ["Encyclopaedia Britannica, 'Mary Wollstonecraft Shelley', https://www.britannica.com/biography/Mary-Wollstonecraft-Shelley", "Encyclopaedia Britannica, 'Frankenstein', https://www.britannica.com/topic/Frankenstein-novel-by-Shelley", "Penguin Random House author page, 'Mary Shelley', https://www.penguinrandomhouse.com/authors/28028/mary-shelley/"], "confidence": "high", "links": {"summary": [[90, 102, "e:frankenstein-1818"]]}}, {"id": "betty-snyder-holberton", "name": "Betty Snyder Holberton", "born": 1917, "died": 2001, "woman": true, "roles": ["programmer", "computer (human calculator)", "software pioneer"], "affiliations": ["Moore School of Electrical Engineering, University of Pennsylvania", "Aberdeen Proving Ground", "Eckert-Mauchly Computer Corporation", "Remington Rand", "David Taylor Model Basin", "National Bureau of Standards"], "summary": "Frances Elizabeth (Betty) Snyder Holberton was born in Philadelphia in 1917. The Moore School at Penn hired her as a 'computer', a person who worked out artillery tables by hand, and in 1945 she became one of the six women chosen to program ENIAC. When ENIAC was shown to the press in February 1946, she and the other programmers were not introduced. She kept going: at Eckert and Mauchly's company and then Remington Rand, she wrote the first sort-merge generator for the UNIVAC I (1951-52), a program that wrote other sorting programs. Grace Hopper said it gave her early ideas about compilers. Later, at the National Bureau of Standards, she worked on the COBOL and FORTRAN standards. She died in 2001.", "contributions": [{"event_id": "eniac-six-programmers-1945", "text": "One of the six women picked to program ENIAC, working out how to set up problems from wiring diagrams with no manual or language."}, {"event_id": "eniac-unveiled", "text": "Helped get ENIAC ready for its February 1946 public demonstration at Penn."}, {"event_id": "eniac-programmers-left-out-1946", "text": "Was not introduced to the press at the unveiling, like the other women programmers."}], "lenses": ["core", "work-and-labor"], "penn_connection": "Moore School, Penn (ENIAC)", "portrait": {"url": "https://commons.wikimedia.org/wiki/File:Betty-Holbeton-circa-1950s-600dpi.jpg", "license": "Public domain", "credit": "Unknown photographer. Public domain, via Wikimedia Commons.", "rights_status": "clear", "source_url": "https://commons.wikimedia.org/wiki/File:Betty-Holbeton-circa-1950s-600dpi.jpg", "src": "photos/people-portraits/betty-snyder-holberton-commons.jpg"}, "media": [{"title": "The Computers (documentary, ENIAC Programmers Project, premiered 2014)", "url": "https://eniacprogrammers.org/documentary-info/", "kind": "documentary"}, {"title": "An Interview with Frances E. Holberton (OH 50), Charles Babbage Institute, 14 April 1983", "url": "https://umedia.lib.umn.edu/item/p16022coll92:8", "kind": "oral history"}, {"title": "Penn Today, 'Documentary film showcases women of ENIAC' (2015)", "url": "https://penntoday.upenn.edu/2015-04-09/latest-news/documentary-film-showcases-women-eniac", "kind": "article"}], "sources": ["IEEE Computer Society, Computer Pioneers, 'Frances Elizabeth (Betty) Snyder Holberton', https://history.computer.org/pioneers/holberton.html", "IEEE Computer Society, 'About the Women of ENIAC', https://computer.org/volunteering/awards/pioneer/about-women-of-eniac", "Route Fifty, 'Computer pioneer Betty Holberton dies at 84' (2002), https://www.route-fifty.com/digital-government/2002/01/computer-pioneer-betty-holberton-dies-at-84/288261"], "confidence": "high", "links": {"summary": [[241, 246, "e:eniac-unveiled"], [370, 376, "p:J. Presper Eckert"], [381, 390, "p:John Mauchly"], [538, 550, "p:Grace Hopper"]]}}, {"id": "marlyn-wescoff-meltzer", "name": "Marlyn Wescoff Meltzer", "born": 1922, "died": 2008, "woman": true, "roles": ["programmer", "computer (human calculator)"], "affiliations": ["Moore School of Electrical Engineering, University of Pennsylvania", "Temple University (BA 1942)"], "summary": "Marlyn Wescoff Meltzer was born in Philadelphia in 1922 and graduated from Temple University in 1942. The Moore School at Penn hired her to do weather calculations, partly because she knew how to run an adding machine. In 1943 she moved to the team calculating artillery trajectories by hand, and in 1945 she was one of the six women chosen to program ENIAC, the first general-purpose electronic computer. The programmers had no manuals and no programming languages; they set up each problem from the machine's wiring diagrams. She resigned in 1947 to get married, before ENIAC moved to Aberdeen Proving Ground. In 1997 she and the other five were inducted into the Women in Technology International Hall of Fame. She died in 2008.", "contributions": [{"event_id": "eniac-six-programmers-1945", "text": "Calculated ballistics trajectories by hand, then became one of the six women who first programmed ENIAC."}], "lenses": ["core", "work-and-labor"], "penn_connection": "Moore School, Penn (ENIAC)", "portrait": null, "media": [{"title": "The Computers (documentary, ENIAC Programmers Project, premiered 2014)", "url": "https://eniacprogrammers.org/documentary-info/", "kind": "documentary"}, {"title": "ENIAC Programmers Project (Kathy Kleiman)", "url": "https://eniacprogrammers.org/", "kind": "project site"}], "sources": ["IEEE Computer Society, 'About the Women of ENIAC', https://computer.org/volunteering/awards/pioneer/about-women-of-eniac", "Wikipedia, 'Marlyn Meltzer', https://en.wikipedia.org/wiki/Marlyn_Meltzer", "Engineering and Technology History Wiki, 'Marlyn Meltzer', https://ethw.org/Marlyn_Meltzer", "ETHW, 'Marlyn Meltzer', https://ethw.org/Marlyn_Meltzer"], "confidence": "high", "links": {"summary": [[352, 357, "e:eniac-unveiled"]]}}, {"id": "grace-hopper", "name": "Grace Hopper", "born": 1906, "died": 1992, "woman": true, "roles": ["mathematician", "computer programmer", "naval officer (rear admiral)"], "affiliations": ["Yale University (PhD 1934)", "Vassar College", "U.S. Navy", "Harvard (Mark I)", "Eckert-Mauchly Computer Corporation / Remington Rand (UNIVAC)"], "summary": "Grace Murray Hopper was born in New York City in 1906 and earned a PhD in mathematics at Yale in 1934. She joined the Navy reserve during World War II and programmed Harvard's Mark I. She then moved to the Philadelphia company founded by ENIAC's builders, J. Presper Eckert and John Mauchly. There, for the UNIVAC I, she wrote A-0 (1951-52), which turned a list of calls to ready-made routines into machine code, an early step toward programs that write programs. Her team's FLOW-MATIC was among the first languages to use English words, and it shaped COBOL, still used in business. Hopper served in the Navy into her late seventies, retiring as a rear admiral in 1986, and died in 1992.", "contributions": [{"event_id": "hopper-a0-compiler-1952", "text": "Wrote A-0 for the UNIVAC I (1951-52), an early system that assembled programs from prewritten routines; later led FLOW-MATIC, a major source for COBOL."}], "lenses": ["core"], "penn_connection": "Indirect: Eckert-Mauchly Computer Corp., Philadelphia, founded by ENIAC's Penn builders", "portrait": {"url": "https://commons.wikimedia.org/wiki/File:Commodore_Grace_M._Hopper,_USN_(covered).jpg", "license": "Public domain", "credit": "James S. Davis. Public domain, via Wikimedia Commons.", "rights_status": "clear", "source_url": "https://commons.wikimedia.org/wiki/File:Commodore_Grace_M._Hopper,_USN_(covered).jpg", "src": "photos/people-portraits/grace-hopper-commons.jpg"}, "media": [{"title": "Oral History of Captain Grace Hopper, interviewed by Angeline Pantages, December 1980 (Computer History Museum, transcript)", "url": "https://archive.computerhistory.org/resources/text/Oral_History/Hopper_Grace/102702026.05.01.pdf", "kind": "oral history"}, {"title": "Smithsonian, 'Grace Hopper: The Navy and Computers'", "url": "https://si.edu/spotlight/women-mathematicians/grace-hopper-the-navy-and-computers", "kind": "museum feature"}], "sources": ["Yale University, Office of the President, 'Biography of Grace Murray Hopper', https://president.yale.edu/biography-grace-murray-hopper", "MacTutor History of Mathematics, 'Grace Brewster Murray Hopper', https://mathshistory.st-andrews.ac.uk/Biographies/Hopper/", "Encyclopaedia Britannica, 'Grace Hopper', https://www.britannica.com/biography/Grace-Hopper"], "confidence": "high", "links": {"summary": [[238, 243, "e:eniac-unveiled"], [256, 273, "p:J. Presper Eckert"], [278, 290, "p:John Mauchly"], [327, 330, "e:hopper-a0-compiler-1952"]]}}, {"id": "kathleen-mckeown", "name": "Kathleen McKeown", "born": null, "died": null, "woman": true, "roles": ["computer scientist", "natural language processing researcher", "professor"], "affiliations": ["University of Pennsylvania (MS 1979, PhD 1982, Computer and Information Science)", "Columbia University (Henry and Gertrude Rothschild Professor of Computer Science)", "Columbia Data Science Institute (founding director, 2012-2017)"], "summary": "Kathleen McKeown earned her master's (1979) and PhD (1982) in Computer and Information Science at Penn. Her PhD system, TEXT, answered questions about a database with a whole, planned paragraph instead of a list of facts. It decided what to say and in what order, using patterns drawn from how people write explanations. That made it a founding work in natural language generation, the part of AI that writes text. She joined Columbia University in 1982, chaired its computer science department (1998-2003), and was the founding director of its Data Science Institute (2012-2017). Her group became a leader in automatic summarization, programs that condense many news articles into a short summary. She has also served as president of the Association for Computational Linguistics.", "contributions": [{"event_id": "mckeown-text-generation-1982", "text": "Built TEXT for her Penn PhD (1982), a program that planned and wrote paragraph-length answers, a founding work in text generation."}], "lenses": ["core", "chatbots"], "penn_connection": "PhD, Penn Computer and Information Science, 1982", "portrait": {"url": "https://commons.wikimedia.org/wiki/File:Impact_of_Digital_Media_Across_Sectors,_Kathy_McKeown_29s_(cropped).jpg", "license": "CC BY 3.0 (https://creativecommons.org/licenses/by/3.0)", "credit": "Northeast Big Data Innovation Hub. CC BY 3.0, via Wikimedia Commons.", "rights_status": "clear", "source_url": "https://commons.wikimedia.org/wiki/File:Impact_of_Digital_Media_Across_Sectors,_Kathy_McKeown_29s_(cropped).jpg", "src": "photos/people-portraits/kathleen-mckeown-commons.jpg"}, "media": [{"title": "Amazon Science, 'Amazon Scholar Kathleen McKeown takes stock of natural language processing'", "url": "https://amazon.science/working-at-amazon/amazon-scholar-kathleen-mckeown-takes-stock-of-natural-language-processing-where-we-are-and-where-were-going", "kind": "interview"}], "sources": ["Kathleen McKeown, Columbia home page, https://www.cs.columbia.edu/~kathy/", "Columbia Engineering faculty page, 'Kathleen McKeown', https://www.engineering.columbia.edu/faculty/kathleen-mckeown", "K. McKeown, 'The Text System for Natural Language Generation: An Overview', ACL 1982, https://aclanthology.org/P82-1028/"], "confidence": "high", "links": {"summary": []}}, {"id": "corinna-cortes", "name": "Corinna Cortes", "born": 1961, "died": null, "woman": true, "roles": ["computer scientist", "machine learning researcher", "research executive"], "affiliations": ["University of Copenhagen (MS physics)", "University of Rochester (PhD computer science, 1993)", "AT&T Bell Labs and AT&T Labs-Research (from 1989)", "Google Research (vice president; head of Google Research New York)"], "summary": "Corinna Cortes, born in Denmark in 1961, studied physics at the University of Copenhagen and earned a PhD in computer science at the University of Rochester in 1993. At AT&T Bell Labs she and Vladimir Vapnik published 'Support-Vector Networks' (1995). A support vector machine sorts examples into two groups by finding the widest possible gap between them, and their 'soft-margin' version lets a few examples fall on the wrong side, which made it work on messy real data. On the postal-digit benchmark it beat LeCun's early neural network, and for the next decade it was one of the main tools of data-driven AI. Cortes and Vapnik shared the 2008 ACM Paris Kanellakis Award. She later moved to Google, where she is a vice president of Google Research and has led its New York office.", "contributions": [{"event_id": "support-vector-networks", "text": "Co-wrote 'Support-Vector Networks' (1995) with Vladimir Vapnik, introducing the soft-margin support vector machine."}], "lenses": ["core"], "penn_connection": "", "portrait": null, "media": [{"title": "People of ACM: Corinna Cortes (2023)", "url": "https://www.acm.org/articles/people-of-acm/2023/corinna-cortes", "kind": "interview"}], "sources": ["Google Research blog, 'And the award goes to...' (2009, Kanellakis Award), https://research.google/blog/and-the-award-goes-to-3/", "ACM, 'ACM Awards Recognize Innovators in Computer Science' (March 2009), https://www.acm.org/media-center/2009/march/acm-awards-recognize-innovators-in-computer-science", "Google Research profile, 'Corinna Cortes', https://research.google/people/corinna-cortes/", "Wikipedia, 'Corinna Cortes', https://en.wikipedia.org/wiki/Corinna_Cortes", "C. Cortes and V. Vapnik, 'Support-Vector Networks', Machine Learning 20:273-297 (1995), https://link.springer.com/article/10.1007/BF00994018"], "confidence": "high", "links": {"summary": [[147, 156, "p:Nathaniel Rochester"], [510, 517, "p:Yann LeCun"]]}}, {"id": "cynthia-breazeal", "name": "Cynthia Breazeal", "born": 1967, "died": null, "woman": true, "roles": ["roboticist", "professor", "entrepreneur"], "affiliations": ["UC Santa Barbara (BS 1989)", "MIT AI Lab (SM 1993, ScD 2000)", "MIT Media Lab, Personal Robots Group (founder and director)", "MIT Open Learning (Dean for Digital Learning)", "MIT RAISE (director)", "Jibo, Inc. (co-founder)"], "summary": "Cynthia Breazeal, born in Albuquerque, New Mexico, in 1967, studied engineering at UC Santa Barbara and did her graduate work at MIT's Artificial Intelligence Lab. From 1997 she built Kismet, a robot head with large eyes, eyebrows and lips that reacted to people with expressions like happiness, fear and disgust, and pulled back when something came too close. Its baby-like features were meant to make adults want to look after it, so it could learn the way children do. Kismet raised early questions about why people bond with machines, the same questions companion chatbots raise now. It has been in the MIT Museum since 2000. Breazeal went on to found the Personal Robots Group at the MIT Media Lab, co-found the home-robot company Jibo (2012), and become MIT's dean for digital learning.", "contributions": [{"event_id": "kismet-social-robot-1997", "text": "Built Kismet (from 1997), one of the first robots designed for face-to-face social and emotional interaction."}], "lenses": ["chatbots", "philosophy"], "penn_connection": "", "portrait": {"url": "https://commons.wikimedia.org/wiki/File:Cynthia_Breazeal.jpg", "license": "CC BY-SA 4.0 (https://creativecommons.org/licenses/by-sa/4.0)", "credit": "MIT Media Lab. CC BY-SA 4.0, via Wikimedia Commons.", "rights_status": "clear", "source_url": "https://commons.wikimedia.org/wiki/File:Cynthia_Breazeal.jpg", "src": "photos/people-portraits/cynthia-breazeal-commons.jpg"}, "media": [{"title": "Cynthia Breazeal, 'The rise of personal robots', TEDWomen 2010", "url": "https://www.ted.com/talks/cynthia_breazeal_the_rise_of_personal_robots", "kind": "talk"}], "sources": ["MIT News, 'Kismet' (14 Feb 2001), https://news.mit.edu/2001/kismet", "MIT Media Lab, 'Cynthia Breazeal', https://www.media.mit.edu/people/cynthiab/overview/", "Wikipedia, 'Cynthia Breazeal', https://en.wikipedia.org/wiki/Cynthia_Breazeal"], "confidence": "high", "links": {"summary": [[184, 190, "e:kismet-social-robot-1997"]]}}, {"id": "daphne-koller", "name": "Daphne Koller", "born": 1968, "died": null, "woman": true, "roles": ["computer scientist", "educator", "entrepreneur"], "affiliations": ["Hebrew University of Jerusalem", "Stanford University (PhD 1993; faculty from 1995)", "Coursera (co-founder, co-CEO, president)", "Calico (chief computing officer)", "insitro (founder and CEO)"], "summary": "Daphne Koller was born in Jerusalem in 1968, studied at the Hebrew University of Jerusalem and earned her PhD at Stanford. As a Stanford professor from 1995 she became a leader in probabilistic machine learning, ways for computers to reason with uncertainty. In 2011 Stanford put free online versions of its AI and machine-learning courses on the web and each drew over 100,000 learners. In 2012 Koller and fellow Stanford professor Andrew Ng founded Coursera, turning these massive open online courses into a business. Penn was one of its four founding university partners. Koller served as co-CEO and president, left in 2016 for Alphabet's health company Calico, and in 2018 founded insitro, which uses machine learning to find new medicines.", "contributions": [{"event_id": "coursera-founded-2012", "text": "Co-founded Coursera with Andrew Ng (public launch 2012), turning massive open online courses into an industry."}], "lenses": ["companies-and-money"], "penn_connection": "Penn was one of Coursera's four founding university partners, with Stanford, Princeton and Michigan (announced 18 April 2012). Source: Penn Today, 'Penn to offer online classes via Coursera', 18 April 2012, https://penntoday.upenn.edu/2012-04-19/latest-news/penn-offer-online-classes-coursera", "portrait": {"url": "https://commons.wikimedia.org/wiki/File:Daphne_Koller_2019.jpg", "license": "CC BY 2.0 (https://creativecommons.org/licenses/by/2.0)", "credit": "Collision Conf from Toronto, Canada. CC BY 2.0, via Wikimedia Commons.", "rights_status": "clear", "source_url": "https://commons.wikimedia.org/wiki/File:Daphne_Koller_2019.jpg", "src": "photos/people-portraits/daphne-koller-commons.jpg"}, "media": [{"title": "Daphne Koller, 'What we're learning from online education', TEDGlobal 2012", "url": "https://www.ted.com/talks/daphne_koller_what_we_re_learning_from_online_education", "kind": "talk"}], "sources": ["insitro, leadership page, 'Daphne Koller', https://www.insitro.com/leadership/daphne-koller/", "Broad Institute, 'Daphne Koller', https://www.broadinstitute.org/bios/daphne-koller", "Coursera Blog, 'Celebrating 10 years of learning without limits', https://blog.coursera.org/celebrating-10-years-of-learning-without-limits", "Wikipedia, 'Daphne Koller', https://en.wikipedia.org/wiki/Daphne_Koller", "Penn Today, 'Penn to offer online classes via Coursera', 18 April 2012, https://penntoday.upenn.edu/2012-04-19/latest-news/penn-offer-online-classes-coursera", "Computer History Museum, 'Daphne Koller' profile, https://computerhistory.org/profile/daphne-koller/"], "confidence": "high", "links": {"summary": [[433, 442, "p:Andrew Ng"], [451, 459, "e:coursera-founded-2012"]]}}, {"id": "joy-buolamwini", "name": "Joy Buolamwini", "born": null, "died": null, "woman": true, "roles": ["computer scientist", "researcher", "activist", "founder"], "affiliations": ["Georgia Tech (BS)", "University of Oxford (MS, Rhodes Scholar)", "MIT Media Lab (MS, PhD)", "Algorithmic Justice League (founder)"], "summary": "Joy Buolamwini, a computer scientist born in Edmonton, Canada, to Ghanaian parents, began this work as an MIT graduate student when face-detection software failed to see her face until she put on a white mask. She called the problem the 'coded gaze' and in 2016 founded the Algorithmic Justice League to fight bias in AI. In 2018, with Timnit Gebru, she published Gender Shades, which tested three commercial systems that guess a person's gender from a photo. Error rates reached 34.7 percent for darker-skinned women, against at most 0.8 percent for lighter-skinned men. The paper also showed that two widely used collections of face photos were mostly of lighter-skinned people. In June 2020 IBM quit the face-recognition business and Amazon paused police use of its system, moves widely linked to her research.", "contributions": [{"event_id": "gender-shades-2018", "text": "Co-wrote Gender Shades (2018) with Timnit Gebru, showing commercial gender classifiers erred up to 34.7% on darker-skinned women against 0.8% on lighter-skinned men."}], "lenses": ["core", "philosophy"], "penn_connection": "", "portrait": {"url": "https://commons.wikimedia.org/wiki/File:Joy_Buolamwini_-_Wikimania_2018_01.jpg", "license": "CC BY-SA 4.0 (https://creativecommons.org/licenses/by-sa/4.0)", "credit": "Niccolò Caranti. CC BY-SA 4.0, via Wikimedia Commons.", "rights_status": "clear", "source_url": "https://commons.wikimedia.org/wiki/File:Joy_Buolamwini_-_Wikimania_2018_01.jpg", "src": "photos/people-portraits/joy-buolamwini-commons.jpg"}, "media": [{"title": "Joy Buolamwini, 'How I'm fighting bias in algorithms', TEDxBeaconStreet, November 2016", "url": "https://www.ted.com/talks/joy_buolamwini_how_i_m_fighting_bias_in_algorithms", "kind": "talk"}], "sources": ["J. Buolamwini and T. Gebru, 'Gender Shades', PMLR 81:77-91 (2018), https://proceedings.mlr.press/v81/buolamwini18a.html", "Carnegie Corporation, Great Immigrants honoree, 'Joy Buolamwini', https://www.carnegie.org/awards/honoree/joy-buolamwini/", "Wikipedia, 'Joy Buolamwini', https://en.wikipedia.org/wiki/Joy_Buolamwini", "Karen Hao, 'The two-year fight to stop Amazon from selling face recognition to the police', MIT Technology Review, 2020-06-12, https://www.technologyreview.com/2020/06/12/1003482/amazon-stopped-selling-police-face-recognition-fight/", "Fulbright Program, 'Joy Buolamwini'"], "confidence": "high", "links": {"summary": [[336, 348, "p:Timnit Gebru"], [364, 377, "e:gender-shades-2018"]]}}, {"id": "eugenia-kuyda", "name": "Eugenia Kuyda", "born": null, "died": null, "woman": true, "roles": ["entrepreneur", "founder"], "affiliations": ["Luka, Inc. (co-founder and CEO)", "Replika (founder; CEO until 2025)", "Wabi (founder, 2025)"], "summary": "Eugenia Kuyda grew up in Russia in the 1990s and later co-founded Luka, a small AI company, which she ran as CEO. When her close friend Roman Mazurenko died suddenly in 2015, she and her team gathered his old text messages and trained a chatbot that answered in his style, so friends could 'talk' with him again. The memorial bot drew a strong response, and Kuyda turned the idea into Replika, launched in 2017: an app that offers each user a personal AI friend that learns from their conversations. Replika grew to tens of millions of users and helped open the era of companion chatbots, along with hard questions about loneliness, grief and emotional dependence on software. In 2025 she stepped down as Replika's chief executive to start a new company, Wabi.", "contributions": [{"event_id": "replika-2017", "text": "Turned a memorial chatbot for her late friend Roman Mazurenko into Replika (2017), the first widely used AI-companion app."}], "lenses": ["chatbots", "companies-and-money"], "penn_connection": "", "portrait": null, "media": [{"title": "Lex Fridman Podcast #121, 'Eugenia Kuyda: Friendship with an AI Companion' (5 Sep 2020)", "url": "https://lexfridman.com/eugenia-kuyda/", "kind": "interview"}, {"title": "Software Engineering Daily, 'Bot Memorial with Eugenia Kuyda' (6 Dec 2016)", "url": "https://softwareengineeringdaily.com/podcasts/bot-memorial-with-eugenia-kuyda/", "kind": "interview"}], "sources": ["Casey Newton, 'Speak, Memory', The Verge, 2016-10-06, https://www.theverge.com/a/luka-artificial-intelligence-memorial-roman-mazurenko-bot", "Software Engineering Daily, 'Bot Memorial with Eugenia Kuyda', 2016-12-06, https://softwareengineeringdaily.com/podcasts/bot-memorial-with-eugenia-kuyda/", "Lex Fridman Podcast #121, https://lexfridman.com/eugenia-kuyda/", "Marina Temkin, 'Replika founder raises $20M pre-seed for Wabi, the YouTube of apps', TechCrunch, 2025-11-05, https://techcrunch.com/2025/11/05/replika-founder-raises-20m-pre-seed-for-wabi-the-youtube-of-apps", "Longreads, 'Speak, Memory: Can Artificial Intelligence Ease Grief?' (excerpt of Casey Newton's Verge story), 2016-10-06, https://longreads.com/2016/10/06/speak-memory-can-artificial-intelligence-ease-grief-2/"], "confidence": "high", "links": {"summary": [[385, 392, "e:replika-2017"]]}}, {"id": "gottfried-wilhelm-leibniz", "name": "Gottfried Wilhelm Leibniz", "born": 1646, "died": 1716, "woman": false, "roles": ["philosopher", "mathematician", "inventor", "diplomat", "librarian"], "affiliations": ["University of Leipzig", "Court of the Elector of Mainz", "Court of Hanover (librarian and historian)", "Royal Society (fellow)"], "summary": "Gottfried Wilhelm Leibniz, born in Leipzig in 1646, was a German philosopher and mathematician who invented calculus at the same time as Isaac Newton and was the first to publish it. He dreamed of a universal language of symbols and a 'calculus of reasoning', so that two people who disagreed could sit down and say 'Let us calculate', the founding dream behind logic-based AI. He also built a calculating machine, the stepped reckoner, shown in wooden model form to the Royal Society in London in 1673; unlike Pascal's earlier machine it could multiply and divide. Yet in 1714 he argued that a thinking machine, enlarged until you could walk inside it like a mill, would show only parts pushing parts, never a perception. He died in Hanover in 1716.", "contributions": [{"event_id": "leibniz-calculus-of-reasoning", "text": "Imagined a universal symbolic language and 'calculus of reasoning' that could settle disputes by calculation."}, {"event_id": "leibniz-stepped-reckoner", "text": "Demonstrated the stepped reckoner (1673), a calculator that could multiply and divide; its stepped drum was used in calculators for two centuries."}, {"event_id": "leibniz-mill-1714", "text": "Posed the 'mill' argument (Monadology, 1714): inside a thinking machine you would find only moving parts, not perception."}], "lenses": ["pre-computing", "philosophy", "symbolic-and-math"], "penn_connection": "", "portrait": {"url": "https://commons.wikimedia.org/wiki/File:Christoph_Bernhard_Francke_-_Bildnis_des_Philosophen_Leibniz_(ca._1695).jpg", "license": "Public domain", "credit": "Christoph Bernhard Francke. Public domain, via Wikimedia Commons.", "rights_status": "clear", "source_url": "https://commons.wikimedia.org/wiki/File:Christoph_Bernhard_Francke_-_Bildnis_des_Philosophen_Leibniz_(ca._1695).jpg", "src": "photos/people-portraits/gottfried-wilhelm-leibniz-commons.jpg"}, "media": [], "sources": ["Stanford Encyclopedia of Philosophy, 'Gottfried Wilhelm Leibniz', https://plato.stanford.edu/entries/leibniz/", "Encyclopaedia Britannica, 'Gottfried Wilhelm Leibniz', https://www.britannica.com/biography/Gottfried-Wilhelm-Leibniz", "Stanford Encyclopedia of Philosophy, 'Leibniz's Philosophy of Mind', https://plato.stanford.edu/entries/leibniz-mind/"], "confidence": "high", "links": {"summary": [[419, 435, "e:leibniz-stepped-reckoner"]]}}, {"id": "wolfgang-von-kempelen", "name": "Wolfgang von Kempelen", "born": 1734, "died": 1804, "woman": false, "roles": ["inventor", "Habsburg court official", "author"], "affiliations": ["Habsburg court of Maria Theresa, Vienna"], "summary": "Wolfgang von Kempelen, born in Pressburg (today Bratislava) in 1734, was an official and inventor at the Habsburg court in Vienna. In 1770 he showed Empress Maria Theresa a chess-playing 'automaton': a life-size figure dressed as a Turk, seated at a cabinet full of gears. It beat many challengers, but a human chess player was hidden inside the cabinet, moving the pieces. The Turk toured Europe and later America for decades, and it is the first famous case of a hyped machine whose skill really came from a hidden person, a pattern this course returns to when it looks at the human labor behind AI. It burned in a museum fire in Philadelphia in 1854. Kempelen spent about twenty years on a more honest machine, a hand-operated device that imitated human speech, and described it in a 1791 book. He died in Vienna in 1804.", "contributions": [{"event_id": "kempelen-turk", "text": "Built and showed the chess-playing Turk (1770) at Maria Theresa's court in Vienna."}, {"event_id": "kempelen-turk-hidden-operator-1770", "text": "The Turk's play came from a strong human player hidden inside the cabinet, the first famous case of hidden human labor behind a 'thinking machine'."}], "lenses": ["pre-computing", "work-and-labor"], "penn_connection": "", "portrait": {"url": "https://commons.wikimedia.org/wiki/File:Kempelen-charcoal.jpg", "license": "Public domain", "credit": "Wolfgang von Kempelen. Public domain, via Wikimedia Commons.", "rights_status": "clear", "source_url": "https://commons.wikimedia.org/wiki/File:Kempelen-charcoal.jpg", "src": "photos/people-portraits/wolfgang-von-kempelen-commons.jpg"}, "media": [], "sources": ["Heinz Nixdorf MuseumsForum, 'Wolfgang von Kempelen's Chess Turk', https://hnf.de/en/permanent-exhibition/exhibition-areas/the-mechanization-of-information-technology/early-automatons-miracles-of-technology/wolfgang-von-kempelens-chess-turk.html", "Oscar Schwartz, 'When Charles Babbage Played Chess With the Original Mechanical Turk', IEEE Spectrum, 2019, https://spectrum.ieee.org/untold-history-of-ai-charles-babbage-and-the-turk", "Wikipedia, 'Wolfgang von Kempelen', https://en.wikipedia.org/wiki/Wolfgang_von_Kempelen", "Wikipedia, 'Wolfgang von Kempelen's speaking machine', https://en.wikipedia.org/wiki/Wolfgang_von_Kempelen%27s_speaking_machine", "Linda Hall Library, Scientist of the Day, 'Wolfgang von Kempelen', https://www.lindahall.org/about/news/scientist-of-the-day/wolfgang-von-kempelen", "Jefferson Magazine (Thomas Jefferson University), 'Automaton Chess Player', Summer 2022, https://magazine.jefferson.edu/issues/summer-2022/automaton-chess-player.html"], "confidence": "high", "links": {"summary": []}}, {"id": "claude-shannon", "name": "Claude Shannon", "born": 1916, "died": 2001, "woman": false, "roles": ["mathematician", "electrical engineer", "professor"], "affiliations": ["University of Michigan", "MIT (SM and PhD, 1940; Donner Professor of Science 1958-1978)", "Bell Telephone Laboratories (1941-1972)"], "summary": "Claude Shannon, born in Petoskey, Michigan, in 1916, showed in his 1937 MIT master's thesis that the true/false logic of George Boole could be built from electrical switches, the groundwork for every digital circuit. At Bell Labs his 1948 paper 'A Mathematical Theory of Communication' founded information theory: it showed how to measure information in bits and how much can be sent reliably over a noisy line. In 1950 Shannon published the first paper on programming a computer to play chess, describing look-ahead search and a score for each position. In 1955 he co-signed the proposal for the Dartmouth summer workshop that gave 'artificial intelligence' its name. He also built playful machines, such as a maze-solving mechanical mouse. Shannon taught at MIT from 1958 and died in 2001.", "contributions": [{"event_id": "shannon-switching-circuits", "text": "Showed in his 1937 master's thesis that Boolean logic can be built with relay and switching circuits."}, {"event_id": "shannon-communication-1948", "text": "Founded information theory with 'A Mathematical Theory of Communication' (1948)."}, {"event_id": "shannon-chess-paper", "text": "Published 'Programming a Computer for Playing Chess' (1950), setting out search plus an evaluation function."}, {"event_id": "ai-named-1955", "text": "Co-signed the 1955 Dartmouth proposal with McCarthy, Minsky and Rochester, which coined 'artificial intelligence'."}], "lenses": ["core", "symbolic-and-math"], "penn_connection": "", "portrait": {"license": "CC BY 2.0", "credit": "Claude E. Shannon, studio portrait (photographer unknown). Tekniska museet, Stockholm, item 43069, via Flickr. CC BY 2.0.", "rights_status": "verify", "source_url": "https://commons.wikimedia.org/wiki/File:C.E._Shannon._Tekniska_museet_43069.jpg", "src": "photos/dartmouth-1956/05-claude-shannon-tekniska-museet.jpg"}, "media": [{"title": "The Bit Player (film about Shannon, dir. Mark Levinson, 2018/2019)", "url": "https://en.wikipedia.org/wiki/The_Bit_Player", "kind": "documentary"}], "sources": ["MIT News, 'MIT Professor Claude Shannon dies; was founder of digital communications' (2001), https://news.mit.edu/2001/shannon", "MacTutor, New York Times obituary of Claude Shannon (2001), https://mathshistory.st-andrews.ac.uk/Obituaries/Shannon_NYTimes/", "C. E. Shannon, 'A Mathematical Theory of Communication', Bell System Technical Journal 27 (1948), https://people.math.harvard.edu/~ctm/home/text/others/shannon/entropy/entropy.pdf"], "confidence": "high", "links": {"summary": [[121, 133, "p:George Boole"], [248, 284, "e:shannon-communication-1948"], [597, 606, "e:dartmouth-workshop"]]}}, {"id": "j-presper-eckert", "name": "J. Presper Eckert", "born": 1919, "died": 1995, "woman": false, "roles": ["electrical engineer", "inventor", "entrepreneur"], "affiliations": ["Moore School of Electrical Engineering, University of Pennsylvania (BS 1941, MS 1943)", "Electronic Control Company / Eckert-Mauchly Computer Corporation", "Remington Rand / Sperry Rand (UNIVAC Division)", "Unisys"], "summary": "John Presper Eckert Jr. was born in Philadelphia in 1919 and studied electrical engineering at Penn's Moore School. Still in his twenties, he was chief engineer of ENIAC, which he and physicist John Mauchly designed for the Army during World War II and which Penn unveiled in 1946. While ENIAC was being built, the team was already planning a successor, EDVAC, that would store its program in memory; John von Neumann's 1945 report on that design carried only von Neumann's name, a source of lasting dispute over credit. Eckert and Mauchly left Penn in 1946 and started the first U.S. company to build computers, later the Eckert-Mauchly Computer Corporation, which built UNIVAC, the first commercial computer in the United States. Eckert stayed with its successor companies until 1989 and died in 1995.", "contributions": [{"event_id": "edvac-report-1945", "text": "With Mauchly and the Moore School team, worked out the stored-program EDVAC design that von Neumann's 1945 report described under his name alone."}], "lenses": ["core", "companies-and-money"], "penn_connection": "Moore School, Penn (ENIAC co-inventor); BS 1941 and MS 1943, Penn", "portrait": {"url": "https://commons.wikimedia.org/wiki/File:Computer_Engineer_J._Presper_Eckert.png", "license": "Public domain", "credit": "Unknown, dedicated to Bettmann Archive. Public domain, via Wikimedia Commons.", "rights_status": "clear", "source_url": "https://commons.wikimedia.org/wiki/File:Computer_Engineer_J._Presper_Eckert.png", "src": "photos/people-portraits/j-presper-eckert-commons.png"}, "media": [{"title": "Smithsonian Videohistory, 'Transcript of an Interview with J. Presper Eckert, Chief Engineer, ENIAC Computer' (1988)", "url": "https://americanhistory.si.edu/comphist/eckert.htm", "kind": "oral history"}, {"title": "Oral history interview with J. Presper Eckert (OH 13), Charles Babbage Institute, 1977", "url": "https://hdl.handle.net/11299/107275", "kind": "oral history"}], "sources": ["National Academy of Engineering, Memorial Tributes vol. 10, 'J. Presper Eckert', https://www.nationalacademies.org/read/10403/chapter/14", "Daily Pennsylvanian, 'ENIAC inventor, U. alum dies at 76' (1995), https://www.thedp.com/article/1995/09/eniac-inventor-u-alum-dies-at-76", "Lemelson-MIT, 'J. Presper Eckert and John Mauchly', https://lemelson.mit.edu/resources/j-presper-eckert-and-john-mauchly", "Penn Engineering, 'ENIAC', https://www.engineering.upenn.edu/about/history-heritage/eniac/"], "confidence": "high", "links": {"summary": [[164, 169, "e:eniac-unveiled"], [194, 206, "p:John Mauchly"], [354, 359, "e:edvac-report-1945"], [401, 417, "p:John von Neumann"]]}}, {"id": "marvin-minsky", "name": "Marvin Minsky", "born": 1927, "died": 2016, "woman": false, "roles": ["computer scientist", "cognitive scientist", "professor"], "affiliations": ["Harvard University", "Princeton University", "MIT AI Lab (co-founder, co-director 1959-1974)", "MIT Media Lab (founding member, 1985)"], "summary": "Marvin Minsky, born in New York City in 1927, was one of the founders of AI. In 1951 he and Dean Edmonds built SNARC, a small machine of vacuum tubes and motors that learned by reward, one of the first hardware neural networks. He co-wrote the 1955 Dartmouth proposal that named the field, and in 1959 co-founded MIT's AI lab with John McCarthy. Minsky was famously optimistic: in 1967 he wrote that AI would be 'substantially solved' within a generation, and in 1970 Life magazine quoted him expecting human-level machines in three to eight years. His 1969 book Perceptrons, with Seymour Papert, showed the limits of simple neural networks and helped turn the field away from them for years. He won the Turing Award in 1969 and died in 2016.", "contributions": [{"event_id": "snarc-1951", "text": "Built SNARC with Dean Edmonds (1951), an early learning machine made of tubes and motors."}, {"event_id": "dartmouth-workshop", "text": "Co-organized the 1956 Dartmouth summer workshop that launched AI as a field."}, {"event_id": "minsky-generation-1967", "text": "Predicted in 1967 that AI would be 'substantially solved' within a generation."}, {"event_id": "minsky-perceptrons-1969", "text": "Co-wrote Perceptrons (1969) with Seymour Papert, mapping what one-layer networks cannot learn."}, {"event_id": "minsky-life-1970", "text": "Told Life magazine (1970) that human-level machine intelligence was three to eight years away."}], "lenses": ["core", "sci-fi"], "penn_connection": "", "portrait": {"license": "CC BY 2.0", "credit": "Marvin Minsky, 19 July 2012. Photo: Joi Ito via Flickr / Wikimedia Commons, CC BY 2.0.", "rights_status": "verify", "source_url": "https://commons.wikimedia.org/wiki/File:Marvin_Minsky_(1).jpg", "src": "photos/dartmouth-1956/08-marvin-minsky-2012-joi-ito.jpg"}, "media": [{"title": "Oral history interview with Marvin L. Minsky, Charles Babbage Institute, 1989", "url": "https://conservancy.umn.edu/handle/11299/107503", "kind": "oral history"}], "sources": ["MIT News, 'Marvin Minsky, \"father of artificial intelligence,\" dies at 88' (2016), https://news.mit.edu/2016/marvin-minsky-obituary-0125", "Patrick Winston, MIT CSAIL, 'Marvin Minsky' obituary, https://people.csail.mit.edu/phw/obituary.html", "The Tech, 'Minsky' obituary (28 Jan 2016), http://web.archive.org/web/20251216111514/https://thetech.com/2016/01/28/minsky-v135-n38 (archived copy of https://thetech.com/2016/01/28/minsky-v135-n38)"], "confidence": "high", "links": {"summary": [[111, 116, "e:snarc-1951"], [249, 258, "e:dartmouth-workshop"], [331, 344, "p:John McCarthy"], [563, 574, "e:minsky-perceptrons-1969"], [581, 595, "p:Seymour Papert"], [704, 716, "e:turing-award-2019"]]}}, {"id": "arthur-samuel", "name": "Arthur Samuel", "born": 1901, "died": 1990, "woman": false, "roles": ["electrical engineer", "computer scientist", "professor"], "affiliations": ["College of Emporia", "MIT (MS 1926)", "Bell Telephone Laboratories (1928-1946)", "University of Illinois (1946-1949)", "IBM (1949-1966)", "Stanford University (1966 onward)"], "summary": "Arthur Lee Samuel, born in Emporia, Kansas, in 1901, spent nearly twenty years at Bell Labs working on vacuum tubes before turning to computers. At IBM he wrote a checkers program for the IBM 701, the company's first commercial computer, and made it improve with practice: it played games against itself and studied expert games, adjusting how it scored positions. It is often called the world's first self-learning program, and it was shown on television in 1956. In his 1959 paper on the work he used the phrase 'machine learning', which named a field that now drives most of AI. Samuel retired from IBM in 1966 and moved to Stanford, where he taught and did research for many more years. He died in 1990.", "contributions": [{"event_id": "samuel-checkers-1955", "text": "Wrote a checkers program for IBM computers that got better by playing and by studying expert games."}, {"event_id": "samuel-checkers-tv", "text": "His learning checkers program was demonstrated on television in February 1956."}, {"event_id": "samuel-machine-learning-1959", "text": "Used the term 'machine learning' in his 1959 IBM Journal paper on the checkers work."}], "lenses": ["core"], "penn_connection": "", "portrait": null, "media": [], "sources": ["IEEE Computer Society, Computer Pioneers, 'Arthur Lee Samuel', https://history.computer.org/pioneers/samuel.html", "J. McCarthy and E. Feigenbaum, 'In Memoriam: Arthur Samuel: Pioneer in Machine Learning', AI Magazine 11(3), 1990, https://ojs.aaai.org/aimagazine/index.php/aimagazine/article/view/840", "A. L. Samuel, 'Some Studies in Machine Learning Using the Game of Checkers', IBM Journal of Research and Development 3(3), 1959, https://www.cs.virginia.edu/~evans/greatworks/samuel1959.pdf"], "confidence": "high", "links": {"summary": []}}, {"id": "joseph-weizenbaum", "name": "Joseph Weizenbaum", "born": 1923, "died": 2008, "woman": false, "roles": ["computer scientist", "professor", "critic of AI"], "affiliations": ["Wayne University, Detroit", "General Electric", "MIT (from 1963)"], "summary": "Joseph Weizenbaum was born in Berlin in 1923; his Jewish family fled Nazi Germany and reached the United States in the mid-1930s. He helped build early computers in Detroit and at General Electric, then joined MIT in 1963. There he wrote ELIZA (1966), a program that held a typed conversation by turning a user's words back into questions, most famously in the role of a psychotherapist. ELIZA understood nothing, yet many users confided in it, and some wanted to be left alone with it. That alarmed him. In Computer Power and Human Reason (1976) he argued that some decisions, such as judging and caring for people, should never be handed to machines. He became one of AI's sharpest critics, returned to Germany late in life, and died in 2008.", "contributions": [{"event_id": "eliza-1966", "text": "Wrote ELIZA (1966), the first famous chatbot, and saw how readily people read a mind into it."}, {"event_id": "eliza-meets-parry-1972", "text": "His ELIZA (DOCTOR script) was the partner in the 1972 ARPANET conversation with Kenneth Colby's PARRY."}, {"event_id": "weizenbaum-computer-power-1976", "text": "Argued in Computer Power and Human Reason (1976) that machines should not be given genuinely human choices."}], "lenses": ["chatbots", "philosophy"], "penn_connection": "", "portrait": {"license": "Public domain", "credit": "Rochester Institute of Technology, News & Events, 28 Oct 1982, via RIT Digital Archive / Wikimedia Commons (public domain)", "rights_status": "verify", "source_url": "https://commons.wikimedia.org/wiki/File:Weizenbaum_1982.jpg", "src": "photos/early-programs-and-robots/01-weizenbaum-1982-rit.jpg"}, "media": [{"title": "Plug & Pray (documentary, dir. Jens Schanze, 2010)", "url": "https://en.wikipedia.org/wiki/Plug_%26_Pray", "kind": "documentary"}], "sources": ["MIT News, 'Joseph Weizenbaum, professor emeritus of computer science, 85' (2008), https://news.mit.edu/2008/obit-weizenbaum-0310", "IEEE Computer Society, Computer Pioneers, 'Joseph Weizenbaum', https://history.computer.org/pioneers/weizenbaum.html", "J. Weizenbaum, 'ELIZA', Communications of the ACM 9(1), 1966, https://web.stanford.edu/class/cs124/p36-weizenabaum.pdf"], "confidence": "high", "links": {"summary": [[238, 243, "e:eliza-1966"], [508, 539, "e:weizenbaum-computer-power-1976"]]}}, {"id": "john-searle", "name": "John Searle", "born": 1932, "died": 2025, "woman": false, "roles": ["philosopher", "professor"], "affiliations": ["University of Wisconsin-Madison", "University of Oxford (Rhodes Scholar; BA, MA, DPhil)", "University of California, Berkeley (1959-2016 teaching)"], "summary": "John Rogers Searle, born in Denver in 1932, was an American philosopher of mind and language who taught at the University of California, Berkeley, from 1959. In 1980 he published the Chinese Room argument. Imagine a person who knows no Chinese, locked in a room with a rulebook for matching Chinese symbols to other symbols. People outside pass in questions in Chinese, and the person passes back perfect answers, yet understands nothing. A computer running a program, Searle said, is in the same position: following rules for symbols is not the same as understanding them. The argument is still the most cited reply to claims that chatbots 'understand' what they say, and it is a modern cousin of Leibniz's mill. Searle died in 2025.", "contributions": [{"event_id": "searle-chinese-room-1980", "text": "Published the Chinese Room argument ('Minds, Brains, and Programs', 1980): manipulating symbols by rule is not understanding."}], "lenses": ["philosophy"], "penn_connection": "", "portrait": {"url": "https://commons.wikimedia.org/wiki/File:John_Searle_speaking_at_Google_4_(cropped).jpg", "license": "CC BY-SA 4.0 (https://creativecommons.org/licenses/by-sa/4.0)", "credit": "FranksValli. CC BY-SA 4.0, via Wikimedia Commons.", "rights_status": "clear", "source_url": "https://commons.wikimedia.org/wiki/File:John_Searle_speaking_at_Google_4_(cropped).jpg", "src": "photos/people-portraits/john-searle-commons.jpg"}, "media": [{"title": "John Searle, 'Our shared condition -- consciousness', TEDxCERN, May 2013", "url": "https://www.ted.com/talks/john_searle_our_shared_condition_consciousness", "kind": "talk"}], "sources": ["Stanford Encyclopedia of Philosophy, 'The Chinese Room Argument', https://plato.stanford.edu/entries/chinese-room/", "Philosophy Now, 'John Searle 1932-2025', https://philosophynow.org/issues/171/John_Searle_1932-2025", "Daily Nous, 'John Searle (1932-2025)', https://dailynous.com/2025/09/28/john-searle-1932-2025/", "J. Searle, 'Minds, Brains, and Programs', Behavioral and Brain Sciences 3(3), 1980, https://doi.org/10.1017/S0140525X00005756"], "confidence": "high", "links": {"summary": [[183, 195, "e:searle-chinese-room-1980"], [698, 712, "e:leibniz-mill-1714"]]}}, {"id": "yann-lecun", "name": "Yann LeCun", "born": 1960, "died": null, "woman": false, "roles": ["computer scientist", "professor", "research executive", "entrepreneur"], "affiliations": ["ESIEE Paris", "Universite Pierre et Marie Curie (PhD 1987)", "AT&T Bell Labs (1988-1996)", "New York University (from 2003)", "Facebook / Meta, FAIR (2013-2025)", "AMI Labs (co-founder, 2025)"], "summary": "Yann LeCun, born near Paris in 1960, is a French computer scientist and one of the main builders of today's neural networks. At AT&T Bell Labs in 1989 his team trained a convolutional neural network, a design that scans an image in small patches the way the eye picks out edges and shapes, to read handwritten ZIP codes. By the late 1990s a later version, LeNet-5, was reading millions of bank checks a day in NCR machines. He joined New York University in 2003, and in 2013 Facebook hired him to found its AI research lab, FAIR. With Geoffrey Hinton and Yoshua Bengio he shared the 2018 Turing Award, computing's top prize. He left Meta at the end of 2025 to start his own AI research company.", "contributions": [{"event_id": "lecun-zip-codes-1989", "text": "Led the Bell Labs team whose convolutional network learned to read handwritten ZIP codes (1989)."}, {"event_id": "lenet5-checks", "text": "His LeNet-5 network read millions of checks a day in NCR systems at U.S. banks."}, {"event_id": "facebook-ai-research-2013", "text": "Hired by Facebook in December 2013 to found and lead FAIR."}, {"event_id": "turing-award-2019", "text": "Shared the 2018 ACM Turing Award (announced March 2019) with Hinton and Bengio for deep learning."}], "lenses": ["core", "companies-and-money"], "penn_connection": "", "portrait": {"license": "CC BY 4.0", "credit": "Photo: Alain Herzog / EPFL, CC BY 4.0, via Wikimedia Commons", "rights_status": "verify", "source_url": "https://commons.wikimedia.org/wiki/File:Yann_Lecun_during_a_conference_at_EPFL,_Lausanne,_5_october_2018.jpg", "src": "photos/neural-network-revival/NN-lecun-epfl-2018.jpg"}, "media": [], "sources": ["IEEE Milestone, 'Convolutional Neural Networks, 1989', ETHW, https://ethw.org/Milestones:Convolutional_Neural_Networks,_1989", "ACM A.M. Turing Award, 'Yann LeCun', https://amturing.acm.org/award_winners/lecun_6017366.cfm", "AP via NY1, 'Meta's chief AI scientist Yann LeCun to leave Meta and start new AI research company' (19 Nov 2025), https://ny1.com/nyc/all-boroughs/ap-top-news/2025/11/19/metas-chief-ai-scientist-yann-lecun-to-leave-meta-and-start-new-ai-research-company", "Wikipedia, 'Yann LeCun', https://en.wikipedia.org/wiki/Yann_LeCun"], "confidence": "high", "links": {"summary": [[356, 363, "e:lenet5-checks"], [535, 550, "p:Geoffrey Hinton"], [555, 568, "p:Yoshua Bengio"], [588, 600, "e:turing-award-2019"]]}}, {"id": "ashish-vaswani", "name": "Ashish Vaswani", "born": null, "died": null, "woman": false, "roles": ["computer scientist", "entrepreneur"], "affiliations": ["Birla Institute of Technology, Mesra (BTech)", "University of Southern California (PhD 2014)", "Google Brain (from 2016)", "Adept AI (co-founder, 2022)", "Essential AI (co-founder and CEO, from 2023)"], "summary": "Ashish Vaswani is an Indian-born computer scientist who studied at the Birla Institute of Technology in Mesra and earned his PhD at the University of Southern California in 2014. At Google Brain he was the first-listed author of 'Attention Is All You Need' (June 2017), written with seven Google colleagues. The paper introduced the Transformer, a design that lets a program weigh every word in a passage against every other word at once, instead of reading one word at a time. Transformers trained much faster on large computer clusters, and they became the engine of GPT, Claude, Gemini and nearly every chatbot since. Vaswani left Google to co-found the startup Adept, launched in 2022, and in 2023 co-founded Essential AI with Niki Parmar, another of the paper's authors.", "contributions": [{"event_id": "attention-is-all-you-need", "text": "First-listed author of 'Attention Is All You Need' (2017), which introduced the Transformer."}], "lenses": ["core"], "penn_connection": "", "portrait": null, "media": [], "sources": ["A. Vaswani et al., 'Attention Is All You Need', arXiv:1706.03762, 2017, https://arxiv.org/abs/1706.03762", "VentureBeat, 'Essential AI emerges from stealth with backing from Google, Nvidia and AMD', https://venturebeat.com/ai/essential-ai-emerges-from-stealth-with-backing-from-google-nvidia-and-amd", "Wikipedia, 'Ashish Vaswani', https://en.wikipedia.org/wiki/Ashish_Vaswani", "USC Viterbi School of Engineering, ''Attention Is All You Need': USC Alumni Paved Path for ChatGPT', March 2023, https://viterbischool.usc.edu/news/2023/03/attention-is-all-you-need-usc-alumni-paved-path-for-chatgpt/"], "confidence": "high", "links": {"summary": [[230, 255, "e:attention-is-all-you-need"], [582, 588, "e:gemini-2023"], [731, 742, "p:Niki Parmar"]]}}, {"id": "blake-lemoine", "name": "Blake Lemoine", "born": null, "died": null, "woman": false, "roles": ["software engineer"], "affiliations": ["Google, Responsible AI organization (until July 2022)"], "summary": "Blake Lemoine was a software engineer in Google's Responsible AI group, assigned to test whether the company's LaMDA chatbot produced biased or hateful speech. Over months of conversations he came to believe LaMDA was a person with feelings. He told Google, then published an edited transcript of his chats and spoke to The Washington Post, which reported his claim on June 11, 2022. He said his view came from his experience as a priest rather than as a scientist. Google said the claims were 'wholly unfounded', placed him on paid leave for breaking its confidentiality policy, and fired him in July 2022. Researchers widely rejected the claim, but the episode showed that the ELIZA effect, reading a mind into fluent text, could catch even an engineer who worked on the system.", "contributions": [{"event_id": "lemoine-lamda-2022", "text": "Claimed publicly in June 2022 that Google's LaMDA chatbot was sentient; Google rejected the claim and later fired him."}, {"event_id": "lamda-sentience-claim-2022", "text": "His published 'interview' with LaMDA became the best-known modern case of the ELIZA effect."}], "lenses": ["chatbots", "philosophy"], "penn_connection": "", "portrait": null, "media": [{"title": "Bloomberg Technology, 'Google Engineer on His Sentient AI Claim' (video, 23 June 2022)", "url": "https://www.bloomberg.com/news/videos/2022-06-23/google-engineer-on-his-sentient-ai-claim-video", "kind": "interview"}], "sources": ["Nitasha Tiku, 'The Google engineer who thinks the company's AI has come to life', Washington Post, 2022-06-11, http://web.archive.org/web/20260729043833/https://www.washingtonpost.com/technology/2022/06/11/google-ai-lamda-blake-lemoine/ (archived copy of https://www.washingtonpost.com/technology/2022/06/11/google-ai-lamda-blake-lemoine/)", "Engadget, 'Google places an engineer on leave after claiming its AI is sentient' (2022), https://www.engadget.com/google-ai-lamda-blake-lemoine-212412967.html", "CNN, 'Google fires engineer who contended its AI technology was sentient', 2022-07-23, https://edition.cnn.com/2022/07/23/business/google-ai-engineer-fired-sentient/index.html", "The Register, 'Google engineer suspended for violating confidentiality policies over AI sentience claims', 2022-06-13, https://theregister.com/2022/06/13/google_lamda_sentient_claims/", "NBC News / Reuters, 'Google has fired a software engineer who claimed an AI chatbot was sentient', 2022-07-23, https://www.nbcnews.com/news/us-news/google-fired-software-engineer-claimed-ai-chatbot-was-sentient-rcna39679"], "confidence": "high", "links": {"summary": [[111, 116, "e:lamda-2021"], [679, 684, "e:eliza-1966"]]}}, {"id": "frances-bilas-spence", "name": "Frances Bilas Spence", "born": "1922-03-02", "died": "2012-07-18", "woman": true, "roles": ["mathematician", "human 'computer' for artillery tables", "ENIAC programmer"], "affiliations": ["Moore School of Electrical Engineering, University of Pennsylvania", "Chestnut Hill College (B.A. 1942)"], "summary": "Frances Bilas was born in Philadelphia in 1922 and studied mathematics, with a minor in physics, at Chestnut Hill College, graduating in 1942. She was hired at Penn's Moore School as a 'computer', a person who worked out artillery tables by hand, and in 1945 became one of the six women chosen to program ENIAC. There were no programming languages, so the team worked out how to set up each problem from the machine's wiring diagrams. She kept working on ENIAC after the war, married the Army engineer Homer Spence in 1947 and left soon after to raise a family. When she died in 2012 she was the last of the six original programmers still living. A 1946 Army photograph shows her feeding punch cards into ENIAC.", "contributions": [{"event_id": "eniac-six-programmers-1945", "text": "One of the six women picked in 1945 to program ENIAC, working out problem setups from the machine's wiring diagrams."}], "lenses": ["core", "work-and-labor"], "penn_connection": "Moore School, Penn (ENIAC)", "portrait": {"url": "https://commons.wikimedia.org/wiki/File:Frances_Bilas_Spence_feeding_punch_cards_into_ENIAC,_Feb_1946.png", "license": "Public domain", "credit": "Unidentified U.S. Army photographer. Public domain, via Wikimedia Commons.", "rights_status": "clear", "source_url": "https://commons.wikimedia.org/wiki/File:Frances_Bilas_Spence_feeding_punch_cards_into_ENIAC,_Feb_1946.png", "src": "photos/people-portraits/frances-bilas-spence-commons.png"}, "media": [{"title": "The Computers (documentary short, 2014, ENIAC Programmers Project / Kathy Kleiman)", "url": "https://eniacprogrammers.org/documentary-info/", "kind": "documentary"}, {"title": "ENIAC Programmers Project", "url": "https://eniacprogrammers.org/", "kind": "oral history project"}], "sources": ["https://en.wikipedia.org/wiki/Frances_Spence", "IEEE Computer Society, 'About the Women of ENIAC', https://computer.org/volunteering/awards/pioneer/about-women-of-eniac", "Wikimedia Commons file page (1946 Army photo, public domain), https://commons.wikimedia.org/wiki/File:Frances_Bilas_Spence_feeding_punch_cards_into_ENIAC,_Feb_1946.png"], "confidence": "high", "links": {"summary": [[305, 310, "e:eniac-unveiled"]]}}, {"id": "ruth-lichterman-teitelbaum", "name": "Ruth Lichterman Teitelbaum", "born": "1924", "died": "1986", "woman": true, "roles": ["mathematician", "human 'computer' for ballistics trajectories", "ENIAC programmer", "trainer of later ENIAC programmers"], "affiliations": ["Hunter College (B.Sc. mathematics)", "Moore School of Electrical Engineering, University of Pennsylvania", "Ballistic Research Laboratory, Aberdeen Proving Ground"], "summary": "Ruth Lichterman was born in the Bronx, New York, in 1924 and earned a mathematics degree at Hunter College. Penn's Moore School hired her to compute ballistics trajectories by hand, and in 1945 she became one of the six original programmers of ENIAC. After the war ENIAC was moved to the Army's Ballistic Research Laboratory at Aberdeen Proving Ground in Maryland. She went with it and stayed about two more years to train the next group of ENIAC programmers. She married Adolph Teitelbaum in 1948 and died in Dallas in 1986. She died before Kathy Kleiman's ENIAC Programmers Project recorded long interviews with four of the six women, so less is known about her than about most of the others.", "contributions": [{"event_id": "eniac-six-programmers-1945", "text": "One of the six original ENIAC programmers; later moved with the machine to Aberdeen and trained the programmers who came after."}], "lenses": ["core", "work-and-labor"], "penn_connection": "Moore School, Penn (ENIAC)", "portrait": null, "media": [{"title": "The Computers (documentary short, 2014, ENIAC Programmers Project / Kathy Kleiman)", "url": "https://eniacprogrammers.org/documentary-info/", "kind": "documentary"}, {"title": "ENIAC Programmers Project", "url": "https://eniacprogrammers.org/", "kind": "oral history project"}], "sources": ["https://en.wikipedia.org/wiki/Ruth_Teitelbaum", "IEEE Computer Society, 'About the Women of ENIAC', https://computer.org/volunteering/awards/pioneer/about-women-of-eniac", "ETHW, 'Ruth Teitelbaum', https://ethw.org/Ruth_Teitelbaum", "ENIAC Programmers Project, https://eniacprogrammers.org/"], "confidence": "high", "links": {"summary": [[244, 249, "e:eniac-unveiled"]]}}, {"id": "margaret-masterman", "name": "Margaret Masterman", "born": "1910-05-04", "died": "1986-04-01", "woman": true, "roles": ["philosopher", "linguist", "pioneer of machine translation and computational linguistics", "college founder"], "affiliations": ["Cambridge Language Research Unit (founder and director)", "Lucy Cavendish College, Cambridge (co-founder, first Vice-President 1965-1975)", "Epiphany Philosophers (founder)"], "summary": "Margaret Masterman was a Cambridge philosopher, the daughter of the politician Charles Masterman and the writer Lucy Masterman. In the 1950s she set up the Cambridge Language Research Unit, a small group outside the university's official structure that asked whether computers could translate between languages. Instead of word-for-word swapping, her group tried to capture meaning, using thesaurus-like structures and small sets of basic 'semantic primitives'. A 1961 paper of hers contains the first recorded use of the term 'semantic network', a map of how word meanings connect, an idea still used in AI. The unit trained early computational linguists, including Karen Sparck Jones. She also co-founded Lucy Cavendish College, a Cambridge college for older women students, and wrote a well-known essay on Thomas Kuhn's idea of paradigms.", "contributions": [{"event_id": "masterman-clru-1954", "text": "Founded and led the Cambridge Language Research Unit, an early centre for machine translation; her 1961 paper is credited with the first recorded use of the term 'semantic network'."}], "lenses": ["core", "symbolic-and-math"], "penn_connection": "", "portrait": null, "media": [], "sources": ["https://en.wikipedia.org/wiki/Margaret_Masterman", "J. F. Sowa, review of Masterman, 'Language, Cohesion and Form' (2005), https://jfsowa.com/pubs/mmb_rev.htm", "https://en.wikipedia.org/wiki/Cambridge_Language_Research_Unit", "Archives Hub, 'Papers of Margaret Braithwaite' (Lucy Cavendish founding fellow and first Vice-President), https://archiveshub.ac.uk/search/archives/62ef9187-abc2-3a78-bd5d-5ef78f89f78d", "M. Masterman, 'The Nature of a Paradigm', in I. Lakatos and A. Musgrave (eds), Criticism and the Growth of Knowledge (Cambridge University Press, 1970), pp. 59-90, https://www.cambridge.org/core/books/abs/criticism-and-the-growth-of-knowledge/nature-of-a-paradigm/012EA1E6BA81DECB838CC6B2801DC678"], "confidence": "high", "links": {"summary": [[156, 188, "e:masterman-clru-1954"], [667, 685, "p:Karen Sparck Jones"]]}}, {"id": "barbara-grosz", "name": "Barbara Grosz", "born": "1948-07-21", "died": null, "woman": true, "roles": ["computer scientist", "natural language processing researcher", "multi-agent systems researcher", "AI ethics educator"], "affiliations": ["Harvard University (Higgins Professor of Natural Sciences, Emerita)", "Radcliffe Institute for Advanced Study (dean of science 2001-2007; dean 2007-2011)", "SRI International", "Stanford University"], "summary": "Barbara Grosz, born in Philadelphia in 1948, studied mathematics at Cornell and earned a computer science PhD at Berkeley. She worked at SRI International and Stanford before joining Harvard in 1986. With Candace Sidner she published a 1986 theory of how conversations are organised: what is said, what the speakers are trying to do, and what they are paying attention to at each moment. That framework helped computers keep track of what 'it' or 'that' refers to across a dialogue, a basic problem for any chatbot. She later turned to how computer agents and people can work together as teams. In 1993 she became the first woman president of AAAI, the main AI society. She co-founded Harvard's Embedded EthiCS program, which builds ethics lessons into computer science courses.", "contributions": [{"event_id": "grosz-sidner-discourse-1986", "text": "With Candace Sidner, proposed the three-part theory of discourse structure (language, intentions, attention) that became a standard account of how dialogue hangs together."}], "lenses": ["chatbots", "symbolic-and-math"], "penn_connection": "", "portrait": {"url": "https://commons.wikimedia.org/wiki/File:Barbara_Grosz_01.JPG", "license": "CC BY-SA 4.0 (https://creativecommons.org/licenses/by-sa/4.0)", "credit": "Bengt Oberger. CC BY-SA 4.0, via Wikimedia Commons.", "rights_status": "clear", "source_url": "https://commons.wikimedia.org/wiki/File:Barbara_Grosz_01.JPG", "src": "photos/people-portraits/barbara-grosz-commons.jpg"}, "media": [{"title": "'Past and future of AI: a chat with Barbara Grosz' (Harvard SEAS, 2015)", "url": "https://seas.harvard.edu/news/2015/09/past-and-future-ai-chat-barbara-grosz", "kind": "interview"}], "sources": ["https://en.wikipedia.org/wiki/Barbara_J._Grosz", "Harvard SEAS directory, Barbara Grosz, https://www.seas.harvard.edu/person/barbara-grosz", "B. J. Grosz and C. L. Sidner, 'Attention, Intentions, and the Structure of Discourse', Computational Linguistics 12(3):175-204 (1986), https://aclanthology.org/J86-3001/"], "confidence": "high", "links": {"summary": [[205, 219, "p:Candace Sidner"]]}}, {"id": "lillian-lee", "name": "Lillian Lee", "born": null, "died": null, "woman": true, "roles": ["computer scientist", "natural language processing researcher", "computational social scientist"], "affiliations": ["Cornell University (Charles Roy Davis Professor of Computer Science and Information Science; faculty since 1997)", "Harvard University (PhD 1997)", "Transactions of the ACL (co-editor-in-chief)"], "summary": "Lillian Lee is a computer scientist at Cornell University, where she studied as an undergraduate before earning her PhD at Harvard in 1997. In 2002, with Bo Pang and Shivakumar Vaithyanathan, she published 'Thumbs up?', which asked whether a computer could tell a positive movie review from a negative one by learning from labelled examples rather than from hand-written lists of good and bad words. Learning won, though sentiment turned out to be harder than sorting texts by topic. The paper helped launch sentiment analysis, now used everywhere from product reviews to social media monitoring, and in 2018 it received the Test of Time award covering all ACL-family conferences from 2002 to 2012. Her later work uses language to study social behaviour, and she is a Fellow of AAAI, ACL and ACM.", "contributions": [{"event_id": "pang-lee-sentiment-2002", "text": "Co-authored 'Thumbs up?' (EMNLP 2002), an early demonstration that machine learning from examples could classify the sentiment of movie reviews."}], "lenses": ["core"], "penn_connection": "", "portrait": null, "media": [], "sources": ["https://en.wikipedia.org/wiki/Lillian_Lee_(computer_scientist)", "L. Lee, 'Thumbs up?' paper homepage (Test of Time award for *ACL 2002-2012, presented at NAACL 2018), https://www.cs.cornell.edu/home/llee/papers/sentiment.home.html", "Cornell Computer Science, Lillian Lee, https://www.cs.cornell.edu/people/lillian-lee", "B. Pang, L. Lee and S. Vaithyanathan, EMNLP 2002, https://aclanthology.org/W02-1011/"], "confidence": "high", "links": {"summary": [[154, 161, "p:Bo Pang"]]}}, {"id": "margaret-mitchell", "name": "Margaret Mitchell", "born": null, "died": null, "woman": true, "roles": ["computer scientist", "AI ethics researcher"], "affiliations": ["Hugging Face (Chief Ethics Scientist; since 2021)", "Google Research (Ethical AI team co-lead, 2016-2021)", "Microsoft Research", "University of Aberdeen (PhD 2013)"], "summary": "Margaret Mitchell studied linguistics at Reed College and computational linguistics at the University of Washington, then earned a PhD at the University of Aberdeen in 2013. At Microsoft Research she worked on systems that describe images in words. She joined Google in 2016 and co-led its Ethical AI team with Timnit Gebru. Her best-known invention is the 'model card', a short standard document that says what an AI model is for, how it was tested and where it may fail; the 2019 paper introducing it led to wide adoption. She co-authored 'Stochastic Parrots' (2021), listed under the joke name 'Shmargaret Shmitchell'. Google fired her in February 2021, weeks after Gebru's exit. She joined Hugging Face later that year and was named to the first TIME100 AI list in 2023.", "contributions": [{"event_id": "stochastic-parrots-2021", "text": "Co-authored 'On the Dangers of Stochastic Parrots' (FAccT 2021) on the costs and harms of ever-larger language models; Google fired her in February 2021."}], "lenses": ["core", "philosophy"], "penn_connection": "", "portrait": {"url": "https://commons.wikimedia.org/wiki/File:MargaretMitchell2022.jpg", "license": "CC BY 3.0 (https://creativecommons.org/licenses/by/3.0)", "credit": "AI4LAM. CC BY 3.0, via Wikimedia Commons.", "rights_status": "clear", "source_url": "https://commons.wikimedia.org/wiki/File:MargaretMitchell2022.jpg", "src": "photos/people-portraits/margaret-mitchell-commons.jpg"}, "media": [{"title": "'How we can build AI to help humans, not hurt us' (TED, 2018)", "url": "https://www.ted.com/talks/margaret_mitchell_how_we_can_build_ai_to_help_humans_not_hurt_us", "kind": "talk"}, {"title": "TIME100 AI 2023: Margaret Mitchell (interview by Billy Perrigo)", "url": "https://time.com/collection/time100-ai/6309005/margaret-mitchell-ai/", "kind": "interview"}], "sources": ["https://en.wikipedia.org/wiki/Margaret_Mitchell_(scientist)", "TIME100 AI 2023, https://time.com/collection/time100-ai/6309005/margaret-mitchell-ai/", "M. Mitchell et al., 'Model Cards for Model Reporting', FAT* 2019 (arXiv 1810.03993)", "Engadget, 'Google has fired another AI ethics leader' (February 2021)"], "confidence": "high", "links": {"summary": [[311, 323, "p:Timnit Gebru"], [542, 560, "e:stochastic-parrots-2021"]]}}, {"id": "emily-bender", "name": "Emily Bender", "born": "1973", "died": null, "woman": true, "roles": ["linguist", "computational linguist", "critic of AI hype"], "affiliations": ["University of Washington (Professor of Linguistics, faculty since 2003; director, MS in Computational Linguistics)", "Stanford University (PhD 2000)", "Association for Computational Linguistics (president, 2024)"], "summary": "Emily M. Bender is a linguist at the University of Washington, where Bender has taught since 2003 and runs the computational linguistics master's program. With Alexander Koller, Bender wrote 'Climbing towards NLU' (ACL 2020), which imagines an octopus that eavesdrops on two castaways' messages and learns to mimic them, then fails when asked to help with a real-world task. The point: a system trained only on the form of language never gets at its meaning, and fluent replies seem sensible because the human reader supplies the sense. A year later Bender, with Timnit Gebru, Angelina McMillan-Major and Margaret Mitchell, coined 'stochastic parrots' for large language models. Bender served as president of the Association for Computational Linguistics in 2024 and co-wrote The AI Con (2025) with Alex Hanna.", "contributions": [{"event_id": "octopus-test-2020", "text": "With Alexander Koller, posed the octopus thought experiment in 'Climbing towards NLU' (ACL 2020) to argue that training on text form alone cannot yield understanding."}, {"event_id": "stochastic-parrots-2021", "text": "Lead author of 'On the Dangers of Stochastic Parrots' (FAccT 2021), which gave the field the phrase 'stochastic parrot'."}, {"event_id": "lamda-sentience-claim-2022", "text": "Quoted in the Washington Post's LaMDA story, linking the sentience claim to the stochastic-parrots argument."}], "lenses": ["philosophy", "chatbots"], "penn_connection": "", "portrait": {"url": "https://commons.wikimedia.org/wiki/File:Emily_M_Bender_CHM_Mountain_View_March_2025.jpg", "license": "CC BY-SA 4.0 (https://creativecommons.org/licenses/by-sa/4.0)", "credit": "King of Hearts. CC BY-SA 4.0, via Wikimedia Commons.", "rights_status": "clear", "source_url": "https://commons.wikimedia.org/wiki/File:Emily_M_Bender_CHM_Mountain_View_March_2025.jpg", "src": "photos/people-portraits/emily-bender-commons.jpg"}, "media": [{"title": "Mystery AI Hype Theater 3000 (podcast with Alex Hanna, DAIR)", "url": "https://www.dair-institute.org/projects/mystery-ai-hype-theater-3000", "kind": "podcast"}], "sources": ["https://en.wikipedia.org/wiki/Emily_M._Bender", "E. M. Bender and A. Koller, 'Climbing towards NLU: On Meaning, Form, and Understanding in the Age of Data', ACL 2020, pp. 5185-5198, https://aclanthology.org/2020.acl-main.463/", "Bender, Gebru, McMillan-Major and Shmitchell, FAccT '21, https://doi.org/10.1145/3442188.3445922", "G. Rak, 'What Emily Bender Really Meant by \"Stochastic Parrots\"', IEEE Spectrum, 2026-06-30, https://spectrum.ieee.org/stochastic-parrot"], "confidence": "high", "links": {"summary": [[170, 176, "p:Daphne Koller"], [563, 575, "p:Timnit Gebru"], [605, 622, "p:Margaret Mitchell"]]}}, {"id": "julia-angwin", "name": "Julia Angwin", "born": null, "died": null, "woman": true, "roles": ["investigative journalist", "newsroom founder", "author"], "affiliations": ["ProPublica (senior reporter, 2014-2018)", "The Markup (co-founder, editor-in-chief, 2018-2023)", "Proof News (founder, 2024)", "The Wall Street Journal (2000-2013)"], "summary": "Julia Angwin is an investigative journalist who studied mathematics at the University of Chicago. At the Wall Street Journal Angwin shared the 2003 Pulitzer Prize for Explanatory Reporting. In 2016, at ProPublica, Angwin was lead author of 'Machine Bias', with Jeff Larson, Surya Mattu and Lauren Kirchner. The team examined the COMPAS risk scores given to more than 7,000 people arrested in Broward County, Florida, and found that the tool wrongly flagged Black defendants as likely to reoffend at nearly twice the rate of white defendants. The story was a 2017 Pulitzer finalist and set off a long debate about what 'fair' means for an algorithm. Angwin went on to co-found The Markup, a newsroom that investigates technology, and in 2024 founded Proof News.", "contributions": [{"event_id": "propublica-machine-bias", "text": "Lead author of ProPublica's 'Machine Bias' (2016-05-23), which tested the COMPAS risk scores of more than 7,000 people arrested in Broward County, Florida, against their later arrest records and found racially unequal error rates."}], "lenses": ["core", "philosophy"], "penn_connection": "", "portrait": {"url": "https://commons.wikimedia.org/wiki/File:Julia_Angwin_Headshot.jpg", "license": "CC BY-SA 4.0 (https://creativecommons.org/licenses/by-sa/4.0)", "credit": "Wikisolipsist. CC BY-SA 4.0, via Wikimedia Commons.", "rights_status": "clear", "source_url": "https://commons.wikimedia.org/wiki/File:Julia_Angwin_Headshot.jpg", "src": "photos/people-portraits/julia-angwin-commons.jpg"}, "media": [{"title": "'5 questions on data and accountability with Julia Angwin' (MIT Media Lab)", "url": "https://www.media.mit.edu/articles/5-questions-on-data-and-accountability-with-julia-angwin/", "kind": "interview"}], "sources": ["https://en.wikipedia.org/wiki/Julia_Angwin", "Knight First Amendment Institute at Columbia, bio, https://knightcolumbia.org/bios/view/julia-angwin-1", "Angwin, Larson, Kirchner and Mattu, 'Machine Bias', ProPublica, 2016-05-23, https://www.propublica.org/article/machine-bias-risk-assessments-in-criminal-sentencing", "Julia Angwin, personal site, https://juliaangwin.com/", "ProPublica, 'Pulitzer Prize Finalist: Explanatory Reporting' (Machine Bias, 2017), https://www.propublica.org/awards/pulitzer-prize-finalist-explanatory-reporting"], "confidence": "high", "links": {"summary": [[241, 253, "e:propublica-machine-bias"]]}}, {"id": "regina-barzilay", "name": "Regina Barzilay", "born": "1970", "died": null, "woman": true, "roles": ["computer scientist", "natural language processing researcher", "AI-for-medicine researcher"], "affiliations": ["MIT (School of Engineering Distinguished Professor of AI and Health; faculty since 2003)", "MIT CSAIL", "MIT Jameel Clinic (AI faculty lead)", "Columbia University (PhD 2003)", "Ben-Gurion University of the Negev (BA 1993, MS 1998)"], "summary": "Regina Barzilay was born in Chisinau, Moldova, in 1970 and moved to Israel at 20, studying at Ben-Gurion University before a PhD at Columbia. Barzilay joined MIT in 2003 and first worked on how computers read and write human language. After a breast cancer diagnosis in 2014, Barzilay turned that expertise toward medicine, building tools that predict breast cancer risk from mammograms. In 2020 Barzilay and the biologist James Collins, the two senior authors, reported that a deep-learning model had flagged halicin, a compound once studied as a diabetes drug, as a powerful antibiotic; it killed drug-resistant bacteria in lab tests and in mice, though it is not an approved drug. Barzilay received a MacArthur Fellowship in 2017 and in 2020 the first AAAI Squirrel AI Award for AI that benefits humanity.", "contributions": [{"event_id": "halicin-antibiotic-2020", "text": "Co-senior author, with James Collins, of the 2020 Cell paper in which a deep-learning model identified the antibiotic halicin."}], "lenses": ["core"], "penn_connection": "", "portrait": null, "media": [], "sources": ["https://en.wikipedia.org/wiki/Regina_Barzilay", "MIT News, 'Artificial intelligence yields new antibiotic' (2020-02-20), https://news.mit.edu/2020/artificial-intelligence-identifies-new-antibiotic-0220", "MIT News, 'MIT computer scientist Regina Barzilay wins MacArthur genius grant' (2017-10-11), https://news.mit.edu/2017/mit-computer-scienti
