In 1937 Claude Shannon showed that electrical switching circuits could carry out this kind of algebra, and digital computers rest on that idea. Boole called his logic his most valuable contribution to science. He died of pneumonia in 1864, aged 49, after lecturing in rain-soaked clothes.", "contributions": [{"event_id": "boole-laws-of-thought", "text": "Set out his algebra of logic, with true and false written as 1 and 0, in The Laws of Thought (1854), building on his 1847 Mathematical Analysis of Logic."}, {"event_id": "shannon-boolean-circuits", "text": "His two-valued algebra is what Claude Shannon showed switching circuits could compute in 1937."}], "lenses": ["pre-computing", "symbolic-and-math"], "penn_connection": "", "portrait": {"url": "https://commons.wikimedia.org/wiki/File:George_Boole_color.jpg", "license": "Public domain (Commons: PD-old-100)", "credit": "George Boole, c. 1864. Photographer unknown. Public domain, via Wikimedia Commons.", "rights_status": "clear", "source_url": "https://commons.wikimedia.org/wiki/File:George_Boole_color.jpg", "src": "photos/people-portraits/george-boole-c1864.jpg"}, "media": [], "sources": ["MacTutor History of Mathematics, 'George Boole', https://mathshistory.st-andrews.ac.uk/Biographies/Boole/", "Stanford Encyclopedia of Philosophy, 'George Boole', https://plato.stanford.edu/entries/boole/", "Shannon, C. E., 'A Symbolic Analysis of Relay and Switching Circuits', MIT master's thesis, 1937 (timeline event shannon-boolean-circuits)"], "confidence": "high", "batch": "logic", "links": {"summary": [[349, 364, "e:boole-laws-of-thought"], [522, 536, "p:Claude Shannon"]]}}, {"id": "gottlob-frege", "name": "Gottlob Frege", "born": "1848", "died": "1925", "woman": false, "roles": ["mathematician", "logician", "philosopher"], "affiliations": ["University of Jena (1874-1917)"], "summary": "Gottlob Frege was a German mathematician and philosopher who taught at the University of Jena for more than 40 years. In 1879 he published a short book called the Begriffsschrift, or 'concept script'. It gave logic an exact written notation for words like 'all' and 'some' and for every step of an argument. Modern logic grew from it, and so did the rule-based reasoning of later symbolic AI and automatic theorem provers. Frege's larger aim was to show that arithmetic follows from pure logic. In June 1902, as his second volume was at the printer, Bertrand Russell wrote to point out that one of its basic rules led to a contradiction. Frege added a hasty appendix but never finished the project. His work was barely noticed in his lifetime. His late diary shows bitter prejudice, including hatred of Jews.", "contributions": [{"event_id": "frege-begriffsschrift", "text": "Invented modern formal logic in his 1879 Begriffsschrift, with exact notation for 'all', 'some' and step-by-step inference."}], "lenses": ["pre-computing", "symbolic-and-math", "philosophy"], "penn_connection": "", "portrait": {"url": "https://commons.wikimedia.org/wiki/File:Young_frege.jpg", "license": "Public domain (Commons: PD-old)", "credit": "Gottlob Frege, c. 1879. Photographer unknown. Public domain, via Wikimedia Commons.", "rights_status": "clear", "source_url": "https://commons.wikimedia.org/wiki/File:Young_frege.jpg", "src": "photos/people-portraits/gottlob-frege-c1879.jpg"}, "media": [], "sources": ["MacTutor History of Mathematics, 'Gottlob Frege', https://mathshistory.st-andrews.ac.uk/Biographies/Frege/", "Stanford Encyclopedia of Philosophy, 'Gottlob Frege', https://plato.stanford.edu/entries/frege/", "Russell, B., letter to Frege, 16 June 1902, as dated in MacTutor (above)"], "confidence": "high", "batch": "logic", "links": {"summary": [[163, 178, "e:frege-begriffsschrift"], [559, 566, "p:Stuart Russell"]]}}, {"id": "david-hilbert", "name": "David Hilbert", "born": "1862", "died": "1943", "woman": false, "roles": ["mathematician"], "affiliations": ["University of Königsberg (1886-1895)", "University of Göttingen (1895-1930)"], "summary": "David Hilbert was a German mathematician, born near Königsberg, who made Göttingen a world centre for mathematics from 1895. At the 1900 International Congress of Mathematicians in Paris he set out 23 open problems that shaped much of the century's research. In the 1920s he launched a program to put all of mathematics on a secure base, with rules so exact that a proof could be checked mechanically. In a 1928 textbook with Wilhelm Ackermann he asked for a method that could decide whether any statement of logic is valid. Gödel's 1931 theorems, and the 1936 answers of Church and Turing, showed these hopes could not be fully met. Turing's answer defined what a computing machine is. On retiring in 1930 he ended a speech with 'We must know, we shall know.' He died in Göttingen in 1943.", "contributions": [{"event_id": "hilbert-problems", "text": "Presented his list of 23 problems in Paris in 1900. The second, proving arithmetic consistent, grew into his 1920s program."}, {"event_id": "hilbert-entscheidungsproblem", "text": "Posed the decision problem with Wilhelm Ackermann in 1928: is there a mechanical test for whether any logical statement is valid?"}, {"event_id": "church-turing-decision-problem", "text": "Church and Turing settled his decision problem in 1936. The answer was no."}], "lenses": ["pre-computing", "symbolic-and-math"], "penn_connection": "", "portrait": {"url": "https://commons.wikimedia.org/wiki/File:David_Hilbert,_1907.jpg", "license": "Public domain (Commons: PD-US-1923; published 1907)", "credit": "David Hilbert, 1907. Photographer unknown; published in American Journal of Mathematics 29(1), 1907. Public domain, via Wikimedia Commons.", "rights_status": "clear", "source_url": "https://commons.wikimedia.org/wiki/File:David_Hilbert,_1907.jpg", "src": "photos/people-portraits/david-hilbert-1907.jpg"}, "media": [], "sources": ["MacTutor History of Mathematics, 'David Hilbert', https://mathshistory.st-andrews.ac.uk/Biographies/Hilbert/", "Stanford Encyclopedia of Philosophy, 'Hilbert's Program', https://plato.stanford.edu/entries/hilbert-program/", "Stanford Encyclopedia of Philosophy, 'Turing Machines', https://plato.stanford.edu/entries/turing-machine/"], "confidence": "high", "batch": "logic", "links": {"summary": [[525, 532, "p:Kurt Gödel"], [572, 578, "p:Alonzo Church"], [583, 589, "p:Alan Turing"]]}}, {"id": "kurt-godel", "name": "Kurt Gödel", "born": "1906", "died": "1978", "woman": false, "roles": ["logician", "mathematician", "philosopher"], "affiliations": ["University of Vienna", "Institute for Advanced Study, Princeton (1940-1976)"], "summary": "Kurt Gödel was an Austrian logician, born in Brünn (now Brno, Czech Republic), who studied in Vienna and sat in on the Vienna Circle of philosophers. In September 1930, aged 24, he announced his incompleteness theorem. It showed that any consistent set of mechanical rules strong enough for ordinary arithmetic leaves some true statements it cannot prove. That ended Hilbert's hope of a complete, machine-checkable foundation for mathematics, and it fed directly into the 1936 work of Church and Turing on the limits of computation. Philosophers such as J.R. Lucas later used it to argue that minds are not machines. Gödel himself was more careful. In 1951 he said only that either the mind outruns every machine or some problems can never be solved. At Princeton his daily walking companion was Albert Einstein. Fearing poison, he stopped eating and died in 1978.", "contributions": [{"event_id": "godel-incompleteness", "text": "Proved in 1930-31 that any consistent, mechanically listed set of axioms rich enough for arithmetic leaves true statements unprovable."}, {"event_id": "lucas-minds-machines-godel", "text": "His theorem was the basis of Lucas's 1961 argument that minds are not machines, a conclusion Gödel himself did not draw outright."}], "lenses": ["pre-computing", "symbolic-and-math", "philosophy"], "penn_connection": "", "portrait": {"url": "https://commons.wikimedia.org/wiki/File:Young_Kurt_G%C3%B6del_as_a_student_in_1925.jpg", "license": "Public domain", "credit": "Unknown author Unknown author. Public domain, via Wikimedia Commons.", "rights_status": "verify", "source_url": "https://commons.wikimedia.org/wiki/File:Young_Kurt_G%C3%B6del_as_a_student_in_1925.jpg", "src": "photos/people-portraits/kurt-godel-student-c1925.jpg"}, "media": [{"title": "Oskar Morgenstern's account of Gödel's naturalisation (MacTutor)", "url": "https://mathshistory.st-andrews.ac.uk/Extras/Godel_naturalisation/", "kind": "article"}], "sources": ["MacTutor History of Mathematics, 'Kurt Gödel', https://mathshistory.st-andrews.ac.uk/Biographies/Godel/", "Stanford Encyclopedia of Philosophy, 'Kurt Gödel', https://plato.stanford.edu/entries/goedel/", "Stanford Encyclopedia of Philosophy, 'Hilbert's Program' (September 1930 Königsberg announcement), https://plato.stanford.edu/entries/hilbert-program/", "Internet Encyclopedia of Philosophy, 'The Lucas-Penrose Argument about Gödel's Theorem' (1951 Gibbs lecture), https://iep.utm.edu/lp-argue/"], "confidence": "high", "batch": "logic", "links": {"summary": [[195, 217, "e:godel-incompleteness"], [367, 376, "p:David Hilbert"], [485, 491, "p:Alonzo Church"], [496, 502, "p:Alan Turing"]]}}, {"id": "alonzo-church", "name": "Alonzo Church", "born": "1903", "died": "1995", "woman": false, "roles": ["logician", "mathematician", "philosopher"], "affiliations": ["Princeton University (1929-1967)", "University of California, Los Angeles (1967-1990)"], "summary": "Alonzo Church was an American logician who spent nearly 40 years on the Princeton faculty before moving to UCLA in 1967. In the early 1930s he invented the lambda calculus, a tiny formal language in which every calculation is done by rewriting symbols according to a few rules. In April 1936 he used it to show that Hilbert's decision problem has no solution: no mechanical method can decide every statement of logic. Alan Turing reached the same answer independently weeks later, then came to Princeton to write his PhD under Church. The idea that their definitions capture everything that can be computed by following rules is now called the Church-Turing thesis. John McCarthy later borrowed Church's lambda notation for Lisp, a leading AI programming language for decades. Church co-founded the Journal of Symbolic Logic in 1936 and edited its reviews for 43 years.", "contributions": [{"event_id": "church-turing-decision-problem", "text": "Showed in April 1936, just before Turing, that no algorithm can decide every statement of first-order logic."}, {"event_id": "turing-computable-numbers", "text": "Reviewed Turing's 1936 paper, coined the term 'Turing machine', and supervised Turing's Princeton PhD (1936-1938)."}, {"event_id": "lisp-1958", "text": "His lambda notation for defining functions was adopted by John McCarthy in Lisp."}], "lenses": ["pre-computing", "symbolic-and-math"], "penn_connection": "", "portrait": null, "media": [], "sources": ["MacTutor History of Mathematics, 'Alonzo Church', https://mathshistory.st-andrews.ac.uk/Biographies/Church/", "Stanford Encyclopedia of Philosophy, 'Alonzo Church', https://plato.stanford.edu/entries/church/", "Stanford Encyclopedia of Philosophy, 'Turing Machines', https://plato.stanford.edu/entries/turing-machine/", "Princeton Alumni Weekly memorial, 'Alonzo Church '24 *27', https://paw.princeton.edu/memorial/alonzo-church-24-27", "IEEE Computer Society, Computer Pioneers, 'Alonzo Church', https://history.computer.org/pioneers/church.html", "McCarthy, J., 'Recursive Functions of Symbolic Expressions and Their Computation by Machine, Part I', CACM 3(4), 1960, http://www-formal.stanford.edu/jmc/recursive.pdf"], "confidence": "high", "batch": "logic", "links": {"summary": [[316, 325, "p:David Hilbert"], [326, 342, "e:hilbert-entscheidungsproblem"], [418, 429, "p:Alan Turing"], [666, 679, "p:John McCarthy"], [724, 728, "e:lisp-1958"]]}}, {"id": "hubert-dreyfus", "name": "Hubert Dreyfus", "born": "1929", "died": "2017", "woman": false, "roles": ["philosopher", "AI critic"], "affiliations": ["Harvard University (BA, MA, PhD, 1951-1964)", "Massachusetts Institute of Technology (taught philosophy, 1960s)", "RAND Corporation (consultant; 'Alchemy and Artificial Intelligence', 1965)", "University of California, Berkeley (1968-2016)"], "summary": "Hubert Dreyfus was an American philosopher from Terre Haute, Indiana. He studied at Harvard and taught at MIT, where he met the first AI researchers and became their best-known critic. His 1965 paper for the RAND Corporation, 'Alchemy and Artificial Intelligence', compared AI to alchemy: impressive early results, but no real path to the goal. He argued that human skill rests on bodily, unspoken know-how that cannot be written down as rules. He drew this from European philosophers such as Heidegger. He expanded the case in What Computers Can't Do (1972). Many AI researchers were furious. When rule-based expert systems later fell short, many people felt he had been partly right. He joined Berkeley in 1968 and kept teaching until December 2016, a few months before his death. The Futurama character Professor Hubert Farnsworth is named after him.", "contributions": [{"event_id": "dreyfus-alchemy-ai-1965", "text": "Argued in a 1965 RAND paper that AI was like alchemy, because human know-how cannot be reduced to explicit rules."}], "lenses": ["philosophy", "symbolic-and-math"], "penn_connection": "", "portrait": {"url": "https://commons.wikimedia.org/wiki/File:Hubert_Dreyfus.jpg", "license": "CC BY-SA 3.0 DE (Wikimedia VRT permission ticket 2011060210009607)", "credit": "Hubert Dreyfus, 2011. Photo: Jörg Noller, CC BY-SA 3.0 DE, via Wikimedia Commons.", "rights_status": "clear", "source_url": "https://commons.wikimedia.org/wiki/File:Hubert_Dreyfus.jpg", "src": "photos/people-portraits/hubert-dreyfus-munich-2011.jpg"}, "media": [], "sources": ["UC Berkeley News, 'Hubert Dreyfus, preeminent philosopher and AI critic, dies at 87', 24 April 2017, https://news.berkeley.edu/2017/04/24/hubert-dreyfus/", "Times Higher Education, 'Hubert Dreyfus, 1929-2017', https://www.timeshighereducation.com/node/614265", "RAND Corporation, H. L. Dreyfus, 'Alchemy and Artificial Intelligence', P-3244, December 1965, https://www.rand.org/pubs/papers/P3244.html"], "confidence": "high", "batch": "logic", "links": {"summary": [[227, 262, "e:dreyfus-alchemy-ai-1965"]]}}, {"id": "daniel-dennett", "name": "Daniel Dennett", "born": "1942", "died": "2024", "woman": false, "roles": ["philosopher", "cognitive scientist", "writer"], "affiliations": ["University of California, Irvine (1965-1971)", "Tufts University (1971-2022)"], "summary": "Daniel Dennett was an American philosopher of mind who taught at Tufts University for five decades. He argued that a mind is what a brain does, not a separate ghostly substance, so in principle a machine could have one. In 'Where Am I?' (1978), a comic story he first improvised for a 1976 college talk, his brain sits in a vat in Houston while his body goes on a mission under Tulsa. The story asks where a person really is. He also proposed the 'intentional stance': we predict a person, an animal or a chess program by treating it as if it has beliefs and goals. In 1991 he chaired the committee that set the rules for the first Loebner Prize, a limited Turing test. In 2023 he warned that AI 'counterfeit people' threaten trust. He hosted cider-bottling days at his Maine farm.", "contributions": [{"event_id": "dennett-where-am-i-1978", "text": "Wrote 'Where Am I?', a thought-experiment story about a brain in a vat and a computer copy of a mind."}, {"event_id": "loebner-prize-1991", "text": "Chaired the prize committee that set the rules for the first Loebner Prize contest in 1991."}], "lenses": ["philosophy", "sci-fi", "chatbots"], "penn_connection": "", "portrait": {"url": "https://commons.wikimedia.org/wiki/File:Daniel_dennett_Oct2008_(portrait).JPG", "license": "CC BY-SA 3.0", "credit": "Daniel Dennett, 2008. Photo: Mathias Schindler, CC BY-SA 3.0, via Wikimedia Commons.", "rights_status": "clear", "source_url": "https://commons.wikimedia.org/wiki/File:Daniel_dennett_Oct2008_(portrait).JPG", "src": "photos/people-portraits/daniel-dennett-gottingen-2008.jpg"}, "media": [{"title": "Dan Dennett: The illusion of consciousness (TED, 2003)", "url": "https://www.ted.com/talks/dan_dennett_the_illusion_of_consciousness", "kind": "talk"}, {"title": "Daniel Dennett: 'Where Am I?' (MIT Press Reader)", "url": "https://thereader.mitpress.mit.edu/daniel-dennett-where-am-i", "kind": "article"}, {"title": "Dennett on AI: We must protect ourselves against 'counterfeit people' (Daily Nous, 2023)", "url": "https://dailynous.com/2023/05/17/dennett-on-ai-we-must-protect-ourselves-against-counterfeit-people/", "kind": "article"}], "sources": ["Tufts University, 'Remembering Daniel C. Dennett, University and Fletcher Professor of Philosophy Emeritus', April 2024, https://as.tufts.edu/news-events/news/remembering-daniel-c-dennett-university-and-fletcher-professor-philosophy-emeritus", "Tufts Daily, 'Daniel Dennett, Tufts professor emeritus and renowned philosopher, passes away at 82', May 2024, https://www.tuftsdaily.com/article/2024/05/daniel-dennett-tufts-professor-emeritus-and-renowned-philosopher-passes-away-at-82", "NCSE, 'Daniel C. Dennett, philosopher and evolution enthusiast, dies at 82' (citing the NYT obituary), https://ncse.ngo/daniel-c-dennett-philosopher-and-evolution-enthusiast-dies-82", "MIT Press Reader, 'Daniel Dennett: Where Am I?' (origin of the story in a 1976 Vassar colloquium), https://thereader.mitpress.mit.edu/daniel-dennett-where-am-i", "Dennett, D. C., 'Where Am I?', in Brainstorms (1978), text at https://www.lehigh.edu/~mhb0/Dennett-WhereAmI.pdf", "Shieber, S. M., 'Lessons from a Restricted Turing Test', 1994, https://arxiv.org/pdf/cmp-lg/9404002"], "confidence": "high", "batch": "logic", "links": {"summary": [[224, 235, "e:dennett-where-am-i-1978"], [632, 645, "e:loebner-prize-1991"], [657, 668, "e:turing-imitation-game-1950"]]}}, {"id": "nick-bostrom", "name": "Nick Bostrom", "born": "1973", "died": null, "woman": false, "roles": ["philosopher", "writer on AI risk"], "affiliations": ["Future of Humanity Institute, University of Oxford (2005-2024)", "Macrostrategy Research Initiative"], "summary": "Nick Bostrom is a Swedish-born philosopher who grew up as Niklas Boström in Helsingborg. He hated school, and as a teenager he found an anthology of German philosophy, read it in a forest clearing, and later described a sudden sense of what learning could do. After a PhD at the London School of Economics, he founded the Future of Humanity Institute at Oxford in 2005. He led it until Oxford closed it in April 2024. His 2014 book Superintelligence argued that an AI much smarter than people could pursue goals at odds with ours, and that keeping control of it is a central problem. Its best-known example imagines an AI told to make paperclips that turns everything it can reach into paperclips. Elon Musk and Bill Gates recommended the book. It helped move AI extinction risk from the fringe toward the mainstream.", "contributions": [{"event_id": "bostrom-superintelligence-2014", "text": "Argued in Superintelligence (2014) that controlling an AI smarter than humans is a defining problem, using the 'paperclip maximizer' as an example."}], "lenses": ["philosophy"], "penn_connection": "", "portrait": {"url": "https://commons.wikimedia.org/wiki/File:Nick_Bostrom_Collision_2019.jpg", "license": "CC BY 2.0", "credit": "Nick Bostrom at Collision 2019, Toronto. Photo: Stephen McCarthy/Collision via Sportsfile, CC BY 2.0, via Wikimedia Commons.", "rights_status": "clear", "source_url": "https://commons.wikimedia.org/wiki/File:Nick_Bostrom_Collision_2019.jpg", "src": "photos/people-portraits/nick-bostrom-collision-2019.jpg"}, "media": [{"title": "Nick Bostrom: What happens when our computers get smarter than we are? (TED, 2015)", "url": "https://www.ted.com/talks/nick_bostrom_what_happens_when_our_computers_get_smarter_than_we_are", "kind": "talk"}, {"title": "Raffi Khatchadourian, 'The Doomsday Invention' (The New Yorker, 23 November 2015)", "url": "https://www.newyorker.com/magazine/2015/11/23/doomsday-invention-artificial-intelligence-nick-bostrom", "kind": "article"}], "sources": ["Khatchadourian, R., 'The Doomsday Invention', The New Yorker, 23 November 2015, https://www.newyorker.com/magazine/2015/11/23/doomsday-invention-artificial-intelligence-nick-bostrom", "Nick Bostrom, curriculum vitae and home page, https://nickbostrom.com/cv.pdf and https://nickbostrom.com/", "Oxford University Press, Superintelligence: Paths, Dangers, Strategies (2014), https://global.oup.com/academic/product/superintelligence-9780199678112", "Asterisk Magazine, 'Looking Back at the Future of Humanity Institute', https://asteriskmag.com/issues/08/looking-back-at-the-future-of-humanity-institute"], "confidence": "high", "batch": "logic", "links": {"summary": [[432, 449, "e:bostrom-superintelligence-2014"]]}}, {"id": "donald-michie", "name": "Donald Michie", "born": "1923", "died": "2007", "woman": false, "roles": ["codebreaker", "geneticist", "AI researcher", "professor"], "affiliations": ["Government Code and Cypher School, Bletchley Park (Testery, then Newmanry), 1942-1945", "University of Edinburgh (Experimental Programming Unit 1965; Department of Machine Intelligence)", "Turing Institute, Glasgow (founder)"], "summary": "Donald Michie was a British codebreaker, geneticist and AI pioneer, born in Rangoon, Burma, in 1923. He joined Bletchley Park in 1942 and worked on Tunny, a German teleprinter cipher. He started in the Testery, which broke Tunny by hand, and then moved to Max Newman's section, the Newmanry, which ran Tommy Flowers's Colossus machines. After the war he trained as a geneticist. Around 1961 he built MENACE, a set of matchboxes filled with colored beads that learned to play noughts and crosses from wins and losses. At Edinburgh in the 1960s he founded one of Europe's first AI research groups, and his team's robot Freddy II assembled a toy car in 1973. That same year the Lighthill Report cut his funding, and his lab shrank to three people. He died in a car crash in 2007, together with his former wife, the biologist Anne McLaren.", "contributions": [{"event_id": "colossus-1944", "text": "Worked in the Newmanry, the Bletchley Park section that ran Colossus, as Max Newman's assistant from 1943 to 1945, and contributed to the design of the Mark 2 machines."}, {"event_id": "freddy-ii", "text": "Led the Edinburgh robotics work that produced Freddy II, which assembled a model car in 1973."}, {"event_id": "lighthill-report-1973", "text": "Saw his Edinburgh lab cut to three people after the Lighthill Report."}, {"event_id": "bbc-lighthill-debate", "text": "Argued AI's case against Lighthill in the 1973 televised debate at the Royal Institution."}], "lenses": ["core", "pre-computing"], "penn_connection": "", "portrait": {"url": "https://commons.wikimedia.org/wiki/File:Donald_Michie_teaching.jpg", "license": "CC BY-SA 3.0 (Commons extmetadata)", "credit": "Donald Michie teaching at the Turing Institute, Glasgow, 1 November 1986. Photo: Peter Mowforth (Commons user Petermowforth), CC BY-SA 3.0, via Wikimedia Commons; cropped.", "rights_status": "clear", "source_url": "https://commons.wikimedia.org/wiki/File:Donald_Michie_teaching.jpg", "src": "photos/people-portraits/donald-michie-turing-institute-1986-crop.jpg"}, "media": [{"title": "BBC TV 'Controversy': the Lighthill debate at the Royal Institution (1973), 81-minute video hosted by AIAI, University of Edinburgh", "url": "https://www.aiai.ed.ac.uk/events/lighthill1973/", "kind": "video"}, {"title": "'From Codebreaking to Computing: Remembrances of Bletchley Park 50 Years Later', interview with Donald Michie and I. J. Good (1992), Computer History Museum", "url": "https://www.computerhistory.org/collections/catalog/102645557", "kind": "interview"}, {"title": "Donald Michie archive web pages, AIAI, University of Edinburgh", "url": "https://www.aiai.ed.ac.uk/~dm/dm.html", "kind": "archive"}], "sources": ["GCHQ, 'Donald Michie', https://www.gchq.gov.uk/person/donald-michie", "B. Jack Copeland et al., Colossus: The Secrets of Bletchley Park's Codebreaking Computers (Oxford University Press, 2006), contributor biography, https://colossus-computer.com/authors.htm", "IEEE Computer Society, Computer Pioneers, 'Donald Michie', https://history.computer.org/pioneers/michie.html", "University of Edinburgh School of Informatics, 'Artificial Intelligence at Edinburgh: a history', https://www.inf.ed.ac.uk/about/AIhistory.html", "Margaret Boden, 'Donald Michie (1923-2007)', Nature 448:765 (2007); Stephen Muggleton, Guardian obituary, 10 July 2007 (not re-read: Guardian blocks fetching)"], "confidence": "high", "batch": "machines", "links": {"summary": [[302, 315, "p:Tommy Flowers"], [318, 326, "e:colossus-1944"], [617, 626, "e:freddy-ii"], [675, 691, "e:lighthill-report"]]}}, {"id": "w-grey-walter", "name": "W. Grey Walter", "born": "1910", "died": "1977", "woman": false, "roles": ["neurophysiologist", "roboticist", "cybernetician"], "affiliations": ["Burden Neurological Institute, Bristol (from 1939)", "Ratio Club (British cybernetics group)"], "summary": "William Grey Walter was a brain scientist, born in Kansas City, Missouri, in 1910, who moved to Britain as a child. From 1939 he worked at the Burden Neurological Institute in Bristol, where he was a pioneer of EEG, the recording of the brain's electrical activity. In spring 1948, in his spare time, he began building small battery-powered robots he called tortoises. Using a light sensor and a touch switch, they wandered toward moderate light, backed away from bright light and steered around obstacles. They looked surprisingly lifelike. Two early ones were named Elmer and Elsie, and later models performed daily at the 1951 Festival of Britain. A circuit he called CORA let a tortoise learn to link a whistle with light. He described this work in his 1953 book The Living Brain. A road accident in 1970 ended his research career, and he died in 1977.", "contributions": [{"event_id": "grey-walter-tortoises", "text": "Began building self-steering robot tortoises in spring 1948, among the first autonomous robots."}, {"event_id": "paris-cybernetics-1951", "text": "Attended the January 1951 Paris conference on calculating machines, sometimes called the first major AI conference."}, {"event_id": "grey-walter-cora", "text": "Added CORA, a learning circuit that let a tortoise associate a whistle with light (1951)."}], "lenses": ["core"], "penn_connection": "", "portrait": {"url": "https://commons.wikimedia.org/wiki/File:William_Grey_Walter_1949.jpg", "license": "CC BY-SA 4.0 (https://creativecommons.org/licenses/by-sa/4.0)", "credit": "Saidmann. CC BY-SA 4.0, via Wikimedia Commons.", "rights_status": "verify", "source_url": "https://commons.wikimedia.org/wiki/File:William_Grey_Walter_1949.jpg", "src": "photos/people-portraits/w-grey-walter-bbc-1949.jpg"}, "media": [{"title": "Allison Marsh, 'Meet the Roomba's Ancestor: The Cybernetic Tortoise', IEEE Spectrum, 28 February 2020", "url": "https://spectrum.ieee.org/meet-roombas-ancestor-cybernetic-tortoise", "kind": "article"}, {"title": "Science Museum Group, 'Cybernetic tortoise' (Bristol, 1950-1952), the surviving tortoise", "url": "https://collection.sciencemuseumgroup.org.uk/objects/co531614", "kind": "museum object"}, {"title": "The Grey Walter Online Archive, Bristol Robotics / UWE", "url": "https://ias.uwe.ac.uk/Robots/gwonline/gwonline.html", "kind": "archive"}], "sources": ["Science Museum Group, 'William Grey Walter 1910-1977' (people record), https://collection.sciencemuseumgroup.org.uk/people/ap28659/walter-william-grey", "Allison Marsh, 'Meet the Roomba's Ancestor: The Cybernetic Tortoise', IEEE Spectrum, 28 February 2020, https://spectrum.ieee.org/meet-roombas-ancestor-cybernetic-tortoise", "Owen Holland, The Grey Walter Online Archive, University of the West of England, https://ias.uwe.ac.uk/Robots/gwonline/gwonline.html"], "confidence": "high", "batch": "machines", "links": {"summary": [[358, 367, "e:grey-walter-tortoises"], [671, 675, "e:grey-walter-cora"]]}}, {"id": "tommy-flowers", "name": "Tommy Flowers", "born": "1905", "died": "1998", "woman": false, "roles": ["electrical engineer", "computer pioneer"], "affiliations": ["General Post Office Research Station, Dollis Hill", "Government Code and Cypher School, Bletchley Park (on loan, 1943-1945)"], "summary": "Tommy Flowers was a Post Office telephone engineer, born in Poplar, east London, in 1905. He served an apprenticeship at the Royal Arsenal in Woolwich and studied engineering at evening classes. At the Post Office research station at Dollis Hill he built telephone switching equipment from vacuum tubes, which most engineers then thought too unreliable to use in large numbers. In 1943 he proposed an all-electronic machine to help Bletchley Park attack Tunny, a German teleprinter cipher. Bletchley's codebreakers were doubtful, so his team built it anyway, working day and night for about ten months. Colossus ran its first job on 5 February 1944, and ten machines were working by the end of the war. Secrecy kept his achievement hidden until the 1970s. In 1957 he built ERNIE, the machine that picks Premium Bond winners. He died in 1998.", "contributions": [{"event_id": "colossus-1944", "text": "Designed and led the building of Colossus, the electronic codebreaking machine that went to work at Bletchley Park in February 1944."}], "lenses": ["pre-computing"], "penn_connection": "", "portrait": {"url": "https://commons.wikimedia.org/wiki/File:Tommy_Flowers.jpg", "license": "Public domain", "credit": "Unknown Unknown. Public domain, via Wikimedia Commons.", "rights_status": "verify", "source_url": "https://commons.wikimedia.org/wiki/File:Tommy_Flowers.jpg", "src": "photos/people-portraits/tommy-flowers-c1940.jpg"}, "media": [{"title": "IEEE Spectrum, 'Colossus computer IEEE milestone' (2024)", "url": "https://spectrum.ieee.org/colossus-computer-ieee-milestone", "kind": "article"}, {"title": "English Heritage blue plaque: Tommy Flowers, Dollis Hill (2023)", "url": "https://www.english-heritage.org.uk/visit/blue-plaques/tommy-flowers/", "kind": "article"}], "sources": ["English Heritage, 'Flowers, Tommy (1905-1998)', blue plaque biography, https://www.english-heritage.org.uk/visit/blue-plaques/tommy-flowers/", "IEEE Spectrum, 'Colossus computer IEEE milestone', https://spectrum.ieee.org/colossus-computer-ieee-milestone", "GCHQ, 'Tommy Flowers', https://www.gchq.gov.uk/person/tommy-flowers", "IEEE Computer Society, Computer Pioneers, 'Thomas H. (Tommy) Flowers', https://history.computer.org/pioneers/flowers.html", "University of Greenwich, 'Thomas \"Tommy\" Flowers MBE, 1905-1998', https://www.gre.ac.uk/portraits/alumni/thomas-tommy-flowers-mbe-1905-1998"], "confidence": "high", "batch": "machines", "links": {"summary": [[603, 611, "e:colossus-1944"]]}}, {"id": "konrad-zuse", "name": "Konrad Zuse", "born": "1910", "died": "1995", "woman": false, "roles": ["civil engineer", "inventor", "computer pioneer", "entrepreneur"], "affiliations": ["Henschel aircraft works, Berlin", "Zuse KG (founder)"], "summary": "Konrad Zuse was a German civil engineer, born in Berlin in 1910, who built some of the first working computers largely on his own. Wanting to automate the long calculations of engineering work, he set up a workshop in his parents' Berlin living room and finished his first machine, the mechanical Z1, in 1938. On 12 May 1941 he showed experts the Z3, built from telephone relays. It was the first working computer that was both programmable and fully automatic, though it read its program from punched film rather than storing it in memory. The Z3 was later destroyed in an Allied bombing raid on Berlin. During the war he also built special calculators for Henschel's radio-guided glide bomb. Around 1945 he designed Plankalkül, an early programming language, and used it to work out a chess program. In retirement he painted. He died in 1995.", "contributions": [{"event_id": "zuse-z3", "text": "Demonstrated the Z3 in Berlin on 12 May 1941, a programmable, fully automatic relay computer; later designed Plankalkül, whose manuscript includes a chapter on chess."}], "lenses": ["pre-computing"], "penn_connection": "", "portrait": {"url": "https://commons.wikimedia.org/wiki/File:Konrad_Zuse_(1992).jpg", "license": "CC BY-SA 3.0 (Commons extmetadata)", "credit": "Konrad Zuse, June 1992. Photo: Wolfgang Hunscher, Dortmund, CC BY-SA 3.0, via Wikimedia Commons.", "rights_status": "clear", "source_url": "https://commons.wikimedia.org/wiki/File:Konrad_Zuse_(1992).jpg", "src": "photos/people-portraits/konrad-zuse-1992.jpg"}, "media": [{"title": "German Patent and Trade Mark Office (DPMA), 'Konrad Zuse' (computer pioneers series, in German)", "url": "https://dpma.de/dpma/veroeffentlichungen/meilensteine/computer-pioniere/zuse/index.html", "kind": "article"}, {"title": "Deutsches Museum Archive, Zuse papers NL 207/0247: 'Der Plankalkül, Kapitel 5' (chess theory and program typescript)", "url": "https://digital.deutsches-museum.de/en/digital-catalogue/archive-item/NL%2520207%252F0247/", "kind": "archive"}], "sources": ["MacTutor History of Mathematics, 'Konrad Zuse', https://mathshistory.st-andrews.ac.uk/Biographies/Zuse/", "Deutsches Patent- und Markenamt, 'Konrad Zuse', https://dpma.de/dpma/veroeffentlichungen/meilensteine/computer-pioniere/zuse/index.html", "Deutsches Museum Archive, NL 207/0247 and NL 207/0236 (Plankalkül manuscripts), https://digital.deutsches-museum.de/en/digital-catalogue/archive-item/NL%2520207%252F0247/", "Raúl Rojas, 'Konrad Zuse's legacy: the architecture of the Z1 and Z3', IEEE Annals of the History of Computing 19(2), 1997"], "confidence": "high", "batch": "machines", "links": {"summary": [[347, 349, "e:zuse-z3"]]}}, {"id": "seymour-papert", "name": "Seymour Papert", "born": "1928", "died": "2016", "woman": false, "roles": ["mathematician", "computer scientist", "educator"], "affiliations": ["University of the Witwatersrand", "University of Cambridge", "University of Geneva (with Jean Piaget)", "MIT AI Lab (co-director)", "MIT Media Lab (founding faculty, 1985)"], "summary": "Seymour Papert was a mathematician, born in Pretoria, South Africa, in 1928, who was a leading anti-apartheid activist as a student. In Geneva he worked with the psychologist Jean Piaget on how children come to understand ideas. He joined MIT in 1963, and Marvin Minsky soon made him co-director of the AI Lab. With Minsky he wrote Perceptrons (1969), a book of proofs about what simple one-layer neural networks cannot learn. It is often blamed for pushing neural networks to the margins for years, though historians debate whether it caused that decline or only confirmed it. Papert's deepest interest was children. In the late 1960s he and colleagues created Logo, a programming language in which children steer a 'turtle' to draw. His 1980 book Mindstorms argued that children learn best by building things. He was badly hurt in a road accident in Hanoi in 2006 and died in 2016.", "contributions": [{"event_id": "minsky-perceptrons-1969", "text": "Co-wrote Perceptrons (1969) with Marvin Minsky, proving limits on what one-layer networks can learn."}], "lenses": ["core"], "penn_connection": "", "portrait": {"url": "https://commons.wikimedia.org/wiki/File:Papert-moscow-1987.jpg", "license": "CC BY-SA 4.0", "credit": "Seymour Papert lecturing in Moscow, 1987. Photo: Wikimedia Commons user Shen-montpellier, CC BY-SA 4.0, via Wikimedia Commons.", "rights_status": "clear", "source_url": "https://commons.wikimedia.org/wiki/File:Papert-moscow-1987.jpg", "src": "photos/neural-network-revival/NN-papert-moscow-1987.jpg"}, "media": [{"title": "MIT Media Lab, 'In memory: Seymour Papert' (2016)", "url": "https://www.media.mit.edu/posts/in-memory-seymour-papert/", "kind": "article"}, {"title": "ACM, 'In Memoriam: Seymour Papert, 1928-2016', Communications of the ACM", "url": "https://cacm.acm.org/news/in-memoriam-seymour-papert-1928-2016", "kind": "article"}], "sources": ["MIT News, 'Professor Emeritus Seymour Papert, pioneer of constructionist learning, dies at 88' (1 August 2016), https://news.mit.edu/2016/seymour-papert-pioneer-of-constructionist-learning-dies-0801", "Communications of the ACM, 'In Memoriam: Seymour Papert, 1928-2016', https://cacm.acm.org/news/in-memoriam-seymour-papert-1928-2016", "Marvin Minsky and Seymour Papert, Perceptrons: An Introduction to Computational Geometry (MIT Press, 1969)", "Seymour Papert, Mindstorms: Children, Computers, and Powerful Ideas (Basic Books, 1980)"], "confidence": "high", "batch": "machines", "links": {"summary": [[256, 269, "p:Marvin Minsky"], [332, 343, "e:minsky-perceptrons-1969"]]}}, {"id": "terry-winograd", "name": "Terry Winograd", "born": "1946", "died": null, "woman": false, "roles": ["computer scientist", "professor", "human-computer interaction researcher"], "affiliations": ["MIT AI Lab (PhD 1970)", "Stanford University (Professor of Computer Science, now emeritus)", "Xerox PARC", "Computer Professionals for Social Responsibility (founding member)"], "summary": "Terry Winograd is an American computer scientist, born in 1946, who grew up in Colorado. As a PhD student at MIT's AI Lab from 1968 to 1970 he wrote SHRDLU, a program that held a typed conversation in English about a simulated table of colored blocks. It could follow commands, answer questions and work out what words like 'it' referred to. It was a celebrated demonstration, but it worked only because its tiny world was completely described inside the program, and Winograd came to doubt that the approach would grow to real language. At Stanford he turned to how people use computers. His 1986 book with Fernando Flores argued that computers do not understand the way people do. He was a founding member of Computer Professionals for Social Responsibility. In the 1990s he advised a Stanford PhD student named Larry Page, who went on to co-found Google.", "contributions": [{"event_id": "shrdlu-1971", "text": "Wrote SHRDLU (1968-1970, thesis published 1971), which held English conversations about a simulated world of blocks."}, {"event_id": "shakey-funding-ends", "text": "Named on this card because SHRDLU, like Shakey, worked only in a small, fully described world."}], "lenses": ["chatbots", "symbolic-and-math"], "penn_connection": "", "portrait": {"url": "https://commons.wikimedia.org/wiki/File:WinogradSkeleton.jpg", "license": "CC BY-SA 2.0 (Commons extmetadata; from Flickr user boltron)", "credit": "Terry Winograd at the CHI 2006 conference, 26 April 2006. Photo: boltron (Flickr), CC BY-SA 2.0, via Wikimedia Commons.", "rights_status": "clear", "source_url": "https://commons.wikimedia.org/wiki/File:WinogradSkeleton.jpg", "src": "photos/people-portraits/terry-winograd-chi-2006.jpg"}, "media": [{"title": "Terry Winograd: An Oral History, interviewed by Richard Fikes, Stanford Historical Society, February 2023", "url": "https://purl.stanford.edu/nf125cg4115", "kind": "oral history"}, {"title": "Terry Winograd, 'Procedures as a Representation for Data in a Computer Program for Understanding Natural Language', MIT AI TR-235 (1971)", "url": "https://dspace.mit.edu/handle/1721.1/7095", "kind": "thesis"}], "sources": ["Online Archive of California, 'Winograd (Terry Allen) Papers, 1963-2006', Stanford Special Collections, biographical note, https://oac.cdlib.org/findaid/ark:/13030/c89k4cp6/admin/", "Stanford Historical Society, 'Terry Winograd: An Oral History' (2023), abstract, https://purl.stanford.edu/nf125cg4115", "Terry Winograd, MIT AI Technical Report 235 (1971), https://dspace.mit.edu/handle/1721.1/7095", "Terry Winograd and Fernando Flores, Understanding Computers and Cognition: A New Foundation for Design (Ablex, 1986)", "Terry Winograd, curriculum vitae (updated August 2025), https://sites.google.com/view/terrywinogradhomepage/home/winograd-cv"], "confidence": "high", "batch": "machines", "links": {"summary": [[149, 155, "e:shrdlu-1971"]]}}, {"id": "kenneth-colby", "name": "Kenneth Colby", "born": "1920", "died": "2001", "woman": false, "roles": ["psychiatrist", "psychoanalyst", "AI researcher", "professor"], "affiliations": ["Yale University (BA 1941, MD 1943)", "San Francisco Institute of Psychoanalysis", "Stanford University (Computer Science; Stanford AI Laboratory)", "UCLA (Psychiatry and Computer Science, from 1974)", "Malibu Artificial Intelligence Works (co-founder, 1989)"], "summary": "Kenneth Colby was an American psychiatrist, born in Waterbury, Connecticut, in 1920. He trained at Yale and practiced as a psychoanalyst, but grew frustrated that therapy produced so little reliable evidence. In the early 1960s he moved into computing at Stanford, hoping that computer models could make psychiatry more scientific. At the Stanford AI Lab he built PARRY (1971), a program that played a patient with paranoid schizophrenia and kept track of its own simulated fear, anger and mistrust. In a 1972 test, psychiatrists reading transcripts did no better than chance at spotting PARRY. That year PARRY also 'met' Joseph Weizenbaum's ELIZA over the ARPANET, in a comic exchange between two programs. At UCLA from 1974, he built a word-finding aid for people who had lost speech and, with his son Peter, a program to help people with depression. A keen chess player, he died in 2001.", "contributions": [{"event_id": "parry-1971", "text": "Built PARRY (1971), a program that simulated a paranoid patient, and ran a test in which psychiatrists could not reliably tell it from real patients."}, {"event_id": "eliza-meets-parry-1972", "text": "His PARRY, running at Stanford, conversed with ELIZA's DOCTOR script over the ARPANET in September 1972."}], "lenses": ["chatbots", "philosophy"], "penn_connection": "", "portrait": null, "media": [{"title": "V. Cerf, 'PARRY Encounters the DOCTOR', RFC 439 (1973), the transcript", "url": "https://www.rfc-editor.org/rfc/rfc439", "kind": "document"}, {"title": "University of California, In Memoriam: Kenneth Mark Colby", "url": "https://senate.universityofcalifornia.edu/_files/inmemoriam/html/KennethMarkColby.htm", "kind": "article"}], "sources": ["University of California Academic Senate, 'Kenneth Mark Colby, Psychiatry and Biobehavioral Sciences: Los Angeles', In Memoriam, https://senate.universityofcalifornia.edu/_files/inmemoriam/html/KennethMarkColby.htm", "Colby, Weber and Hilf, 'Artificial Paranoia', Artificial Intelligence 2(1):1-25, 1971, https://doi.org/10.1016/0004-3702(71)90002-6", "Colby, Hilf, Weber and Kraemer, 'Turing-like Indistinguishability Tests for the Validation of a Computer Simulation of Paranoid Processes', Artificial Intelligence 3, 1972, https://doi.org/10.1016/0004-3702(72)90049-5", "Yale Medicine Magazine, 'In memoriam' (Kenneth M. Colby), http://web.archive.org/web/20250519062145/https://medicine.yale.edu/news/yale-medicine-magazine/article/in-memoriam-54362/ (archived copy of https://medicine.yale.edu/news/yale-medicine-magazine/article/in-memoriam-54362)"], "confidence": "high", "batch": "machines", "links": {"summary": [[364, 369, "e:parry-1971"], [622, 639, "p:Joseph Weizenbaum"], [642, 647, "e:eliza-1966"]]}}, {"id": "douglas-lenat", "name": "Douglas Lenat", "born": "1950", "died": "2023", "woman": false, "roles": ["computer scientist", "AI researcher", "entrepreneur"], "affiliations": ["University of Pennsylvania (BA mathematics, BA physics, MS applied mathematics, 1972)", "Stanford University (PhD 1976; faculty)", "Microelectronics and Computer Technology Corporation (MCC), Austin", "Cycorp (founder, CEO)"], "summary": "Douglas Lenat was an American computer scientist, born in Philadelphia in 1950. At the University of Pennsylvania he earned three degrees in four years, in mathematics, physics and applied mathematics. For his 1976 Stanford PhD he built AM, a program that explored elementary mathematics on its own and rediscovered ideas such as prime numbers. He came to believe that what programs like AM lacked was ordinary common sense. In 1984 he left Stanford for MCC, a research consortium in Austin, Texas, to start Cyc. The plan was to type millions of everyday facts into a computer by hand, such as that water makes things wet. He led Cyc for almost forty years, later through his company Cycorp. Supporters saw it as groundwork for real machine intelligence, and critics saw it as proof that hand-coding knowledge does not scale. He visited more than 100 countries. He died in 2023.", "contributions": [{"event_id": "cyc-1984", "text": "Left Stanford for MCC in Austin in 1984 to begin Cyc, a hand-built base of common-sense facts."}, {"event_id": "cyc-1984", "text": "Led Cyc for nearly forty years, the best-known attempt to hand-code common sense."}], "lenses": ["core", "symbolic-and-math"], "penn_connection": "Earned a BA in mathematics, a BA in physics and an MS in applied mathematics at the University of Pennsylvania, all in June 1972 (his Stanford-era CV; Dignity Memorial obituary).", "portrait": {"url": "https://commons.wikimedia.org/wiki/File:Dbl-smiling.jpg", "license": "CC BY-SA 4.0", "credit": "Doug Lenat in his office at Cycorp, 20 January 2015. Photo: LordRedthorn (Wikimedia Commons user), CC BY-SA 4.0, via Wikimedia Commons.", "rights_status": "clear", "source_url": "https://commons.wikimedia.org/wiki/File:Dbl-smiling.jpg", "src": "photos/expert-systems-and-winter/06-doug-lenat-at-cycorp-2015.jpg"}, "media": [{"title": "Lex Fridman Podcast #221, 'Douglas Lenat: Cyc and the Quest to Solve Common Sense Reasoning in AI' (15 September 2021)", "url": "https://lexfridman.com/douglas-lenat/", "kind": "interview"}, {"title": "Shepherd, Prakash and Lenat, 'CYC: Using Common Sense Knowledge to Overcome Brittleness and Knowledge Acquisition Bottlenecks', MCC memo (1986), Computer History Museum", "url": "https://www.computerhistory.org/collections/catalog/102719437", "kind": "document"}], "sources": ["Stanford Magazine, 'He Taught AI the Facts of Life' (2023), https://stanfordmag.org/contents/he-taught-ai-the-facts-of-life", "Dignity Memorial obituary, 'Douglas Lenat', https://www.dignitymemorial.com/obituaries/austin-tx/douglas-lenat-11426985", "Lenat CV (VITABI[AM,DBL]), SAIL archive, http://web.archive.org/web/20240114111614/https://saildart.org/VITABI[AM,DBL] (archived copy of https://www.saildart.org/VITABI[AM,DBL])", "Douglas B. Lenat, 'AM: An Artificial Intelligence Approach to Discovery in Mathematics as Heuristic Search', Stanford PhD thesis, 1976 (Commons file ADA155378.djvu)", "Nilsson, The Quest for Artificial Intelligence (2009/2010), https://web.archive.org/web/20231217215646/http://ai.stanford.edu/~nilsson/QAI/qai.pdf"], "confidence": "high", "batch": "machines", "links": {"summary": [[508, 511, "e:cyc-1984"]]}}, {"id": "john-hopfield", "name": "John Hopfield", "born": "1933", "died": null, "woman": false, "roles": ["physicist", "theoretical biologist", "neural-network pioneer"], "affiliations": ["Bell Laboratories (1958-1960)", "University of California, Berkeley", "Princeton University", "California Institute of Technology (1980-1997)", "Princeton University (Professor Emeritus of Molecular Biology)"], "summary": "John Hopfield is an American physicist who showed that ideas from physics could explain how a brain might remember. Both of his parents were physicists, and as a boy he was allowed to take apart anything in the house as long as he put it back together. He trained in solid-state physics at Cornell and Bell Labs, then turned to biology. In 1982, while at Caltech, he published a network of simple connected units that stores patterns and recalls a whole memory from a partial or noisy cue. Hopfield described it with an 'energy' picture borrowed from physics, where a memory is a valley the network rolls down into. The paper drew many physicists into neural-network research during the 1980s. In 2024 he shared the Nobel Prize in Physics with Geoffrey Hinton.", "contributions": [{"event_id": "hopfield-network-1982", "text": "Published his associative-memory network in PNAS in April 1982, showing how a network can recall a stored pattern from a partial cue."}, {"event_id": "nobel-prizes-2024", "text": "Shared the 2024 Nobel Prize in Physics with Geoffrey Hinton 'for foundational discoveries and inventions that enable machine learning with artificial neural networks'."}], "lenses": ["core"], "penn_connection": "", "portrait": {"url": "https://commons.wikimedia.org/wiki/File:John_Hopfield_at_2024_Nobel_Prize_Lectures_2.jpg", "license": "CC BY-SA 4.0", "credit": "John Hopfield giving his Nobel lecture, Stockholm, 8 Dec 2024. Photo: Jennifer 8. Lee, CC BY-SA 4.0, via Wikimedia Commons", "rights_status": "clear", "source_url": "https://commons.wikimedia.org/wiki/File:John_Hopfield_at_2024_Nobel_Prize_Lectures_2.jpg", "src": "photos/neural-network-revival/NN-hopfield-nobel-lecture-2024.jpg"}, "media": [{"title": "John Hopfield, Nobel Lecture in Physics 2024 (nobelprize.org)", "url": "https://www.nobelprize.org/prizes/physics/2024/hopfield/lecture/", "kind": "talk"}, {"title": "J. J. Hopfield, 'Neural networks and physical systems with emergent collective computational abilities', PNAS 79(8), April 1982", "url": "https://doi.org/10.1073/pnas.79.8.2554", "kind": "paper"}], "sources": ["Nobel Prize, 'John J. Hopfield, Facts' (Physics 2024), https://www.nobelprize.org/prizes/physics/2024/hopfield/facts/", "Franklin Institute, 'John J. Hopfield' (2019 Benjamin Franklin Medal in Physics), https://www.fi.edu/laureates/john-j-hopfield", "MacArthur Foundation, 'John J. Hopfield' (Fellow, 1983), https://www.macfound.org/fellows/189/", "Crossref record for Hopfield, PNAS 79(8):2554-2558, April 1982, doi:10.1073/pnas.79.8.2554", "Wikipedia, 'John Hopfield', https://en.wikipedia.org/wiki/John_Hopfield (pointer only)"], "confidence": "high", "batch": "neural", "links": {"summary": [[744, 759, "p:Geoffrey Hinton"]]}}, {"id": "david-rumelhart", "name": "David Rumelhart", "born": "1942", "died": "2011", "woman": false, "roles": ["cognitive psychologist", "mathematical psychologist", "neural-network pioneer"], "affiliations": ["Stanford University (PhD 1967; faculty 1987-1998)", "University of California, San Diego (1967-1987)"], "summary": "David Rumelhart was an American psychologist who helped bring neural networks back into AI in the 1980s. He grew up in South Dakota and paid his way through the state university partly by working as a custodian. After a Stanford PhD in mathematical psychology, he spent twenty years at UC San Diego building computer models of reading, memory and language. In the mid-1970s he moved away from rule-based models toward networks of simple units. In 1986 he was first author, with Geoffrey Hinton and Ronald Williams, of a short Nature paper showing how backpropagation lets a network several layers deep learn its own internal features. The same year he and James McClelland published Parallel Distributed Processing, two volumes that spread these ideas widely. He returned to Stanford in 1987. Pick's disease, a brain disorder like Alzheimer's, ended his career in 1998, and he died in 2011.", "contributions": [{"event_id": "backprop-nature-1986", "text": "First author of the October 1986 Nature paper with Hinton and Williams that showed how backpropagation trains networks with hidden layers."}], "lenses": ["core"], "penn_connection": "", "portrait": {"url": "https://commons.wikimedia.org/wiki/File:DavidRumelhart-IJCNNseattle1991-07-08.jpg", "license": "CC BY-SA 4.0", "credit": "David Rumelhart at IJCNN, Seattle, 8 July 1991. Photo: Rolf Kickuth, CC BY-SA 4.0, via Wikimedia Commons", "rights_status": "clear", "source_url": "https://commons.wikimedia.org/wiki/File:DavidRumelhart-IJCNNseattle1991-07-08.jpg", "src": "photos/neural-network-revival/NN-rumelhart-ijcnn-1991.jpg"}, "media": [{"title": "Rumelhart, Hinton and Williams, 'Learning representations by back-propagating errors', Nature 323 (1986), author PDF", "url": "https://www.cs.toronto.edu/~hinton/absps/naturebp.pdf", "kind": "paper"}, {"title": "The David E. Rumelhart Prize (Cognitive Science Society)", "url": "https://www.cognitivesciencesociety.org/rumelhart-prize/", "kind": "article"}], "sources": ["Association for Psychological Science, 'Remembering David E. Rumelhart (1942-2011)', APS Observer, 2011, https://www.psychologicalscience.org/observer/david-rumelhart", "Stanford News, 'David Rumelhart, pioneer in cognitive neuroscience, dies at 68' (2011-03-17), https://news.stanford.edu/stories/2011/03/david-rumelhart-pioneer-cognitive-neuroscience-dies-68", "Benedict Carey, 'David Rumelhart Dies at 68; Created Computer Simulations of Perception', New York Times, 2011-03-19, https://www.nytimes.com/2011/03/19/health/19rumelhart.html", "Wikipedia, 'David Rumelhart', https://en.wikipedia.org/wiki/David_Rumelhart (pointer only)", "Benedict Carey, 'David Rumelhart Dies at 68; Created Computer Simulations of Perception', New York Times, 2011-03-18, https://www.nytimes.com/2011/03/19/health/19rumelhart.html"], "confidence": "high", "batch": "neural", "links": {"summary": [[478, 493, "p:Geoffrey Hinton"], [551, 566, "e:backprop-nature-1986"]]}}, {"id": "alex-krizhevsky", "name": "Alex Krizhevsky", "born": null, "died": null, "woman": false, "roles": ["computer scientist", "deep-learning engineer"], "affiliations": ["University of Toronto (graduate student of Geoffrey Hinton)", "DNNresearch (co-founder, 2012)", "Google (2013-2017)", "Dessa (from 2017)"], "summary": "Alex Krizhevsky is the computer scientist whose name is on AlexNet, the network that set off the deep-learning boom. As a graduate student of Geoffrey Hinton at the University of Toronto, he had written fast code for running neural networks on gaming graphics cards. His labmate Ilya Sutskever persuaded him to try it on ImageNet, a huge contest for sorting photos into a thousand categories. Krizhevsky trained the network on a computer with two graphics cards in his bedroom at his parents' house. In autumn 2012 it won by a wide margin, with a top-5 error of 15.3 percent against 26.2 percent for the runner-up. He, Sutskever and Hinton formed a small company, DNNresearch, which Google bought in 2013. He left Google in 2017. Hinton later summed it up: 'Ilya thought we should do it, Alex made it work, and I got the Nobel Prize.'", "contributions": [{"event_id": "alexnet-2012", "text": "Built and trained AlexNet on two consumer graphics cards, writing the GPU code that made a large network practical; it won ImageNet 2012 and was presented in Florence in October 2012."}, {"event_id": "dnnresearch-2013", "text": "Co-founded DNNresearch with Hinton and Sutskever and joined Google when it bought the company in 2013."}], "lenses": ["core", "companies-and-money"], "penn_connection": "", "portrait": {"url": "https://web.cs.toronto.edu/news-events/news/three-papers-authored-by-u-of-t-computer-scientists-among-the-most-cited-of-the-21st-century-nature", "license": "unknown - verify (University of Toronto copyright)", "credit": "Ilya Sutskever, Geoffrey Hinton and Alex Krizhevsky (right), University of Toronto, 12 March 2013. Photo: Johnny Guatto / University of Toronto; permission required", "rights_status": "verify", "source_url": "https://web.cs.toronto.edu/news-events/news/three-papers-authored-by-u-of-t-computer-scientists-among-the-most-cited-of-the-21st-century-nature", "src": "photos/imagenet-alexnet-2012/03-sutskever-hinton-krizhevsky-uoft-2013.jpg"}, "media": [{"title": "Computer History Museum, 'CHM Releases AlexNet Source Code' (Hansen Hsu, March 2025)", "url": "https://computerhistory.org/blog/chm-releases-alexnet-source-code/", "kind": "article"}, {"title": "AlexNet source code (2012 version), Computer History Museum on GitHub", "url": "https://github.com/computerhistory/AlexNet-Source-Code", "kind": "archive"}, {"title": "Krizhevsky, Sutskever and Hinton, 'ImageNet Classification with Deep Convolutional Neural Networks', NeurIPS 2012", "url": "https://proceedings.neurips.cc/paper_files/paper/2012/file/c399862d3b9d6b76c8436e924a68c45b-Paper.pdf", "kind": "paper"}], "sources": ["Hansen Hsu, 'CHM Releases AlexNet Source Code', Computer History Museum blog, 2025-03-20, https://computerhistory.org/blog/chm-releases-alexnet-source-code/", "University of Toronto News, 'Neural net behind Geoffrey Hinton's Nobel Prize to be preserved by Computer History Museum', https://www.utoronto.ca/news/neural-net-behind-geoffrey-hinton-s-nobel-prize-be-preserved-computer-history-museum", "University of Toronto News, 'Google acquires U of T neural networks company' (2013-03-12), https://www.utoronto.ca/news/google-acquires-u-t-neural-networks-company", "Dave Gershgorn, 'The inside story of how AI got good enough to dominate Silicon Valley', Quartz, 2018-06-18 (for leaving Google in Sept 2017 and joining Dessa)", "Wikipedia, 'Alex Krizhevsky', https://en.wikipedia.org/wiki/Alex_Krizhevsky (pointer only)", "A. Krizhevsky, I. Sutskever and G. Hinton, 'ImageNet Classification with Deep Convolutional Neural Networks', NeurIPS 2012, https://papers.nips.cc/paper/2012/hash/c399862d3b9d6b76c8436e924a68c45b-Abstract.html", "TechCrunch, 'Google Scoops Up Neural Networks Startup DNNresearch', 2013-03-12, https://techcrunch.com/2013/03/12/google-scoops-up-neural-networks-startup-dnnresearch-to-boost-its-voice-and-image-search-tech"], "confidence": "high", "batch": "neural", "links": {"summary": [[59, 66, "e:alexnet-2012"], [142, 157, "p:Geoffrey Hinton"], [279, 293, "p:Ilya Sutskever"], [321, 329, "e:imagenet-cvpr-2009"], [664, 675, "e:dnnresearch-2013"]]}}, {"id": "john-jumper", "name": "John Jumper", "born": "1985", "died": null, "woman": false, "roles": ["chemist", "physicist", "AI researcher"], "affiliations": ["Vanderbilt University (BS 2007)", "University of Cambridge (MPhil, physics)", "D. E. Shaw Research", "University of Chicago (PhD chemistry, 2017)", "Google DeepMind (2017-2026)", "Anthropic (announced June 2026)"], "summary": "John Jumper is an American scientist who led the team that built AlphaFold, an AI system that predicts the 3D shape of a protein from its chain of amino acids. A protein's shape decides what it does in the body, and working it out in the lab can take years. Jumper grew up near Little Rock, Arkansas, and studied physics and mathematics at Vanderbilt. He began a physics PhD, left it, and wrote protein-simulation software at D. E. Shaw Research. He then earned a chemistry PhD at the University of Chicago, calling himself an 'accidental chemist'. He joined DeepMind in 2017 and within months was leading its protein work. AlphaFold2 won the CASP14 contest in 2020, and its 2021 Nature paper made the method public. In 2024, aged 39, he shared the Nobel Prize in Chemistry.", "contributions": [{"event_id": "alphafold2-casp14", "text": "Led the DeepMind team whose AlphaFold2 topped the CASP14 blind protein-structure contest in 2020."}, {"event_id": "alphafold-nature-2021", "text": "First author of the July 2021 Nature paper describing AlphaFold2, released with open code."}, {"event_id": "nobel-prizes-2024", "text": "Shared half of the 2024 Nobel Prize in Chemistry with Demis Hassabis 'for protein structure prediction'."}], "lenses": ["core"], "penn_connection": "", "portrait": {"url": "https://commons.wikimedia.org/wiki/File:John_Jumper,_2024_Nobel_Prize_Laureate_in_Chemistry_4.jpg", "license": "CC BY-SA 4.0", "credit": "John Jumper during Nobel Week, Stockholm, 7 Dec 2024. Photo: John Sears, CC BY-SA 4.0, via Wikimedia Commons", "rights_status": "clear", "source_url": "https://commons.wikimedia.org/wiki/File:John_Jumper,_2024_Nobel_Prize_Laureate_in_Chemistry_4.jpg", "src": "photos/alphago-alphafold-llms/05-jumper-nobel-portrait-2024.jpg"}, "media": [{"title": "John Jumper, Nobel Lecture in Chemistry 2024 (nobelprize.org)", "url": "https://www.nobelprize.org/prizes/chemistry/2024/jumper/lecture/", "kind": "talk"}, {"title": "Jumper et al., 'Highly accurate protein structure prediction with AlphaFold', Nature 596 (2021)", "url": "https://www.nature.com/articles/s41586-021-03819-2", "kind": "paper"}, {"title": "UChicago News, 'How an accidental chemist honed his approach at UChicago on the way to a Nobel Prize'", "url": "https://news.uchicago.edu/story/how-accidental-chemist-honed-his-approach-uchicago-way-nobel-prize", "kind": "article"}], "sources": ["Nobel Prize, 'John Jumper, Facts' (Chemistry 2024), https://www.nobelprize.org/prizes/chemistry/2024/jumper/facts/", "UChicago News, 'How an accidental chemist honed his approach at UChicago on the way to a Nobel Prize', https://news.uchicago.edu/story/how-accidental-chemist-honed-his-approach-uchicago-way-nobel-prize", "Vanderbilt Department of Mathematics, 'John Jumper (Math '07) wins Nobel Prize', http://web.archive.org/web/20241201163953/https://wp0.vanderbilt.edu/math/2024/10/john-jumper-math07-wins-nobel-prize/ (archived copy of https://wp0.vanderbilt.edu/math/2024/10/john-jumper-math07-wins-nobel-prize)", "Science Friday, 'John Jumper' (bio: D.E. Shaw Research, Cambridge MPhil, Vanderbilt BS), https://www.sciencefriday.com/person/john-jumper/", "TechCrunch, 'Nobel laureate John Jumper is leaving DeepMind for rival Anthropic', 2026-06-20, https://techcrunch.com/2026/06/20/nobel-laureate-john-jumper-is-leaving-deepmind-for-rival-anthropic"], "confidence": "high", "batch": "neural", "links": {"summary": [[65, 74, "e:alphafold2-casp14"], [559, 567, "e:google-buys-deepmind-2014"]]}}, {"id": "rich-sutton", "name": "Rich Sutton", "born": null, "died": null, "woman": false, "roles": ["computer scientist", "reinforcement-learning pioneer"], "affiliations": ["Stanford University (BA psychology, 1978)", "University of Massachusetts Amherst (MS 1980, ndrew Ng is a British-born American computer scientist who helped take deep learning into big companies and taught machine learning to millions of people. He studied at Carnegie Mellon, MIT and Berkeley and joined the Stanford faculty, where he later directed the AI Lab. In 2011 he started the Google Brain project. In 2012 its huge network, trained on frames from YouTube videos, learned to respond to cats without ever being told what a cat was. Even so, he told the New York Times, 'my gut feeling is that we still don't quite have the right algorithm yet.' In autumn 2011 his free online Stanford machine-learning course drew over 100,000 students. That led him and Daphne Koller to found Coursera in 2012. He was later chief scientist at Baidu and founded DeepLearning.AI.", "contributions": [{"event_id": "coursera-founded-2012", "text": "Co-founded Coursera with Daphne Koller in 2012, after his free online machine-learning course drew over 100,000 students."}], "lenses": ["companies-and-money", "core"], "penn_connection": "Penn was one of Coursera's four founding university partners, with Stanford, Princeton and Michigan (announced 18 April 2012). Source: Penn Today, 'Penn to offer online classes via Coursera', 18 April 2012, https://penntoday.upenn.edu/2012-04-19/latest-news/penn-offer-online-classes-coursera", "portrait": {"url": "https://commons.wikimedia.org/wiki/File:Andrew_Ng_WSJ.jpg", "license": "CC BY 2.0", "credit": "Andrew Ng at the WSJ CIO Network dinner on AI, 27 Feb 2017. Photo: Steve Jurvetson, CC BY 2.0, via Flickr / Wikimedia Commons (cropped)", "rights_status": "clear", "source_url": "https://commons.wikimedia.org/wiki/File:Andrew_Ng_WSJ.jpg", "src": "photos/people-portraits/andrew-ng-wsj-cio-2017.jpg"}, "media": [{"title": "NPR, 'A Massive Google Network Learns To Identify Cats' (2012-06-26)", "url": "https://www.npr.org/2012/06/26/155792609/a-massive-google-network-learns-to-identify", "kind": "article"}, {"title": "Machine Learning Specialization (Ng g in 2015 she joined Google. On the transformer paper, the authors' own note says she 'designed, implemented, tuned and evaluated countless model variants'. She then led work applying transformers to images. Later she co-founded two AI start-ups, Adept and Essential AI, with Vaswani, and by early 2025 she had joined Anthropic.", "contributions": [{"event_id": "attention-is-all-you-need", "text": "Co-author of the June 2017 transformer paper. Its contribution note says she designed, implemented, tuned and evaluated many of the model variants tested."}], "lenses": ["core", "chatbots"], "penn_connection": "", "portrait": {"url": "https://viterbischool.usc.edu/news/2023/03/attention-is-all-you-need-usc-alumni-paved-path-for-chatgpt/", "license": "unknown - verify (USC Viterbi news image, credited to Vaswani and Zoph)", "credit": "Niki Parmar (left) and Ashish Vaswani at their Image Transformer poster, probably 2018. Photo courtesy of Ashish Vaswani, via USC Viterbi School of Engineering; permission required", "rights_status": "verify", "source_url": "https://viterbischool.usc.edu/news/2023/03/attention-is-all-you-need-usc-alumni-paved-path-for-chatgpt/", "src": "photos/people-portraits/niki-parmar-vaswani-image-transformer-poster-2018.jpg"}, "media": [{"title": "Vaswani, Shazeer, Parmar et al., 'Attention Is All You Need' (arXiv 1706.03762, 2017)", "url": "https://arxiv.org/abs/1706.03762", "kind": "paper"}, {"title": "Parmar, Vaswani et al., 'Image Transformer' (arXiv 1802.05751, ICML 2018)", "url": "https://arxiv.org/abs/1802.05751", "kind": "paper"}, {"title": "USC Viterbi, ''Attention Is All You Need': USC Alumni Paved Path for ChatGPT' (March 2023)", "url": "https://viterbischool.usc.edu/news/2023/03/attention-is-all-you-need-usc-alumni-paved-path-for-chatgpt/", "kind": "article"}], "sources": ["USC Viterbi School of Engineering, ''Attention Is All You Need': USC Alumni Paved Path for ChatGPT', March 2023, https://viterbischool.usc.edu/news/2023/03/attention-is-all eredith Ringel Morris, known as Merrie, is an American computer scientist who studies how people work with computers and with each other through them. Her high school offered no programming classes. A summer science program at Carnegie Mellon gave her a first taste of coding, and she went on to study computer science at Brown and Stanford. At Microsoft Research she built some of the first tools for searching the web together, which earned her a place on MIT Technology Review's 2008 list of innovators under 35. She also founded Microsoft's Ability group, which designs technology with and for people with disabilities. At Google, and then Google DeepMind, she turned to human-centered AI. In November 2023 she led a paper proposing 'levels of AGI', a way to grade AI systems by how well and how broadly they perform.", "contributions": [{"event_id": "levels-of-agi-2023", "text": "Lead author of the November 2023 Google DeepMind paper 'Levels of AGI', which rates AI systems on performance and generality, from 'emerging' to 'superhuman'. It was published at ICML 2024."}], "lenses": ["philosophy"], "penn_connection": "", "portrait": {"url": "http://web.archive.org/web/20260217061619/https://cs.stanford.edu/~merrie/bio.html", "license": "unknown - verify (headshot on her personal homepage, no license stated)", "credit": "Meredith Ringel Morris, c. 2017. Courtesy of Meredith Ringel Morris; permission required", "rights_status": "verify", "source_url": "http://web.archive.org/web/20260217061619/https://cs.stanford.edu/~merrie/bio.html", "src": "photos/people-portraits/meredith-ringel-morris-headshot.jpg"}, "media": [{"title": "Morris et al., 'Levels of AGI for Operationalizing Progress on the Path to AGI' (arXiv 2311.02462; ICML 2024)", "url": "https://arxiv.org/abs/2311.02462", "kind": "paper"}, {"title": "The Gradient podcast, 'Meredith Morris: Generative AI's HCI Moment'", "url": "https://thegradientpub.substack.com/p/meredith-morris-generative-ai-hci", "kind": "interview"}, umbia in 1948 and taught biochemistry at Boston University. In his robot stories of the early 1940s he coined the word 'robotics'. In 'Runaround', published in March 1942, he set out the Three Laws of Robotics: a robot must not harm a human, must obey orders, and must protect itself, in that order. Most of his robot stories show how such simple rules go wrong. The laws are still a common starting point when people ask how to make AI behave. He wrote or edited close to 500 books and died in New York in 1992.", "contributions": [{"event_id": "asimov-three-laws-1942", "text": "Stated the Three Laws of Robotics in 'Runaround' (Astounding Science Fiction, March 1942), after coining 'robotics' in 'Liar!' (1941)."}], "lenses": ["sci-fi", "philosophy"], "penn_connection": "", "portrait": {"url": "https://commons.wikimedia.org/wiki/File:Isaac_Asimov,_RIT_NandE_Vol13Num29_1981_Sep24_Complete.jpg", "license": "Public domain (Commons: PD-US-1978-89, published without notice)", "credit": "Isaac Asimov at the Rochester Institute of Technology, 1981. RIT News & Events, 24 Sept 1981, via RIT Digital Archive / Wikimedia Commons. Public domain.", "rights_status": "clear", "source_url": "https://commons.wikimedia.org/wiki/File:Isaac_Asimov,_RIT_NandE_Vol13Num29_1981_Sep24_Complete.jpg", "src": "photos/people-portraits/isaac-asimov-rit-1981.jpg"}, "media": [{"title": "Isaac Asimov in conversation with Bill Moyers, A World of Ideas (PBS, October 1988)", "url": "https://billmoyers.com/tag/isaac-asimov/", "kind": "interview"}], "sources": ["Columbia University, C250 'Your Columbians: Isaac Asimov', https://c250.columbia.edu/c250_celebrates/your_columbians/isaac_asimov.html", "'Isaac Asimov dies at 72' (AP / NYT / LA Times obituary, Tampa Bay Times archive, 1992-04-07), https://www.tampabay.com/archive/1992/04/07/isaac-asimov-dies-at-72/", "Encyclopedia of Science Fiction, 'Laws of Robotics', https://sf-encyclopedia.com/entry/laws_of_robotics", "Encyclopaedia Britannica, 'Three Laws of Rob
